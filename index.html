<html lang="en">
<head>

<meta name="theme-color" content="#0c1420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script type="module">
  /* Social backend (Supabase) — an optional layer. If it fails to load the
     app still runs fully offline; only the Feed tab needs it. */
  (async function () {
    window.RC = window.RC || {};
    try {
      var mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      window.RC.sb = mod.createClient(
        "https://sfskyokfctaqzlbgztjx.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmc2t5b2tmY3RhcXpsYmd6dGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTc5ODgsImV4cCI6MjEwNDAzMzk4OH0.M46Y2x8PgvfR9HG5p3BKiNzIXsHSIrSPp8Ruhd_PXqY",
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } }
      );
    } catch (e) {
      console.warn("Rack Coach: social backend unavailable —", e && e.message);
    }
    window.dispatchEvent(new Event("rc-sb-ready"));
  })();
</script>

<style>
  /* social feed */
  .feed-preview { position: relative; margin-top: 18px; opacity: .55; pointer-events: none; user-select: none;
    -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent); }
  .feed-preview .fp-k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--text-faint); }
  .feed-card { border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px;
    background: var(--surface); margin: 10px 0; }
  .feed-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .feed-head b { font-size: var(--fs-md); }
  .feed-head span { font-size: var(--fs-sm); color: var(--text-faint); white-space: nowrap; }
  .feed-sub { font-size: var(--fs-sm); color: var(--text-muted); margin-top: 2px; }
  .feed-lifts { list-style: none; margin: 8px 0 0; padding: 0; }
  .feed-lifts li { font-size: var(--fs-sm); color: var(--text); padding: 2px 0;
    font-variant-numeric: tabular-nums; }
  .avatar { border-radius: 999px; object-fit: cover; display: inline-block; flex: none; background: var(--surface-2); }
  .avatar-fallback { display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; flex: none; }
  .feed-who { display: flex; align-items: center; gap: 8px; border: none; background: none; padding: 0;
    cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .kudos-btn { margin-top: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-muted);
    border-radius: 999px; padding: 5px 12px; font-size: var(--fs-sm); cursor: pointer; }
  .kudos-btn.given { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .kudos-count { margin-top: 8px; font-size: var(--fs-sm); color: var(--text-faint); }
</style>

<style>
  /* ============================================================
     THEME: "Arcane Teal" — the gem-glow teal from the reference
     figure carries the whole app. Light = aged paper ground,
     dark = arcane night. Amber = holding, red = missed.
     ============================================================ */
  :root {
    --bg: #e9e6da;           /* aged paper */
    --surface: #f7f5ef;
    --surface-2: #edece2;
    --line: #dbd7c8;
    --line-strong: #c4bda9;
    --text: #171c24;         /* blue-black ink */
    --text-muted: #575a54;
    --text-faint: #67665e;   /* ≥4.5:1 on bg, surface and surface-2 */
    --accent: #0d7d70;       /* arcane teal — actions, charts, active, emphasis; white text on it ≥4.5:1 */
    --accent-ink: #0a675c;   /* teal as text on the page ground */
    --accent-soft: #0f8a7c1c;
    --accent-text: #ffffff;  /* on the teal fill */
    --brand: #0f8a7c;
    --brand-soft: #0f8a7c1c;
    --wave: #0f8a7c;
    --gain: #0f8a7c;
    --hold: #9a6f26;
    --miss: #b5402c;
    --fig: #d9d3c1;          /* skinfold figure */
    --fig-line: #bdb49c;
    /* type scale — every font-size uses one of these */
    --fs-xs: 11px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 24px; --fs-2xl: 30px; --fs-hero: 46px;
    --radius: 13px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(18,18,14,.06), 0 10px 30px rgba(24,26,22,.09);
    --shadow-sheet: 0 -8px 40px rgba(18,20,16,.2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1420;         /* deep blue-black */
      --surface: #151f2c;    /* night panel */
      --surface-2: #1c2938;
      --line: #2a3745;
      --line-strong: #3b4c5d;
      --text: #e7e8e4;
      --text-muted: #9aa4a5;
      --text-faint: #8a959c;
      --accent: #35c8b6;
      --accent-ink: #59dccb;
      --accent-soft: #35c8b622;
      --accent-text: #04201c;
      --brand: #35c8b6;
      --brand-soft: #35c8b622;
      --wave: #35c8b6;
      --gain: #35c8b6;
      --hold: #d6a94e;
      --miss: #dd6047;
      --fig: #26374a;
      --fig-line: #3b5068;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.42);
      --shadow-sheet: 0 -10px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1420; --surface: #151f2c; --surface-2: #1c2938; --line: #2a3745;
    --line-strong: #3b4c5d; --text: #e7e8e4; --text-muted: #9aa4a5; --text-faint: #8a959c;
    --accent: #35c8b6; --accent-ink: #59dccb; --accent-soft: #35c8b622; --accent-text: #04201c;
    --brand: #35c8b6; --brand-soft: #35c8b622; --wave: #35c8b6; --gain: #35c8b6;
    --hold: #d6a94e; --miss: #dd6047; --fig: #26374a; --fig-line: #3b5068;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.42);
    --shadow-sheet: 0 -10px 44px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: var(--fs-md); line-height: 1.45;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  input, select { font: inherit; color: inherit; }
  /* iOS zooms the page when focusing a field under 16px — keep every editable field at 16px */
  input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea:not([readonly]) { font-size: 16px !important; }
  h1,h2,h3,h4 { font-family: "Barlow Condensed", "Archivo Narrow", sans-serif; font-weight: 600; line-height: 1.05; text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .app { max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

  /* header */
  .top {
    flex-shrink: 0; z-index: 30;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(11px, env(safe-area-inset-top)) 16px 11px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-lg); letter-spacing: .13em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .brand b { color: var(--accent-ink); font-weight: 700; }
  .brand .mark { width: 9px; height: 9px; border-radius: 2px; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .spacer { flex: 1; }
  .pos-chip { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-xs); color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
  .icon-btn { width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); border: 1px solid transparent; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 19px; height: 19px; }

  main { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 18px 16px calc(92px + env(safe-area-inset-bottom));
    background: var(--bg);
    transform: translateX(100%); visibility: hidden;
  }
  .screen.active { transform: translateX(0); visibility: visible; }
  .screen.anim { transition: transform .3s cubic-bezier(.32,.72,0,1); }
  .screen.lead { z-index: 2; }
  .screen.trail { z-index: 1; }
  .screen.from-right { transform: translateX(100%); }
  .screen.from-left  { transform: translateX(-26%); }
  .screen.to-left    { transform: translateX(-26%); }
  .screen.to-right   { transform: translateX(100%); }
  .screen.behind::after {
    content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.16); pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .screen.anim { transition: none; } }

  h2.title { font-size: var(--fs-xl); margin-bottom: 3px; }
  .lead { color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: 18px; max-width: 46ch; }
  .eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--text-faint); margin-bottom: 8px; }

  /* program cards */
  .prog-card {
    width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 15px; margin-bottom: 12px;
  }
  .prog-card:hover { border-color: var(--line-strong); }
  .prog-card h3 { font-size: var(--fs-xl); }
  .prog-card .by { font-size: var(--fs-xs); color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-top: 2px; }
  .prog-card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 9px; }
  .tag { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
  .prog-card p { font-size: var(--fs-sm); color: var(--text-muted); }
  .prog-card .best { font-size: var(--fs-sm); color: var(--text-faint); margin-top: 7px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-md);
    letter-spacing: .08em; text-transform: uppercase;
    border-radius: var(--radius-sm); padding: 0 18px; height: 48px; width: 100%;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line-strong); }
  .btn-danger { background: transparent; color: var(--miss); border: 1px solid color-mix(in srgb, var(--miss) 40%, var(--line)); }
  .btn-row { display: flex; gap: 9px; margin-top: 14px; }
  .btn-row .btn { flex: 1; }
  .btn.sm { height: 44px; font-size: var(--fs-sm); padding: 0 13px; width: auto; }

  .backlink { display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: 14px; }
  .backlink svg { width: 15px; height: 15px; }

  /* day/session preview */
  .day-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px; margin-bottom: 10px; }
  .day-block h4 { font-size: var(--fs-md); letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .day-block h4 .dtype { font-size: var(--fs-xs); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; letter-spacing: .08em; }
  .ex-line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
  .ex-line:last-child { border-bottom: none; }
  .ex-line .scheme { font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: var(--fs-sm); }
  .ex-line .wt { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
  .ex-line .scheme .wt { display: inline-block; min-width: 7ch; text-align: right; }   /* keeps the sets column lined up */

  .rule-box { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: var(--radius-sm); padding: 12px 13px; font-size: var(--fs-sm); color: var(--text); margin: 4px 0 16px; }
  .rule-box b { font-family: "Barlow Condensed"; letter-spacing: .04em; text-transform: uppercase; font-size: var(--fs-sm); color: var(--accent-ink); display: block; margin-bottom: 4px; }

  /* setup */
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--text-faint); margin-bottom: 7px; }
  .seg-ctl { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; }
  .seg-ctl button { flex: 1; padding: 8px 6px; border-radius: 6px; font-family: "Barlow Condensed"; font-weight: 600; font-size: var(--fs-sm); letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .seg-ctl button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .num-in { width: 100%; height: 44px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); font-family: "IBM Plex Mono", monospace; font-size: var(--fs-md); }

  .lift-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 9px; }
  .lift-row .lr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lift-row h4 { font-size: var(--fs-md); }
  .mini-seg { display: flex; gap: 2px; padding: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; }
  .mini-seg button { padding: 5px 9px; border-radius: 5px; font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted); font-family: "Barlow Condensed"; letter-spacing: .04em; text-transform: uppercase; }
  .mini-seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .lr-inputs { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .lr-inputs .fw { flex: 1; }
  .lr-inputs .fw span { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; display: block; margin-bottom: 4px; }
  .lr-result { margin-top: 9px; font-size: var(--fs-sm); color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .lr-result b { color: var(--accent-ink); font-weight: 600; }

  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .toggle-line:last-child { border-bottom: none; }
  .toggle-line .tl-k { font-size: var(--fs-sm); }
  .toggle-line .tl-k p { font-size: var(--fs-xs); color: var(--text-faint); margin-top: 1px; }
  .sw { width: 46px; height: 27px; border-radius: 999px; background: var(--line-strong); position: relative; flex-shrink: 0; transition: background .16s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 999px; background: #fff; transition: transform .16s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw[aria-checked="true"] { background: var(--accent); }
  .sw[aria-checked="true"]::after { transform: translateX(19px); }

  /* train screen */
  .next-card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  button.next-card:hover { border-color: var(--accent); }
  .next-card .nc-eye { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent-ink); }
  .next-card h3 { font-size: var(--fs-xl); margin: 3px 0 12px; }
  .nc-foot { margin-top: 10px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--text-faint); display: flex; align-items: center; gap: 5px; }
  .nc-foot span { font-size: var(--fs-md); line-height: 1; }
  .sc-sub { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 6px; }
  .sc-tag { margin-left: auto; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .09em; font-weight: 700; border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .sc-tag.next { background: var(--accent); color: var(--accent-text); }
  .sc-tag.done { border: 1px solid var(--line-strong); color: var(--text-faint); }
  .day-block.sc-past { opacity: .6; }
  .day-block.sc-past .ex-line { border-bottom-color: transparent; }
  .sc-tddays { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: var(--fs-sm); color: var(--text-muted); font-family: "IBM Plex Mono", monospace; margin-bottom: 8px; }
  .sc-tddays .k { font-family: "Archivo", sans-serif; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--text-faint); }
  .sc-tddays .e { margin-left: auto; color: var(--accent-ink); font-family: "Archivo", sans-serif; font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

  .day-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-picker button { height: 44px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-muted); font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-md); }
  .day-picker button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .nc-ex { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .nc-ex:last-of-type { border-bottom: none; }
  .nc-ex .nx-name { font-size: var(--fs-md); font-weight: 500; }
  .nc-ex .nx-set { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-sm); color: var(--text-muted); }
  .nc-ex .nx-w { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: var(--fs-sm); }

  .recent { margin-top: 20px; }
  .rec-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 7px; font-size: var(--fs-sm); }
  .rec-row .rr-day { font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-sm); min-width: 30px; max-width: 82px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .rec-row .rr-sum { flex: 1; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: var(--fs-sm); }
  .rec-row .rr-date { color: var(--text-faint); font-size: var(--fs-xs); }

  /* home screen */
  .home-quote { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; margin: 6px 0 4px; }
  .home-quote p { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: var(--fs-lg); line-height: 1.2; color: var(--text-muted); text-wrap: balance; }
  .home-quote span { display: block; margin-top: 5px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: var(--fs-xs); letter-spacing: .13em; text-transform: uppercase; color: var(--text-faint); }
  .home-hero { padding: 2px 0 4px; }

  .home-hero h2.title { font-size: var(--fs-2xl); margin: 4px 0 14px; }
  .home-hero .lead { margin-bottom: 22px; }
  .h-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .h-prog { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-xl); line-height: 1; display: inline-flex; align-items: center; gap: 7px; }

  .h-week { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent-ink); white-space: nowrap; }
  .home-secondary { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line-strong); }
  .btn.btn-lg { height: 58px; font-size: var(--fs-lg); }
  .home-links { display: flex; gap: 9px; margin-top: 10px; }
  .rest-ex { margin-top: 8px; }
  .rest-ex .rx-k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--text-faint); }
  .rx-reset { min-height: 44px; padding: 0 10px; color: var(--accent-ink); font-size: var(--fs-sm); font-weight: 600; }
  .rs-rule { margin-top: 10px; font-size: var(--fs-xs); color: var(--text-faint); text-align: center; }
  .rs-rule button { min-height: 44px; padding: 0 4px; color: var(--accent-ink); font-size: var(--fs-xs); font-weight: 600; }
  .rest-sel { min-height: 44px; min-width: 96px; padding: 0 30px 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text);
    font-family: "IBM Plex Mono", monospace; -webkit-appearance: none; appearance: none; text-align: center;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .filter-chips { display: flex; gap: 6px; overflow-x: auto; margin: 4px -16px 0; padding: 4px 16px 2px; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chips button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-muted); font-size: var(--fs-sm); font-weight: 600; }
  .filter-chips button[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .filter-all { display: block; margin: 14px auto 0; min-height: 44px; padding: 0 12px; color: var(--accent-ink); font-size: var(--fs-sm); font-weight: 600; }
  .home-alt { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .home-alt button { min-height: 44px; padding: 0 8px; color: var(--accent-ink); font-size: var(--fs-sm); font-weight: 600; }
  .home-alt span { color: var(--text-faint); }
  .home-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .home-stat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 13px; width: 100%; }
  .home-stat .hs-k { display: block; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; }
  .home-stat .hs-v { display: block; font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-lg); margin-top: 4px; line-height: 1; }
  .home-stat .hs-v small { font-size: var(--fs-sm); color: var(--text-muted); font-weight: 500; }
  .home-stat .hs-sub { display: block; font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; margin-top: 4px; }

  .grit-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin: 0 0 16px; }
  .grit-ring { width: 56px; height: 56px; flex: none; }
  .grit-ring .grit-num { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-lg); fill: var(--text); }
  .grit-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .grit-k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 700; }
  .grit-band { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-lg); line-height: 1; color: var(--accent-ink); }
  .grit-bars { display: flex; align-items: flex-end; gap: 3px; margin-top: 5px; }
  .grit-bars i { width: 7px; border-radius: 2px; display: block; }
  .grit-bars em { font-style: normal; font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--text-faint); margin-left: 6px; align-self: center; }

  /* pick-your-workout screen */
  .pick-card { position: relative; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; margin-bottom: 12px; }
  .pick-card:hover { border-color: var(--line-strong); }
  .pick-card.suggested { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .pick-card h3 { font-size: var(--fs-xl); }
  .pick-card .pk-badge { position: absolute; top: 13px; right: 13px; font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); background: var(--accent); border-radius: 5px; padding: 3px 7px 2px; }
  .pick-card .pk-dtype { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 600; margin-top: 1px; }
  .pick-card .pk-ex { margin-top: 10px; font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.6; }
  .pick-card .pk-w { font-family: "IBM Plex Mono", monospace; color: var(--text); font-size: var(--fs-sm); margin-left: 2px; white-space: nowrap; }

  /* session player */
  .player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1); }
  .player.show { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .player { transition: none; } }
  .pl-top { padding: max(12px, env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .pl-top .pl-x { color: var(--text-muted); }
  .pl-rail { flex: 1; display: flex; gap: 4px; }
  .pl-rail i { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
  .pl-rail i.done { background: color-mix(in srgb, var(--accent) 42%, var(--line)); }
  .pl-rail i.cur { position: relative; overflow: hidden; background: color-mix(in srgb, var(--accent) 22%, var(--line)); }
  .pl-rail i.cur b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
  .pe-hint { font-size: var(--fs-xs); color: var(--text-faint); text-align: center; margin-bottom: -2px; }
  .rs-saved { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--accent-ink); font-weight: 600; background: var(--accent-soft); padding: 6px 12px; border-radius: 999px; }
  .rs-saved svg { width: 16px; height: 16px; flex: none; }
  .rs-k { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .14em; color: var(--text-faint); font-weight: 700; margin-top: 18px; }
  .rs-dial { position: relative; width: 200px; height: 200px; margin: 6px auto 0; }
  .rs-dial svg { width: 100%; height: 100%; }
  .rs-clock { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(52px, 16vw, 72px); font-variant-numeric: tabular-nums; }
  .rs-adj { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .rs-adj .btn { width: 88px; }
  .rs-next { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: var(--fs-sm); color: var(--text-muted); }
  .rs-next span { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; color: var(--text-faint); font-weight: 700; }
  .rs-next b { font-family: "Barlow Condensed", sans-serif; font-size: var(--fs-lg); color: var(--text); }
  .pl-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vh 20px 24px; gap: 6px; overflow-y: auto; }
  .pl-ex { font-family: "Barlow Condensed"; font-weight: 600; font-size: var(--fs-xl); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .pl-setno { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .14em; color: var(--text-faint); font-weight: 700; }
  .pl-target { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(84px, 28vw, 148px); line-height: .92; letter-spacing: .01em; margin-top: 2px; }
  .pl-target .u { font-size: .32em; color: var(--text-muted); }
  /* fixed-height sub zone so the big number never jumps as tag/hint appear or vanish */
  .pl-sub { display: flex; flex-direction: column; align-items: center; gap: 9px; min-height: 96px; margin-top: 8px; }
  .pl-x-reps { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-xl); color: var(--text-muted); }
  .pl-tag { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; }
  .pl-tag.warm { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line); }
  .pl-tag.top { background: var(--accent); color: var(--accent-text); }
  .pl-hint { font-size: var(--fs-sm); color: var(--text-faint); max-width: 30ch; }
  .pl-actions { padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 9px; }
  .pl-actions .row2 { display: flex; gap: 9px; }
  .pl-actions .row2 .btn { flex: 1; }
  .pl-actions .pl-cw { width: 100%; height: 44px; font-size: var(--fs-sm); }
  .pl-effort { display: flex; align-items: center; gap: 6px; }
  .pl-effort .pe-k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--text-faint); margin-right: 2px; white-space: nowrap; }
  .pe-chip { flex: 1; height: 44px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: var(--fs-sm); font-weight: 500; }
  .pe-chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .pl-prow { display: flex; gap: 9px; }
  .pl-prow .pl-done { flex: 1; height: 60px; font-size: var(--fs-lg); }
  .pl-prow .pl-back { flex: 0 0 33%; height: 60px; font-size: var(--fs-sm); }
  .pl-prow .pl-back:disabled { opacity: .35; }
  .pl-count { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; }

  /* metcon player */
  #mc-bodywrap { display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 8px 16px 0; }
  .mc-format { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent-ink); }
  .mc-clock { font-size: clamp(64px, 22vw, 120px); font-weight: 500; line-height: 1; margin: 6px 0; letter-spacing: -.02em; }
  .mc-minute { font-size: var(--fs-sm); color: var(--text-muted); text-align: center; margin-bottom: 8px; min-height: 18px; }
  .mc-moves { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 6px; }
  .mc-move { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: var(--fs-sm); color: var(--text); }
  .mc-move .mc-chk { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); flex: none; }
  .mc-move.done { color: var(--text-faint); text-decoration: line-through; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .mc-move.done .mc-chk { background: var(--accent); border-color: var(--accent); }
  .mc-round-ctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; font-size: var(--fs-sm); color: var(--text-muted); }
  .mc-round-ctl button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: var(--fs-lg); color: var(--text); }
  .mc-round-ctl b { color: var(--text); font-size: var(--fs-md); }
  .mc-startbtn { height: 56px; font-size: var(--fs-lg); }
  .mc-cap { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-muted); margin-top: 4px; }
  .nc-wod { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: var(--fs-xl); margin: 3px 0 1px; }
  .nc-wod-sub { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 8px; }
  .mc-detail-sub { font-family: "IBM Plex Mono", monospace; font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 8px; }

  /* reorder sheet */
  .ro-list { margin: 6px 0 14px; }
  .ro-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 6px; background: var(--surface); font-size: var(--fs-md); }
  .ro-row.done { opacity: .5; }
  .ro-row .k2 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
  .ro-btns { display: flex; gap: 5px; flex-shrink: 0; }
  .ro-btns button { width: 36px; height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; font-size: var(--fs-sm); color: var(--text-muted); background: var(--surface-2); }
  .ro-btns button:disabled { opacity: .3; }
  .ro-btns button:active:not(:disabled) { background: var(--accent-soft); color: var(--accent-ink); }

  /* summary + progress */
  .statbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px 9px; }
  .stat .k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 600; }
  .stat .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-xl); margin-top: 2px; line-height: 1; }
  .stat .v small { font-size: var(--fs-sm); color: var(--text-muted); font-weight: 500; }
  .stat.hot .v { color: var(--accent-ink); }

  .change-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
  .change-row:last-child { border-bottom: none; }
  .change-row .cr-ic { width: 20px; text-align: center; font-weight: 700; }
  .change-row .cr-ic.up { color: var(--accent-ink); }
  .change-row .cr-ic.hold { color: var(--hold); }
  .change-row .cr-ic.deload { color: var(--miss); }
  .change-row .cr-w { margin-left: auto; font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: var(--fs-sm); }

  .lift-prog { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 9px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .lift-prog h4 { font-size: var(--fs-md); }
  .lift-prog .lp-sub { font-size: var(--fs-xs); color: var(--text-faint); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .lift-prog .lp-now { font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-lg); text-align: right; }
  .lift-prog .lp-now small { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 500; }
  .lift-prog .lp-now.has-now { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .lift-prog .lp-now .lp-w { display: block; }
  .lift-prog .lp-now .lp-since { font-family: "IBM Plex Mono", monospace; font-weight: 500;
    font-size: var(--fs-xs); letter-spacing: 0; text-transform: none; color: var(--text-faint); }
  svg.spark { width: 100%; height: 40px; display: block; margin-top: 6px; grid-column: 1 / -1; }

  .empty { text-align: center; padding: 40px 20px; }
  .empty .em-ic { font-size: var(--fs-2xl); opacity: .5; }
  .empty h3 { font-size: var(--fs-lg); margin: 12px 0 5px; }
  .empty p { color: var(--text-muted); font-size: var(--fs-sm); max-width: 34ch; margin: 0 auto 18px; }

  /* bottom tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar.show { display: flex; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--text-faint); border-radius: 10px; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button span { font-family: "Barlow Condensed"; font-weight: 600; font-size: var(--fs-xs); letter-spacing: .07em; text-transform: uppercase; }
  .tabbar button[aria-selected="true"] { color: var(--accent-ink); }

  /* home */
  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .home-head h2 { font-size: var(--fs-xl); }
  .home-head .pos { font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; }
  .snap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 18px; }
  .snap .s { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px; }
  .snap .s .k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
  .snap .s .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-lg); margin-top: 3px; line-height: 1; }
  .snap .s .v small { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 500; }

  /* line chart (weekly points) */
  svg.chart { width: 100%; height: 104px; display: block; margin-top: 10px; grid-column: 1 / -1; overflow: visible; }
  .chart-note { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--text-faint); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* body screen */
  .bw-hero { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .bw-hero .k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; }
  .bw-hero .big { font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-hero); line-height: 1; margin-top: 2px; }
  .bw-hero .big small { font-size: .36em; color: var(--text-muted); }
  .bw-hero .trend { font-size: var(--fs-sm); color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .meas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 4px; }
  .meas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
  .meas .k { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; }
  .meas .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: var(--fs-lg); margin-top: 2px; }
  .meas .v small { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 500; }
  .meas .d { font-size: var(--fs-xs); color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 1px; }
  .bf-toggle { width: 100%; margin-top: 8px; padding: 9px 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--accent-ink); font-size: var(--fs-sm); font-weight: 600; text-align: center; }
  .bf-calc { margin-top: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .bf-calc .seg-ctl { margin-bottom: 8px; background: var(--surface); }
  .bf-calc .seg-ctl button[aria-selected="true"] { background: var(--surface-2); }

  /* ============================================================ HELPERS */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function U() { return db.settings.unit; }
  function fmt(n) {
    if (n == null || isNaN(n)) return "0";

    return Number.isInteger(r) ? r.toString() : r.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shortDate(t) { return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
  function relDate(t) {
    var d = Math.round((dayKey(Date.now()) - dayKey(t)) / 86400000);   // calendar days, not 24-hour blocks

  function repRange(lo, hi) { return hi && hi > lo ? lo + "–" + hi : String(lo); }

  var TAB_SCREENS = { home: 1, progress: 1, body: 1, badges: 1, feed: 1 };
  var TAB_ORDER = ["home", "progress", "body", "badges", "feed"];
  // rough "depth" so a plain go() can infer push vs pop direction
  var DEPTH = { home: 0, progress: 0, body: 0, badges: 0, feed: 0, choose: 1, summary: 1, pick: 1, roll: 1, schedule: 1, detail: 2, setup: 3, editor: 3 };
  var cur = null, sliding = false;
  var SCR_RESET = ["anim", "from-right", "from-left", "to-left", "to-right", "behind", "lead", "trail"];
  function snapScreens() {
    Object.keys(screens).forEach(function (k) {
      SCR_RESET.forEach(function (c) { screens[k].classList.remove(c); });
      screens[k].classList.toggle("active", k === cur);
    });
    sliding = false;
  }

  function go(name, back) {
    if (sliding) snapScreens();
    if (name === cur) { renderChip(); renderTabs(); var rr = renderers[name]; if (rr) rr(); return; }
    var outgoing = cur ? screens[cur] : null;
    var incoming = screens[name];
    if (back == null && cur) back = (DEPTH[name] || 0) < (DEPTH[cur] || 0);
    cur = name;

    var r = renderers[name]; if (r) r();
    if (cur !== name) return;               // renderer redirected via its own go()
    incoming.scrollTop = 0;
    renderChip();
    renderTabs();

    var RESET = SCR_RESET;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!outgoing || reduce) {
      Object.keys(screens).forEach(function (k) {
        RESET.forEach(function (c) { screens[k].classList.remove(c); });
        screens[k].classList.toggle("active", k === name);
      });
      return;
    }

    sliding = true;
    // forward: incoming rides in on top from the right; back: outgoing slides off to the right, revealing incoming underneath
    incoming.classList.add("anim", "active", back ? "from-left" : "from-right", back ? "trail" : "lead");
    outgoing.classList.add("anim", back ? "lead" : "trail");
    if (!back) outgoing.classList.add("behind");
    void incoming.offsetWidth;                // reflow so the start transform sticks
    incoming.classList.remove("from-left", "from-right");
    outgoing.classList.add(back ? "to-right" : "to-left");

    var cleanup = function () {
      outgoing.removeEventListener("transitionend", cleanup);
      clearTimeout(t);
      RESET.forEach(function (c) { incoming.classList.remove(c); outgoing.classList.remove(c); });
      outgoing.classList.remove("active");
      sliding = false;
    };
    var t = setTimeout(cleanup, 420);
    outgoing.addEventListener("transitionend", cleanup);
  }

      ["bodybuilding", "Bodybuilding"],

      ["hyrox", "Hyrox"]

  // editorState (plan): { mode: "plan", plan, context: "setup" | "active" | "library" }
  // `plan` is a working copy; nothing is written back until Done / Save.
  function planChanges(t, orig) {
    var added = 0, swapped = 0, removed = 0;
    if (!orig) return { added: 0, swapped: 0, removed: 0, any: false };
    t.microcycle.forEach(function (d, di) {
      var kept = 0;
      d.slots.forEach(function (sl) { if (sl.added) added++; else kept++; if (sl.swappedFrom) swapped++; });
      var o = orig.microcycle[di]; if (o) removed += Math.max(0, o.slots.length - kept);
    });

  }

    return bits.length ? bits.join(" · ") : (ch.any ? "Sets and reps changed" : "No changes");
  }

      '<h2 class="title">' + (st.context === "setup" ? "Make it yours" : "Edit program") + '</h2>' +

    };
  }

  // a swapped-in lift starts from the weight of the lift it replaced, not the empty bar
  function seedSwappedLifts(t, lifts) {
    t.microcycle.forEach(function (d) { d.slots.forEach(function (sl) {
      if (sl.swappedFrom && !lifts[sl.exId] && lifts[sl.swappedFrom] && t.progression && t.progression[sl.exId]) seedLift(lifts, sl.exId, lifts[sl.swappedFrom].weight);
    }); });
  }

  // searchable, grouped exercise list shared by the editor and the workout player
  function pickExercise(title, cb) {
    var groups = {};
    Object.keys(EX).forEach(function (id) { var g = EX[id].grp || "Other"; (groups[g] = groups[g] || []).push(id); });
    var order = ["Push", "Pull", "Legs", "Arms", "Core"];
    var html = '<h2>' + esc(title) + '</h2>' +
      '<input class="num-in" id="ep-search" placeholder="Search exercises" autocomplete="off" style="margin-bottom:12px"><div id="ep-list">';
    order.concat(Object.keys(groups).filter(function (g) { return order.indexOf(g) < 0; })).forEach(function (g) {
      if (!groups[g]) return;
      html += '<div class="eyebrow" style="margin:12px 0 6px">' + esc(g) + '</div>';
      groups[g].forEach(function (id) {
        var lp = lastPerformance(id);
        html += '<button class="pick-item" data-ex="' + id + '"><span>' + esc(EX[id].name) + '</span>' +
          '<span class="k2">' + (lp ? (lp.weight ? fmt(lp.weight) + ' ' + U() + ' × ' + lp.reps : lp.reps + ' reps') : (EX[id].bw ? "bodyweight" : EX[id].bar ? "barbell" : "weighted")) + '</span></button>';
      });
    });
    openSheet(html + '</div><div class="btn-row"><button class="btn btn-ghost" id="ep-cancel">Cancel</button></div>');
    var search = document.getElementById("ep-search");
    search.oninput = function () {
      var q = search.value.trim().toLowerCase();
      sheetRoot.querySelectorAll(".pick-item").forEach(function (b) { b.style.display = !q || EX[b.dataset.ex].name.toLowerCase().indexOf(q) >= 0 ? "" : "none"; });
      sheetRoot.querySelectorAll("#ep-list .eyebrow").forEach(function (h) { h.style.display = q ? "none" : ""; });
    };
    document.getElementById("ep-cancel").onclick = closeSheet;
    sheetRoot.querySelectorAll(".pick-item").forEach(function (b) { b.onclick = function () { cb(b.dataset.ex); }; });
  }

  // sets / reps / weight for an exercise, pre-filled from last time.
  // opts: { cta, sets?, reps?, weight?, choice?: { every: "Every workout A" }, onBack?, onDone(sets, reps, weight, permanent) }
  function openSetsConfig(exId, opts) {
    var ex = EX[exId], isBw = !!ex.bw;
    var wStep = ex.bar ? eq().step : (U() === "lb" ? 5 : 2.5);
    var lp = lastPerformance(exId), sug = suggestedWeight(exId, lp);
    var progW = db.active && db.active.lifts && db.active.lifts[exId] ? db.active.lifts[exId].weight : null;
    var sets = opts.sets || (lp && lp.sets) || 3, reps = opts.reps || (lp && lp.reps) || (isBw ? 10 : 8);
    var w = opts.weight != null ? opts.weight : progW != null ? progW : sug != null ? sug : (ex.bar ? eq().bar : (U() === "lb" ? 20 : 10));
    var hint = lp ? 'Last time: ' + lp.sets + ' × ' + lp.reps + (lp.weight ? ' @ ' + fmt(lp.weight) + ' ' + U() : '') + ' · ' + shortDate(lp.date) +
        (sug != null && sug !== lp.weight ? ' — try ' + fmt(sug) + ' ' + U() : '') : 'First time logging this one.';
    var permanent = false;
    openSheet('<h2>' + esc(ex.name) + '</h2><p class="sh-lead">' + esc(hint) + '</p>' +
      '<div class="field-inline">' +
        '<div class="fi"><span>Sets</span><div class="stepper"><button data-f="s-">–</button><input class="mono" id="ac-s" inputmode="numeric" value="' + sets + '"><button data-f="s+">+</button></div></div>' +
        '<div class="fi"><span>Reps</span><div class="stepper"><button data-f="r-">–</button><input class="mono" id="ac-r" inputmode="numeric" value="' + reps + '"><button data-f="r+">+</button></div></div>' +
        (isBw ? '' : '<div class="fi"><span>Weight (' + U() + ')</span><div class="stepper"><button data-f="w-">–</button><input class="mono" id="ac-w" inputmode="decimal" value="' + fmt(w) + '"><button data-f="w+">+</button></div></div>') +
      '</div>' +
      (opts.choice ? '<div class="eyebrow" style="margin:12px 0 6px">Keep it</div><div class="seg-ctl" id="ac-keep">' +
        '<button data-v="0" aria-selected="true">Just today</button><button data-v="1" aria-selected="false">' + esc(opts.choice.every) + '</button></div>' +
        '<p class="ac-note" id="ac-note">Only this workout. You can still keep it from the summary.</p>' : '') +
      '<div class="btn-row">' + (opts.onBack ? '<button class="btn btn-ghost" id="ac-cancel">Back</button>' : '<button class="btn btn-ghost" id="ac-cancel">Cancel</button>') +
        '<button class="btn btn-primary" id="ac-add">' + esc(opts.cta) + '</button></div>');
    sheetRoot.querySelectorAll("[data-f]").forEach(function (b) {
      b.onclick = function () {
        var f = b.dataset.f, si = document.getElementById("ac-s"), ri = document.getElementById("ac-r"), wi = document.getElementById("ac-w");
        if (f === "s-") si.value = Math.max(1, (parseInt(si.value, 10) || 1) - 1);
        if (f === "s+") si.value = Math.min(10, (parseInt(si.value, 10) || 1) + 1);
        if (f === "r-") ri.value = Math.max(1, (parseInt(ri.value, 10) || 1) - 1);
        if (f === "r+") ri.value = (parseInt(ri.value, 10) || 1) + 1;
        if (f === "w-" && wi) wi.value = fmt(Math.max(0, (parseFloat(wi.value) || 0) - wStep));
        if (f === "w+" && wi) wi.value = fmt((parseFloat(wi.value) || 0) + wStep);
      };
    });
    var keep = document.getElementById("ac-keep");
    if (keep) keep.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        permanent = b.dataset.v === "1";
        keep.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
        document.getElementById("ac-note").textContent = permanent
          ? "Saved to your copy of the program. It goes up " + fmt(addedIncrement(exId)) + " " + U() + " when you hit every rep."
          : "Only this workout. You can still keep it from the summary.";
      };
    });
    document.getElementById("ac-cancel").onclick = opts.onBack || closeSheet;
    document.getElementById("ac-add").onclick = function () {
      var sN = Math.max(1, parseInt(document.getElementById("ac-s").value, 10) || 3);
      var rN = Math.max(1, parseInt(document.getElementById("ac-r").value, 10) || 8);
      var wN = isBw ? null : (parseFloat(document.getElementById("ac-w").value) || 0);
      if (ex.bar && wN != null) wN = roundLoad(wN, eq());
      opts.onDone(sN, rN, wN, permanent);
    };
  }

  function renderWorkoutBuilder(c) {
    var d = editorState.draft;
    if (d.kind === "metcon" && !d.wod) d.wod = { id: d.id, name: d.name, format: "amrap", scoreType: "rounds", capMin: 12, movements: [{ move: "burpee", amount: 10 }] };

    var html = '<button class="backlink" id="ed-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Programs</button>' +
      '<h2 class="title">' + (editorState.isNew ? "New workout" : "Edit workout") + '</h2>' +
      '<div class="field"><label>Name</label><input class="ed-name" id="wb-name" value="' + esc(d.name) + '" placeholder="Arm day, Saturday grind…"></div>' +
      '<div class="seg-ctl" data-wb-kind>' +
        '<button data-k="strength" aria-selected="' + (d.kind === "strength") + '">Lifting</button>' +
        '<button data-k="metcon" aria-selected="' + (d.kind === "metcon") + '">Conditioning</button>' +
      '</div>';

    if (d.kind === "strength") {
      d.exercises = d.exercises || [];
      d.exercises.forEach(function (row, i) {
        var ex = EX[row.exId] || { name: row.exId, bar: false };
        html += '<div class="day-block">' +
          '<div class="ed-slot"><button class="ed-ex" data-pickex="' + i + '">' + esc(ex.name) + '</button>' +
            '<div class="ed-nums">' + step("ex:" + i + ":sets", row.sets, 1) + step("ex:" + i + ":reps", row.reps, 1) + '</div></div>' +
          (ex.bw ? '' : '<div class="ed-slot"><span class="ed-cap">Weight (' + U() + ')</span><div class="ed-nums">' + step("ex:" + i + ":weight", row.weight || 20, 0, eq().step) + '</div></div>') +
          '<button class="btn btn-ghost sm" data-del="' + i + '" style="margin-top:6px">Remove</button>' +
        '</div>';
      });
      html += '<div class="btn-row"><button class="btn btn-ghost" id="wb-add">Add an exercise</button></div>';
    } else {
      html += '<div class="field"><label>Format</label><div class="seg-ctl" data-wb-fmt>' +
        ['amrap', 'fortime', 'rft'].map(function (f) { return '<button data-f="' + f + '" aria-selected="' + (d.wod.format === f) + '">' + FORMAT_LABEL[f] + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="ed-slot"><span class="ed-cap">' + (d.wod.format === "amrap" ? "Minutes" : "Time cap (min)") + '</span><div class="ed-nums">' + step("cap", d.wod.capMin || 12, 1) + '</div></div>';
      (d.wod.movements || []).forEach(function (m, i) {
        html += '<div class="day-block"><div class="ed-slot">' +
          '<button class="ed-ex" data-pickmv="' + i + '">' + esc(moveName(m.move)) + '</button>' +
          '<div class="ed-nums">' + step("mv:" + i + ":amount", m.amount || 10, 1) + '</div></div>' +
          '<button class="btn btn-ghost sm" data-delmv="' + i + '" style="margin-top:6px">Remove</button></div>';
      });
      html += '<div class="btn-row"><button class="btn btn-ghost" id="wb-addmv">Add a movement</button></div>';
    }
    html += '<div class="btn-row"><button class="btn btn-primary" id="wb-save">Save workout</button></div>';
    c.innerHTML = html;

    function step(path, val, min, stp) {
      return '<span class="ns" data-path="' + path + '" data-min="' + (min || 0) + '" data-step="' + (stp || 1) + '">' +
        '<button data-d="-">–</button><b>' + fmt(val) + '</b><button data-d="+">+</button></span>';
    }
    function setVal(path, delta) {
      var p = path.split(":");
      var obj, field;
      if (p[0] === "cap") { d.wod.capMin = Math.max(1, (d.wod.capMin || 12) + delta); }
      else if (p[0] === "ex") { obj = d.exercises[+p[1]]; field = p[2]; }
      else if (p[0] === "mv") { obj = d.wod.movements[+p[1]]; field = p[2]; }
      if (obj) {
        var el = c.querySelector('[data-path="' + path + '"]');
        var mn = +el.dataset.min, stp = +el.dataset.step;
        obj[field] = Math.max(mn, (+obj[field] || 0) + delta * stp);
      }
      renderers.editor();
    }

    document.getElementById("ed-back").onclick = function () { go("choose"); };
    document.getElementById("wb-name").oninput = function () { d.name = this.value; };
    c.querySelectorAll("[data-wb-kind] button").forEach(function (b) {
      b.onclick = function () { d.kind = b.dataset.k; renderers.editor(); };
    });
    var fmtSeg = c.querySelector("[data-wb-fmt]");
    if (fmtSeg) fmtSeg.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { d.wod.format = b.dataset.f; d.wod.scoreType = b.dataset.f === "amrap" ? "rounds" : "time"; renderers.editor(); };
    });
    c.querySelectorAll(".ns").forEach(function (grp) {
      grp.querySelector("[data-d='-']").onclick = function () { setVal(grp.dataset.path, -1); };
      grp.querySelector("[data-d='+']").onclick = function () { setVal(grp.dataset.path, 1); };
    });
    c.querySelectorAll("[data-pickex]").forEach(function (b) {
      b.onclick = function () { var i = +b.dataset.pickex; openMovePicker(false, function (id) { d.exercises[i].exId = id; renderers.editor(); }); };
    });
    c.querySelectorAll("[data-pickmv]").forEach(function (b) {
      b.onclick = function () { var i = +b.dataset.pickmv; openMovePicker(true, function (id) { d.wod.movements[i].move = id; renderers.editor(); }); };
    });
    c.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () { d.exercises.splice(+b.dataset.del, 1); renderers.editor(); };
    });
    c.querySelectorAll("[data-delmv]").forEach(function (b) {
      b.onclick = function () { d.wod.movements.splice(+b.dataset.delmv, 1); renderers.editor(); };
    });
    var addEx = document.getElementById("wb-add");
    if (addEx) addEx.onclick = function () { d.exercises.push({ exId: "dbcurl", sets: 3, reps: 10, weight: 15 }); renderers.editor(); };
    var addMv = document.getElementById("wb-addmv");
    if (addMv) addMv.onclick = function () { d.wod.movements.push({ move: "burpee", amount: 10 }); renderers.editor(); };

    document.getElementById("wb-save").onclick = function () {
      d.name = (document.getElementById("wb-name").value || "").trim() || "Untitled workout";
      if (d.kind === "strength" && !(d.exercises || []).length) { toast("Add an exercise first"); return; }
      if (d.kind === "metcon") {
        if (!(d.wod.movements || []).length) { toast("Add a movement first"); return; }
        d.wod.name = d.name; d.wod.id = d.id;
        d.wod.targetRounds = d.wod.format === "rft" ? (d.wod.targetRounds || 5) : null;
        delete d.exercises;
      } else {
        delete d.wod;
      }
      var idx = db.customWorkouts.map(function (w) { return w.id; }).indexOf(d.id);
      if (idx >= 0) db.customWorkouts[idx] = d; else db.customWorkouts.push(d);
      save();
      editorState = null;
      toast("Workout saved");
      go("choose");
    };
  }

    return '<span class="ns" data-num="' + field + '"><button data-d="-">–</button><b>' + fmt(val) + '</b><button data-d="+">+</button>' +

  function runCustomWorkout(cw) {
    if (cw.kind === "metcon") {
      var w = deepClone(cw.wod);
      w.name = cw.name; w.style = "custom";
      startMetconPlayer(null, w);
      return;
    }
    startFreestyleStrength(cw);
  }

  function startFreestyleStrength(cw) {
    var exercises = (cw.exercises || []).map(function (row) {
      var ex = EX[row.exId] || { name: row.exId, bar: false };
      var isBw = !!ex.bw;
      return {
        exId: row.exId, name: ex.name, adhoc: true, assist: isBw, bw: isBw,
        target: row.reps, repHigh: null, weight: isBw ? 0 : (row.weight || 0),
        warmups: [],
        workSets: Array.from({ length: Math.max(1, row.sets || 1) }, function () { return { weight: isBw ? null : (row.weight || 0), reps: row.reps }; })
      };
    });
    if (!exercises.length) { toast("Add an exercise first"); return; }
    var queue = [];
    exercises.forEach(function (x, xi) {
      x.workSets.forEach(function (ws, si) {
        queue.push({ xi: xi, kind: "work", weight: x.assist ? null : ws.weight, reps: ws.reps,
          exId: x.exId, name: x.name, assist: !!x.assist, adhoc: true,
          setNo: si + 1, setCount: x.workSets.length, target: x.target });
      });
    });
    run = {
      custom: true, freestyleName: cw.name, customWorkoutId: cw.id,
      t: null, res: { label: cw.name, dayType: null, exercises: exercises }, queue: queue, i: 0,
      startedAt: Date.now(), chosenIdx: null,
      results: exercises.map(function (x) {
        return { exId: x.exId, name: x.name, assist: !!x.assist, bw: !!x.bw, adhoc: true, target: x.target, plannedWeight: x.weight || 0, sets: [] };
      })
    };
    renderPlayer();
  }

  function finishFreestylePlayer() {
    if (!run.results.some(function (r) { return r.sets.length; })) { toast("Log at least one set first"); return; }
    if (run.tick) { clearInterval(run.tick); run.tick = null; }
    var sess = {
      id: uid(), date: run.past ? run.past.date : run.startedAt, kind: "freestyle", past: !!run.past,
      templateId: null, programName: run.freestyleName, customWorkoutId: run.customWorkoutId,
      dayLabel: run.freestyleName, weekIndex: 0, dayType: null,
      durationSec: run.past ? run.past.durationSec : Math.round((Date.now() - run.startedAt) / 1000),
      snapshot: {}, notes: [],
      actual: run.results.map(function (r) {
        var top = r.sets.reduce(function (m, s) { return (s.weight || 0) >= (m.weight || 0) ? s : m; }, r.sets[0] || {});
        return { exId: r.exId, name: r.name, assist: r.assist, adhoc: true, made: null,
          sets: r.sets, topWeight: (top && top.weight) || 0, topReps: (top && top.reps) || 0 };
      }).filter(function (a) { return a.sets.length; })
    };
    db.sessions.push(sess);
    db.sessions.sort(function (a, b) { return a.date - b.date; });   // a past log slots into history by its date
    save();
    lastSummary = sess;
    run = null; persistRun();
    finishAndCelebrate(sess, function () { go("summary"); });
  }

  function progressionRuleText(t) {
    if (isMetcon(t)) return "Each session is a workout for time or rounds. Nothing to progress — you log your score and it goes in your history.";
    var a0 = (t.anchors && t.anchors[0]) || (t.progression && Object.keys(t.progression)[0]);
    var p0 = t.progression && a0 ? t.progression[a0] : null;
    var incHi = t.progression ? Object.keys(t.progression).reduce(function (m, k) { return Math.max(m, t.progression[k].increment || 0); }, 0) : 0;
    if (t.progressionMode === "double")
      return "Every lift has a rep range. Take every set to the top of the range and next time the weight goes up " + fmt(p0 ? p0.increment : 2.5) + "–" + fmt(incHi) + " " + U() + " and you drop back to the bottom. Fall short of the bottom " + (p0 ? p0.failRule.misses : 3) + " sessions running and it trims " + Math.round((1 - (p0 ? p0.failRule.pct : 0.9)) * 100) + "% so you can rebuild.";
    if (t.progressionMode === "weekly")
      return "A hard volume day, an easy recovery day, then an intensity day where you work up to one top set at a new best. Beat the intensity day and next week's weights move up; miss it twice and that lift resets " + Math.round((1 - t.progression.squat.failRule.pct) * 100) + "%.";
    return "Each session, if you complete every prescribed rep, the next session adds " + fmt(p0 ? p0.increment : 2.5) + "–" + fmt(incHi || 5) + " " + U() + " to that lift. Miss the target " + (p0 ? p0.failRule.misses : 3) + " sessions in a row and it cuts the weight " + Math.round((1 - (p0 ? p0.failRule.pct : 0.9)) * 100) + "% so you can build back up.";
  }

  /* ============================================================ SETUP */
  var DAY_ABBR = ["S", "M", "T", "W", "T", "F", "S"];

        : '<button class="prog-card su-custom" id="su-custom"><h3>Make it yours</h3><p>Optional — swap, add or remove exercises before you start.</p></button>');

  function computeStart(t, id) {
    var inp = draft.inputs[id];
    var e = draft.equipment;
    if (draft.startMode === "light") return roundLoad(id === "deadlift" ? e.bar * 2 : e.bar, e);
    var w = parseFloat(inp.weight);
    if (inp.mode === "direct") {
      if (isNaN(w) || w <= 0) return null;
      return roundLoad(w, e);
    }
    var reps = parseInt(inp.reps, 10);
    if (isNaN(w) || w <= 0 || isNaN(reps) || reps < 1 || reps > 20) return null;
    return roundLoad(w5RM(e1RM(w, reps)) * (t.startingWeight.pct != null ? t.startingWeight.pct : 1), e);
  }

  function commitProgram() {
    var t = draft.customTpl || tplById(draft.templateId);
    if (draft.customTpl) { pruneAnchors(t); db.customPlans.push(t); }
    var lifts = {};
    (t.anchors || []).forEach(function (id) {
      var w = computeStart(t, id);
      lifts[id] = { weight: w, start: w, failCount: 0, history: [{ t: Date.now(), w: w }] };
    });
    db.equipment = Object.assign({}, draft.equipment);
    if (!db.equipment.step) db.equipment.step = db.equipment.smallestPlate * 2;
    seedExtraLifts(t, lifts, db.equipment);
    db.active = {
      templateId: t.id,
      options: Object.assign({}, draft.options),
      startedAt: Date.now(),
      cycleIndex: 0,
      weekIndex: 0,
      lifts: lifts,
      trainingDays: draft.trainingDays.slice()
    };
    draft = null;
    save();
    toast("Program ready — let's train");
    go("home");
  }

  /* ============================================================ HOME */
  function sessionsThisWeek() {
    var wk = weekKey(Date.now());
    return db.sessions.filter(function (s) { return s.date >= wk; }).length;
  }
  function latestBody() { return db.body.length ? db.body[db.body.length - 1] : null; }

  // rolling consistency metric, 0–100, over the last 4 Monday-weeks.
  // 70 pts adherence to the weekly target · 20 pts on-target streak · 10 pts recency.
  function weeklyTarget() {
    if (db.active) { var t = tplById(db.active.templateId); if (t && t.daysPerWeek) return t.daysPerWeek; }
    return 3;
  }
  function gritScore() {
    if (!db.sessions.length) return null;
    var target = weeklyTarget();
    var thisWk = weekKey(Date.now());
    var counts = [0, 0, 0, 0]; // index 0 = current week, 3 = three weeks ago
    db.sessions.forEach(function (s) {
      var idx = Math.round((thisWk - weekKey(s.date)) / 604800000);
      if (idx >= 0 && idx < 4) counts[idx]++;
    });
    var adher = 0;
    counts.forEach(function (n) { adher += Math.min(n, target); });
    adher = Math.round((adher / (target * 4)) * 70);
    var streak = 0;
    for (var i = 0; i < 4; i++) { if (counts[i] >= target) streak++; else break; }
    var streakPts = Math.min(streak, 4) * 5;
    var last = db.sessions[db.sessions.length - 1].date;
    var days = (Date.now() - last) / 86400000;
    var recency = days <= 3 ? 10 : days <= 7 ? 5 : 0;
    var score = Math.max(0, Math.min(100, adher + streakPts + recency));
    var band = score >= 80 ? "Forging" : score >= 55 ? "Steady" : score >= 25 ? "Slipping" : "Cold";

      if (s.templateId) {

      }

        st.metconCount++;
        if (s.style === "hyrox" || s.format === "hyrox") st.hyroxCount++;

          st.hyroxFullSims++;

  function confettiBurst(canvas) {
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var W = canvas.width = canvas.offsetWidth, H = canvas.height = canvas.offsetHeight;
    var cols = ["#35c8b6", "#dcae3c", "#48c9b6", "#9aa7b2", "#e0b64a"];
    var bits = [];
    for (var i = 0; i < 90; i++) bits.push({
      x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.32,
      vx: (Math.random() - 0.5) * 9, vy: -6 - Math.random() * 8,
      s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4
    });
    var t0 = Date.now();
    function frame() {
      var el = Date.now() - t0;
      ctx.clearRect(0, 0, W, H);
      bits.forEach(function (b) {
        b.vy += 0.32; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vx *= 0.99;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);

        ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.6);

      if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

  /* ============================================================ SCHEDULE */
  function advanceSim(sim, t, res) {
    if (isMetcon(t)) { advanceRotation(sim, t, sim.cycleIndex); return; }
    var fake = res.exercises.filter(function (x) { return !x.assist; }).map(function (x) {
      return { exId: x.exId, done: true, made: true, hitTop: true, topWeight: x.weight };
    });
    applyResult(t, sim, { dayType: res.dayType, cycleIndex: sim.cycleIndex, exercises: fake }, eq());
  }

  // project the next `days` of sessions, advancing progression as if every
  // session is completed. Uses db.active.trainingDays (weekday indices) if set,
  // otherwise falls back to even spacing across the week. Returns [{ date, res }].
  function projectSchedule(days) {
    var t = tplById(db.active.templateId);
    if (!t) return [];
    var sim = JSON.parse(JSON.stringify(db.active));
    var td = (db.active.trainingDays && db.active.trainingDays.length) ? db.active.trainingDays : null;
    var out = [], guard = 0;
    var trainedToday = db.sessions.some(function (s) { return dayKey(s.date) === dayKey(Date.now()); });

    if (td) {
      var cur = new Date(); cur.setHours(0, 0, 0, 0);
      var startDay = cur.getTime();
      while (cur.getTime() - startDay <= days * 86400000 && guard++ < 60) {
        var isToday = cur.getTime() === startDay;
        if (td.indexOf(cur.getDay()) >= 0 && !(isToday && trainedToday)) {
          var res = isMetcon(t) ? resolveMetcon(t, sim) : resolveSession(t, sim, eq());
          out.push({ date: isToday ? Date.now() : cur.getTime(), res: res });
          advanceSim(sim, t, res);
        }
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    var gap = (7 / (t.daysPerWeek || 3)) * 86400000;
    var start = Date.now(), date = start;
    while (date - start <= days * 86400000 && guard++ < 40) {
      var r = isMetcon(t) ? resolveMetcon(t, sim) : resolveSession(t, sim, eq());
      out.push({ date: date, res: r });
      advanceSim(sim, t, r);
      date += gap;
    }
    return out;
  }

  function dayName(label) { return /^[A-Z]$/.test(label) ? "Workout " + label : cap(label) + " day"; }

  renderers.schedule = function () {

    // this week's completed sessions, then the projected ones going forward
    var items = [];
    db.sessions.forEach(function (s) {
      if (weekKey(s.date) === curWk) items.push({ date: s.date, done: true, sess: s });
    });
    projectSchedule(30).forEach(function (p, i) {
      items.push({ date: p.date, res: p.res, next: i === 0 });
    });
    items.sort(function (a, b) { return a.date - b.date; });

    var upcoming = items.filter(function (x) { return !x.done; }).length;
