<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rack Coach</title>
<meta name="description" content="A personal strength-training coach that runs a proven barbell program.">
<meta name="theme-color" content="#0f8a7c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rack Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* ============================================================
     THEME: "Arcane Teal" — the gem-glow teal from the reference
     figure carries the whole app. Light = aged paper ground,
     dark = arcane night. Amber = holding, red = missed.
     ============================================================ */
  :root {
    --bg: #e9e6da;           /* aged paper */
    --surface: #f7f5ef;
    --surface-2: #edece2;
    --line: #dbd7c8;
    --line-strong: #c4bda9;
    --text: #171c24;         /* blue-black ink */
    --text-muted: #575a54;
    --text-faint: #8b8a80;
    --accent: #0f8a7c;       /* arcane teal — actions, charts, active, emphasis */
    --accent-ink: #0a675c;   /* teal as text on the page ground */
    --accent-soft: #0f8a7c1c;
    --accent-text: #ffffff;  /* on the teal fill */
    --brand: #0f8a7c;
    --brand-soft: #0f8a7c1c;
    --wave: #0f8a7c;
    --gain: #0f8a7c;
    --hold: #9a6f26;
    --miss: #b5402c;
    --radius: 13px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(18,18,14,.06), 0 10px 30px rgba(24,26,22,.09);
    --shadow-sheet: 0 -8px 40px rgba(18,20,16,.2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1420;         /* deep blue-black */
      --surface: #151f2c;    /* night panel */
      --surface-2: #1c2938;
      --line: #2a3745;
      --line-strong: #3b4c5d;
      --text: #e7e8e4;
      --text-muted: #9aa4a5;
      --text-faint: #66727a;
      --accent: #35c8b6;
      --accent-ink: #59dccb;
      --accent-soft: #35c8b622;
      --accent-text: #04201c;
      --brand: #35c8b6;
      --brand-soft: #35c8b622;
      --wave: #35c8b6;
      --gain: #35c8b6;
      --hold: #d6a94e;
      --miss: #dd6047;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.42);
      --shadow-sheet: 0 -10px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1420; --surface: #151f2c; --surface-2: #1c2938; --line: #2a3745;
    --line-strong: #3b4c5d; --text: #e7e8e4; --text-muted: #9aa4a5; --text-faint: #66727a;
    --accent: #35c8b6; --accent-ink: #59dccb; --accent-soft: #35c8b622; --accent-text: #04201c;
    --brand: #35c8b6; --brand-soft: #35c8b622; --wave: #35c8b6; --gain: #35c8b6;
    --hold: #d6a94e; --miss: #dd6047;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.42);
    --shadow-sheet: 0 -10px 44px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  input, select { font: inherit; color: inherit; }
  h1,h2,h3,h4 { font-family: "Barlow Condensed", "Archivo Narrow", sans-serif; font-weight: 600; line-height: 1.05; text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .app { max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

  /* header */
  .top {
    flex-shrink: 0; z-index: 30;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(11px, env(safe-area-inset-top)) 16px 11px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .13em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .brand b { color: var(--accent-ink); font-weight: 700; }
  .brand .mark { width: 9px; height: 9px; border-radius: 2px; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .spacer { flex: 1; }
  .pos-chip { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); border: 1px solid transparent; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 19px; height: 19px; }

  main { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 18px 16px calc(92px + env(safe-area-inset-bottom));
    background: var(--bg);
    transform: translateX(100%); visibility: hidden;
  }
  .screen.active { transform: translateX(0); visibility: visible; }
  .screen.anim { transition: transform .3s cubic-bezier(.32,.72,0,1); }
  .screen.lead { z-index: 2; }
  .screen.trail { z-index: 1; }
  .screen.from-right { transform: translateX(100%); }
  .screen.from-left  { transform: translateX(-26%); }
  .screen.to-left    { transform: translateX(-26%); }
  .screen.to-right   { transform: translateX(100%); }
  .screen.behind::after {
    content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.16); pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .screen.anim { transition: none; } }

  h2.title { font-size: 27px; margin-bottom: 3px; }
  .lead { color: var(--text-muted); font-size: 13.5px; margin-bottom: 18px; max-width: 46ch; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--text-faint); margin-bottom: 8px; }

  /* program cards */
  .prog-card {
    width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 15px; margin-bottom: 12px;
  }
  .prog-card:hover { border-color: var(--line-strong); }
  .prog-card h3 { font-size: 21px; }
  .prog-card .by { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-top: 2px; }
  .prog-card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 9px; }
  .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
  .prog-card p { font-size: 13px; color: var(--text-muted); }
  .prog-card .best { font-size: 12px; color: var(--text-faint); margin-top: 7px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: .08em; text-transform: uppercase;
    border-radius: var(--radius-sm); padding: 0 18px; height: 48px; width: 100%;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line-strong); }
  .btn-danger { background: transparent; color: var(--miss); border: 1px solid color-mix(in srgb, var(--miss) 40%, var(--line)); }
  .btn-row { display: flex; gap: 9px; margin-top: 14px; }
  .btn-row .btn { flex: 1; }
  .btn.sm { height: 40px; font-size: 13px; padding: 0 13px; width: auto; }

  .backlink { display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
  .backlink svg { width: 15px; height: 15px; }

  /* day/session preview */
  .day-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px; margin-bottom: 10px; }
  .day-block h4 { font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .day-block h4 .dtype { font-size: 9.5px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; letter-spacing: .08em; }
  .ex-line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .ex-line:last-child { border-bottom: none; }
  .ex-line .scheme { font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 12.5px; }
  .ex-line .wt { font-family: "IBM Plex Mono", monospace; font-weight: 500; }

  .rule-box { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: var(--radius-sm); padding: 12px 13px; font-size: 13px; color: var(--text); margin: 4px 0 16px; }
  .rule-box b { font-family: "Barlow Condensed"; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; color: var(--accent-ink); display: block; margin-bottom: 4px; }

  /* setup */
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--text-faint); margin-bottom: 7px; }
  .seg-ctl { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; }
  .seg-ctl button { flex: 1; padding: 8px 6px; border-radius: 6px; font-family: "Barlow Condensed"; font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .seg-ctl button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .num-in { width: 100%; height: 44px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); font-family: "IBM Plex Mono", monospace; font-size: 15px; }

  .lift-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 9px; }
  .lift-row .lr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lift-row h4 { font-size: 16px; }
  .lift-row .mini-seg { display: flex; gap: 2px; padding: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; }
  .lift-row .mini-seg button { padding: 5px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--text-muted); font-family: "Barlow Condensed"; letter-spacing: .04em; text-transform: uppercase; }
  .lift-row .mini-seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .lr-inputs { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .lr-inputs .fw { flex: 1; }
  .lr-inputs .fw span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; display: block; margin-bottom: 4px; }
  .lr-result { margin-top: 9px; font-size: 12.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
  .lr-result b { color: var(--accent-ink); font-weight: 600; }

  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .toggle-line:last-child { border-bottom: none; }
  .toggle-line .tl-k { font-size: 13.5px; }
  .toggle-line .tl-k p { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
  .sw { width: 46px; height: 27px; border-radius: 999px; background: var(--line-strong); position: relative; flex-shrink: 0; transition: background .16s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 999px; background: #fff; transition: transform .16s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw[aria-checked="true"] { background: var(--accent); }
  .sw[aria-checked="true"]::after { transform: translateX(19px); }

  /* train screen */
  .next-card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .next-card .nc-eye { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent-ink); }
  .next-card h3 { font-size: 24px; margin: 3px 0 12px; }
  .nc-ex { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .nc-ex:last-of-type { border-bottom: none; }
  .nc-ex .nx-name { font-size: 14.5px; font-weight: 500; }
  .nc-ex .nx-set { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--text-muted); }
  .nc-ex .nx-w { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 14px; }

  .recent { margin-top: 20px; }
  .rec-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 7px; font-size: 13px; }
  .rec-row .rr-day { font-family: "Barlow Condensed"; font-weight: 700; font-size: 14px; min-width: 30px; max-width: 82px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .rec-row .rr-sum { flex: 1; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .rec-row .rr-date { color: var(--text-faint); font-size: 11.5px; }

  /* home screen */
  .home-quote { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; margin: 6px 0 4px; }
  .home-quote p { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 17px; line-height: 1.2; color: var(--text-muted); text-wrap: balance; }
  .home-quote span { display: block; margin-top: 5px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--text-faint); }
  .home-hero { padding: 14px 0 4px; }
  .home-hero .h-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .13em; font-weight: 700; color: var(--accent-ink); }
  .home-hero h2.title { font-size: 30px; margin: 4px 0 14px; }
  .home-hero .lead { margin-bottom: 22px; }
  .btn.btn-lg { height: 58px; font-size: 17px; }
  .home-links { display: flex; gap: 9px; margin-top: 10px; }
  .home-links .btn { flex: 1; }
  .home-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .home-stat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 13px; width: 100%; }
  .home-stat .hs-k { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; }
  .home-stat .hs-v { display: block; font-family: "Barlow Condensed"; font-weight: 700; font-size: 20px; margin-top: 4px; line-height: 1; }
  .home-stat .hs-v small { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .home-stat .hs-sub { display: block; font-size: 11px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 4px; }
  .home-foot { margin-top: 22px; text-align: center; }
  .home-foot button { color: var(--text-faint); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }

  .grit-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin: 0 0 16px; }
  .grit-ring { width: 56px; height: 56px; flex: none; }
  .grit-ring .grit-num { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 18px; fill: var(--text); }
  .grit-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .grit-k { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 700; }
  .grit-band { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 19px; line-height: 1; color: var(--accent-ink); }
  .grit-bars { display: flex; align-items: flex-end; gap: 3px; margin-top: 5px; }
  .grit-bars i { width: 7px; border-radius: 2px; display: block; }
  .grit-bars em { font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--text-faint); margin-left: 6px; align-self: center; }

  /* pick-your-workout screen */
  .pick-card { position: relative; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; margin-bottom: 12px; }
  .pick-card:hover { border-color: var(--line-strong); }
  .pick-card.suggested { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .pick-card h3 { font-size: 21px; }
  .pick-card .pk-badge { position: absolute; top: 13px; right: 13px; font-family: "Barlow Condensed"; font-weight: 700; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); background: var(--accent); border-radius: 5px; padding: 3px 7px 2px; }
  .pick-card .pk-dtype { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 600; margin-top: 1px; }
  .pick-card .pk-ex { margin-top: 10px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .pick-card .pk-w { font-family: "IBM Plex Mono", monospace; color: var(--text); font-size: 12px; margin-left: 2px; white-space: nowrap; }

  /* session player */
  .player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1); }
  .player.show { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .player { transition: none; } }
  .pl-top { padding: max(12px, env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .pl-top .pl-x { color: var(--text-muted); }
  .pl-rail { flex: 1; display: flex; gap: 4px; }
  .pl-rail i { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
  .pl-rail i.done { background: color-mix(in srgb, var(--accent) 42%, var(--line)); }
  .pl-rail i.cur { background: var(--accent); }
  .pl-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vh 20px 24px; gap: 6px; overflow-y: auto; }
  .pl-ex { font-family: "Barlow Condensed"; font-weight: 600; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .pl-setno { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-faint); font-weight: 700; }
  .pl-target { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(84px, 28vw, 148px); line-height: .92; letter-spacing: .01em; margin-top: 2px; }
  .pl-target .u { font-size: .32em; color: var(--text-muted); }
  /* fixed-height sub zone so the big number never jumps as tag/hint appear or vanish */
  .pl-sub { display: flex; flex-direction: column; align-items: center; gap: 9px; min-height: 96px; margin-top: 8px; }
  .pl-x-reps { font-family: "IBM Plex Mono", monospace; font-size: 24px; color: var(--text-muted); }
  .pl-tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; }
  .pl-tag.warm { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line); }
  .pl-tag.top { background: var(--accent); color: var(--accent-text); }
  .pl-hint { font-size: 12.5px; color: var(--text-faint); max-width: 30ch; }
  .pl-actions { padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 9px; }
  .pl-actions .row2 { display: flex; gap: 9px; }
  .pl-actions .row2 .btn { flex: 1; }
  .pl-actions .pl-cw { width: 100%; height: 44px; font-size: 13px; }
  .pl-effort { display: flex; align-items: center; gap: 6px; }
  .pl-effort .pe-k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--text-faint); margin-right: 2px; white-space: nowrap; }
  .pe-chip { flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; }
  .pe-chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .pl-prow { display: flex; gap: 9px; }
  .pl-prow .pl-done { flex: 1; height: 60px; font-size: 18px; }
  .pl-prow .pl-back { flex: 0 0 33%; height: 60px; font-size: 14px; }
  .pl-prow .pl-back:disabled { opacity: .35; }
  .pl-count { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }

  /* metcon player */
  #mc-bodywrap { display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 8px 16px 0; }
  .mc-format { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent-ink); }
  .mc-clock { font-size: clamp(64px, 22vw, 120px); font-weight: 500; line-height: 1; margin: 6px 0; letter-spacing: -.02em; }
  .mc-minute { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 8px; min-height: 18px; }
  .mc-moves { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 6px; }
  .mc-move { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: 13.5px; color: var(--text); }
  .mc-move .mc-chk { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); flex: none; }
  .mc-move.done { color: var(--text-faint); text-decoration: line-through; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .mc-move.done .mc-chk { background: var(--accent); border-color: var(--accent); }
  .mc-round-ctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--text-muted); }
  .mc-round-ctl button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: 18px; color: var(--text); }
  .mc-round-ctl b { color: var(--text); font-size: 15px; }
  .mc-startbtn { height: 56px; font-size: 17px; }
  .mc-cap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .nc-wod { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 22px; margin: 3px 0 1px; }
  .nc-wod-sub { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .mc-detail-sub { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

  /* reorder sheet */
  .ro-list { margin: 6px 0 14px; }
  .ro-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 6px; background: var(--surface); font-size: 14.5px; }
  .ro-row.done { opacity: .5; }
  .ro-row .k2 { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
  .ro-btns { display: flex; gap: 5px; flex-shrink: 0; }
  .ro-btns button { width: 36px; height: 34px; border: 1px solid var(--line-strong); border-radius: 7px; font-size: 13px; color: var(--text-muted); background: var(--surface-2); }
  .ro-btns button:disabled { opacity: .3; }
  .ro-btns button:active:not(:disabled) { background: var(--accent-soft); color: var(--accent-ink); }

  /* summary + progress */
  .statbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px 9px; }
  .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 600; }
  .stat .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: 23px; margin-top: 2px; line-height: 1; }
  .stat .v small { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .stat.hot .v { color: var(--accent-ink); }

  .change-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .change-row:last-child { border-bottom: none; }
  .change-row .cr-ic { width: 20px; text-align: center; font-weight: 700; }
  .change-row .cr-ic.up { color: var(--accent-ink); }
  .change-row .cr-ic.hold { color: var(--hold); }
  .change-row .cr-ic.deload { color: var(--miss); }
  .change-row .cr-w { margin-left: auto; font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 12.5px; }

  .lift-prog { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 9px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .lift-prog h4 { font-size: 16px; }
  .lift-prog .lp-sub { font-size: 11.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 2px; }
  .lift-prog .lp-now { font-family: "Barlow Condensed"; font-weight: 700; font-size: 19px; text-align: right; }
  .lift-prog .lp-now small { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .lift-prog .lp-now.has-now { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .lift-prog .lp-now .lp-w { display: block; }
  .lift-prog .lp-now .lp-since { font-family: "IBM Plex Mono", monospace; font-weight: 500;
    font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--text-faint); }
  svg.spark { width: 100%; height: 40px; display: block; margin-top: 6px; grid-column: 1 / -1; }

  .empty { text-align: center; padding: 40px 20px; }
  .empty .em-ic { font-size: 30px; opacity: .5; }
  .empty h3 { font-size: 20px; margin: 12px 0 5px; }
  .empty p { color: var(--text-muted); font-size: 13.5px; max-width: 34ch; margin: 0 auto 18px; }

  /* bottom tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar.show { display: flex; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--text-faint); border-radius: 10px; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button span { font-family: "Barlow Condensed"; font-weight: 600; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
  .tabbar button[aria-selected="true"] { color: var(--accent-ink); }

  /* home */
  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .home-head h2 { font-size: 26px; }
  .home-head .pos { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .snap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 18px; }
  .snap .s { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px; }
  .snap .s .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
  .snap .s .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: 20px; margin-top: 3px; line-height: 1; }
  .snap .s .v small { font-size: 11px; color: var(--text-muted); font-weight: 500; }

  /* line chart (weekly points) */
  svg.chart { width: 100%; height: 104px; display: block; margin-top: 10px; grid-column: 1 / -1; overflow: visible; }
  .chart-note { grid-column: 1 / -1; font-size: 11px; color: var(--text-faint); margin-top: 6px; font-family: "IBM Plex Mono", monospace; }

  /* body screen */
  .bw-hero { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .bw-hero .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; }
  .bw-hero .big { font-family: "Barlow Condensed"; font-weight: 700; font-size: 46px; line-height: 1; margin-top: 2px; }
  .bw-hero .big small { font-size: .36em; color: var(--text-muted); }
  .bw-hero .trend { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; font-family: "IBM Plex Mono", monospace; }
  .meas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 4px; }
  .meas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
  .meas .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; }
  .meas .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: 19px; margin-top: 2px; }
  .meas .v small { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .meas .d { font-size: 11px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 1px; }
  .entry-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 7px; font-size: 13px; width: 100%; text-align: left; }
  .entry-row .er-d { font-family: "Barlow Condensed"; font-weight: 700; font-size: 14px; width: 54px; flex-shrink: 0; }
  .entry-row .er-b { flex: 1; font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 12px; }

  /* menu + picker */
  .menu-item { width: 100%; text-align: left; padding: 13px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 14.5px; margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .menu-item:hover { border-color: var(--accent); }
  .menu-item.danger { color: var(--miss); border-color: color-mix(in srgb, var(--miss) 35%, var(--line)); }
  .pick-item { width: 100%; text-align: left; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .pick-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .pick-item .k2 { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .field-inline { display: flex; gap: 8px; align-items: flex-end; margin: 10px 0; flex-wrap: wrap; }
  .field-inline .fi { flex: 1; min-width: 90px; }
  .field-inline .fi span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; display: block; margin-bottom: 4px; }
  .pl-menu-btn { color: var(--text-muted); }

  /* sheet */
  .sheet-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(10,8,6,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; border-radius: 18px 18px 0 0; box-shadow: var(--shadow-sheet); padding: 8px 16px max(18px, env(safe-area-inset-bottom)); overflow-y: auto; animation: slideup .26s cubic-bezier(.22,1,.36,1) both; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .grab { width: 36px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 6px auto 12px; }
  .sheet h2 { font-size: 21px; margin-bottom: 3px; }
  .sheet .sh-lead { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
  .adj-grid { display: flex; gap: 10px; margin: 14px 0; }
  .adj-grid .ag { flex: 1; text-align: center; }
  .adj-grid .ag .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; }
  .stepper button { height: 46px; font-size: 20px; color: var(--text-muted); font-family: "Barlow Condensed"; }
  .stepper button:active { background: var(--accent-soft); color: var(--accent-ink); }
  .stepper input { width: 100%; height: 46px; text-align: center; border: none; background: transparent; font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 90; opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none; box-shadow: var(--shadow); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* custom-content editor */
  .ed-name { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 15px; font-family: inherit; }
  .ed-slot { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
  .ed-ex { flex: 1; min-width: 110px; text-align: left; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); font-size: 13.5px; }
  .ed-nums { display: flex; gap: 6px; }
  .ed-cap { flex: 1; min-width: 100px; font-size: 12px; color: var(--text-muted); }
  .ns { display: inline-flex; flex-direction: column; align-items: center; }
  .ns > span, .ns b { font-family: "IBM Plex Mono", monospace; }
  .ns { position: relative; }
  .ns button { width: 30px; height: 32px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); font-size: 15px; }
  .ns button:first-of-type { border-radius: 7px 0 0 7px; }
  .ns button:last-of-type { border-radius: 0 7px 7px 0; }
  .ns b { display: inline-grid; place-items: center; min-width: 34px; height: 32px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); font-size: 13px; font-weight: 600; }
  .ns i { font-style: normal; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-top: 3px; }
  .mp-list { max-height: 46vh; overflow-y: auto; margin: 4px 0 10px; }

  /* badges */
  .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; margin: 6px 0 4px; }
  .badge-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; }
  .badge-cell span { font-size: 9.5px; text-align: center; color: var(--text-faint); line-height: 1.15; max-width: 74px; }
  .badge-cell.got span { color: var(--text-muted); font-weight: 600; }
  .badge-svg { width: 52px; height: 52px; }
  .badge-svg.locked { opacity: .55; }
  .badge-detail { display: flex; justify-content: center; margin: 2px 0 8px; }
  .badge-detail .badge-svg { width: 88px; height: 88px; }

  /* celebration */
  .celebrate { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 24px;
    background: var(--bg); opacity: 0; transition: opacity .28s ease; overflow: hidden; }
  .celebrate.show { opacity: 1; }
  .celebrate .confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cel-inner { position: relative; text-align: center; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cel-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .18em; font-weight: 700; color: var(--accent-ink); }
  .cel-title { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 34px; line-height: 1; }
  .cel-stats { display: flex; gap: 18px; }
  .cel-stats > div { display: flex; flex-direction: column; }
  .cel-stats b { font-family: "Barlow Condensed", sans-serif; font-size: 22px; }
  .cel-stats span { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
  .cel-grit { font-size: 13px; color: var(--text-muted); }
  .cel-grit b { color: var(--accent-ink); font-size: 15px; }
  .cel-badges-h { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; }
  .cel-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .cel-badge { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 82px; opacity: 0; animation: celpop .4s ease forwards; }
  .cel-badge span { font-size: 9.5px; color: var(--text-muted); text-align: center; line-height: 1.15; }
  .cel-badge .badge-svg { width: 56px; height: 56px; }
  .cel-inner .btn { width: 200px; margin-top: 6px; }
  @keyframes celpop { from { opacity: 0; transform: scale(.6) translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .cel-badge { animation: none; opacity: 1; } .celebrate { transition: none; } }

  .selftest { position: fixed; inset: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 20px; overflow: auto; z-index: 200; white-space: pre-wrap; line-height: 1.6; }
  .selftest .pass { color: var(--gain); }
  .selftest .fail { color: var(--miss); font-weight: 700; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span>Rack<b>Coach</b></div>
    <div class="spacer"></div>
    <button class="pos-chip" id="pos-chip" hidden></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="screen" id="s-choose"></section>
    <section class="screen" id="s-detail"></section>
    <section class="screen" id="s-setup"></section>
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-pick"></section>
    <section class="screen" id="s-roll"></section>
    <section class="screen" id="s-editor"></section>
    <section class="screen" id="s-summary"></section>
    <section class="screen" id="s-progress"></section>
    <section class="screen" id="s-body"></section>
    <section class="screen" id="s-badges"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="progress" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>
      <span>Progress</span>
    </button>
    <button data-tab="body" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v8M8 11l4-1 4 1M9 21l3-5 3 5"/></svg>
      <span>Body</span>
    </button>
    <button data-tab="badges" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14.5L7 22l5-3 5 3-1.5-7.5"/></svg>
      <span>Badges</span>
    </button>
  </nav>
</div>

<div id="player-root"></div>
<div id="fx-root"></div>

<script>
(function () {
  "use strict";

  /* ============================================================ EXERCISES */
  // bar: true = loaded on a barbell (plate math + warm-ups apply)
  // grp: rough muscle group, for the add-exercise picker
  var EX = {
    // program lifts
    squat:      { name: "Back Squat",       bar: true,  grp: "Legs" },
    frontsquat: { name: "Front Squat",      bar: true,  grp: "Legs" },
    bench:      { name: "Bench Press",      bar: true,  grp: "Push" },
    incline:    { name: "Incline Bench",    bar: true,  grp: "Push" },
    closegrip:  { name: "Close-Grip Bench", bar: true,  grp: "Push" },
    press:      { name: "Overhead Press",   bar: true,  grp: "Push" },
    deadlift:   { name: "Deadlift",         bar: true,  grp: "Pull" },
    rdl:        { name: "Romanian Deadlift",bar: true,  grp: "Pull" },
    row:        { name: "Barbell Row",      bar: true,  grp: "Pull" },
    powerclean: { name: "Power Clean",      bar: true,  grp: "Pull" },
    hipthrust:  { name: "Hip Thrust",       bar: true,  grp: "Legs" },
    goodmorning:{ name: "Good Morning",     bar: true,  grp: "Pull" },
    bbcurl:     { name: "Barbell Curl",     bar: true,  grp: "Arms" },
    // dumbbell / accessory
    dbbench:    { name: "DB Bench Press",   bar: false, grp: "Push" },
    dbpress:    { name: "DB Shoulder Press",bar: false, grp: "Push" },
    dbrow:      { name: "DB Row",           bar: false, grp: "Pull" },
    dbcurl:     { name: "DB Curl",          bar: false, grp: "Arms" },
    lateral:    { name: "Lateral Raise",    bar: false, grp: "Push" },
    latpulldown:{ name: "Lat Pulldown",     bar: false, grp: "Pull" },
    cablerow:   { name: "Seated Cable Row", bar: false, grp: "Pull" },
    facepull:   { name: "Face Pull",        bar: false, grp: "Pull" },
    legpress:   { name: "Leg Press",        bar: false, grp: "Legs" },
    legcurl:    { name: "Leg Curl",         bar: false, grp: "Legs" },
    legext:     { name: "Leg Extension",    bar: false, grp: "Legs" },
    calfraise:  { name: "Calf Raise",       bar: false, grp: "Legs" },
    tricepext:  { name: "Triceps Pushdown", bar: false, grp: "Arms" },
    // bodybuilding accessories
    pecdeck:    { name: "Pec Deck",         bar: false, grp: "Push" },
    cablefly:   { name: "Cable Fly",        bar: false, grp: "Push" },
    hacksquat:  { name: "Hack Squat",       bar: false, grp: "Legs" },
    machinerow: { name: "Chest-Supported Row", bar: false, grp: "Pull" },
    preacher:   { name: "Preacher Curl",    bar: false, grp: "Arms" },
    skullcrusher:{ name: "Skull Crusher",   bar: true,  grp: "Arms" },
    pushdownrope:{ name: "Rope Pushdown",   bar: false, grp: "Arms" },
    hipabduction:{ name: "Hip Abduction",   bar: false, grp: "Legs" },
    shrug:      { name: "DB Shrug",         bar: false, grp: "Pull" },
    hamcurlseated:{ name: "Seated Leg Curl",bar: false, grp: "Legs" },
    // bodyweight
    chinup:     { name: "Chin-up",          bar: false, grp: "Pull", bw: true },
    pullup:     { name: "Pull-up",          bar: false, grp: "Pull", bw: true },
    dip:        { name: "Dip",              bar: false, grp: "Push", bw: true },
    pushup:     { name: "Push-up",          bar: false, grp: "Push", bw: true },
    backext:    { name: "Back Extension",   bar: false, grp: "Pull", bw: true },
    plank:      { name: "Plank",            bar: false, grp: "Core", bw: true },
    legraise:   { name: "Hanging Leg Raise",bar: false, grp: "Core", bw: true },
    abwheel:    { name: "Ab Wheel",         bar: false, grp: "Core", bw: true }
  };

  /* ===================================================== METCON MOVEMENTS */
  // conditioning movements for CrossFit / Hyrox WODs. unit: how "amount" reads.
  // loadable: carries an optional prescribed load (shown, never progressed).
  var MOVES = {
    run:         { name: "Run",              unit: "m",   loadable: false },
    row:         { name: "Row",              unit: "m",   loadable: false },
    bike:        { name: "Echo Bike",        unit: "cal", loadable: false },
    skierg:      { name: "SkiErg",           unit: "m",   loadable: false },
    burpee:      { name: "Burpee",           unit: "reps", loadable: false },
    burpeejump:  { name: "Broad-Jump Burpee", unit: "reps", loadable: false },
    wallball:    { name: "Wall Ball",        unit: "reps", loadable: true },
    dubs:        { name: "Double-Under",     unit: "reps", loadable: false },
    boxjump:     { name: "Box Jump",         unit: "reps", loadable: false },
    kbswing:     { name: "KB Swing",         unit: "reps", loadable: true },
    thruster:    { name: "Thruster",         unit: "reps", loadable: true },
    cleanjerk:   { name: "Clean & Jerk",     unit: "reps", loadable: true },
    snatch:      { name: "Snatch",           unit: "reps", loadable: true },
    deadliftm:   { name: "Deadlift",         unit: "reps", loadable: true },
    pullupm:     { name: "Pull-up",          unit: "reps", loadable: false },
    c2b:         { name: "Chest-to-Bar",     unit: "reps", loadable: false },
    ttb:         { name: "Toes-to-Bar",      unit: "reps", loadable: false },
    hspu:        { name: "Handstand Push-up", unit: "reps", loadable: false },
    pushupm:     { name: "Push-up",          unit: "reps", loadable: false },
    airsquat:    { name: "Air Squat",        unit: "reps", loadable: false },
    lunge:       { name: "Walking Lunge",    unit: "reps", loadable: false },
    situp:       { name: "Sit-up",           unit: "reps", loadable: false },
    sledpush:    { name: "Sled Push",        unit: "m",   loadable: true },
    sledpull:    { name: "Sled Pull",        unit: "m",   loadable: true },
    farmers:     { name: "Farmers Carry",    unit: "m",   loadable: true },
    sandbaglunge:{ name: "Sandbag Lunge",    unit: "m",   loadable: true },
    row_cal:     { name: "Row",              unit: "cal", loadable: false }
  };
  function moveName(id) { return (MOVES[id] && MOVES[id].name) || (EX[id] && EX[id].name) || id; }
  function moveUnit(id) { return (MOVES[id] && MOVES[id].unit) || "reps"; }

  /* ============================================================ TEMPLATES */
  // progressionMode: "linear" (per session) | "weekly"
  // slot: { exId, sets, reps, pctOfAnchor?, anchorId?, topSet?, amrap?, optionId? }
  // progression[exId]: { increment, progressOn?("volume"|"intensity"), failRule:{misses,pct} }
  var BUILTINS = [
    {
      id: "starting-strength",
      kind: "barbell",
      name: "Starting Strength",
      author: "Mark Rippetoe",
      blurb: "The classic novice barbell program. Three big lifts a day, three days a week, a little more weight every single session.",
      bestFor: "Brand-new lifters, first 3–9 months under the bar",
      daysPerWeek: 3,
      progressionMode: "linear",
      startingWeight: { method: "pct-5rm", pct: 0.88 },
      anchors: ["squat", "bench", "press", "deadlift", "powerclean"],
      microcycle: [
        { label: "A", slots: [
          { exId: "squat", sets: 3, reps: 5 },
          { exId: "press", sets: 3, reps: 5 },
          { exId: "deadlift", sets: 1, reps: 5 }
        ]},
        { label: "B", slots: [
          { exId: "squat", sets: 3, reps: 5 },
          { exId: "bench", sets: 3, reps: 5 },
          { exId: "powerclean", sets: 5, reps: 3, optionId: "powerclean" }
        ]}
      ],
      options: [
        { id: "powerclean", label: "Power cleans on Day B", sub: "Off → Barbell Row 3×5 instead", default: true,
          ifOff: { replaceExId: "row", sets: 3, reps: 5 } }
      ],
      progression: {
        squat:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        bench:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        press:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        deadlift:   { increment: 5,   failRule: { misses: 3, pct: 0.9 } },
        powerclean: { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        row:        { increment: 2.5, failRule: { misses: 3, pct: 0.9 } }
      }
    },
    {
      id: "stronglifts-5x5",
      kind: "barbell",
      name: "StrongLifts 5×5",
      author: "Mehdi",
      blurb: "Five sets of five on the core barbell lifts. Start light, add 2.5 kg every workout, deload when you stall.",
      bestFor: "Beginners who want a simple, rigid structure",
      daysPerWeek: 3,
      progressionMode: "linear",
      startingWeight: { method: "pct-5rm", pct: 0.5 },
      anchors: ["squat", "bench", "press", "deadlift", "row"],
      microcycle: [
        { label: "A", slots: [
          { exId: "squat", sets: 5, reps: 5 },
          { exId: "bench", sets: 5, reps: 5 },
          { exId: "row",   sets: 5, reps: 5 }
        ]},
        { label: "B", slots: [
          { exId: "squat",    sets: 5, reps: 5 },
          { exId: "press",    sets: 5, reps: 5 },
          { exId: "deadlift", sets: 1, reps: 5 }
        ]}
      ],
      options: [],
      progression: {
        squat:    { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        bench:    { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        press:    { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        row:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        deadlift: { increment: 5,   failRule: { misses: 3, pct: 0.9 } }
      }
    },
    {
      id: "texas-method",
      kind: "barbell",
      name: "Texas Method",
      author: "Rippetoe / Kilgore",
      blurb: "An intermediate weekly cycle: a hard volume day, an easy recovery day, then a new 5-rep record on the intensity day.",
      bestFor: "Lifters who have stalled on daily linear progression",
      daysPerWeek: 3,
      progressionMode: "weekly",
      startingWeight: { method: "pct-5rm", pct: 1.0 },
      anchors: ["squat", "bench", "press", "deadlift"],
      microcycle: [
        { label: "Volume", dayType: "volume", slots: [
          { exId: "squat", sets: 5, reps: 5, pctOfAnchor: 0.9 },
          { exId: "press_primary", sets: 5, reps: 5, pctOfAnchor: 0.9 },
          { exId: "deadlift", sets: 1, reps: 5, pctOfAnchor: 1.0 }
        ]},
        { label: "Light", dayType: "light", slots: [
          { exId: "squat", sets: 2, reps: 5, pctOfAnchor: 0.7 },
          { exId: "press_secondary", sets: 3, reps: 5, pctOfAnchor: 0.75 },
          { exId: "chinup", sets: 3, reps: 8, amrap: true },
          { exId: "backext", sets: 3, reps: 12 }
        ]},
        { label: "Intensity", dayType: "intensity", slots: [
          { exId: "squat", sets: 1, reps: 5, pctOfAnchor: 1.0, topSet: true },
          { exId: "press_primary", sets: 1, reps: 5, pctOfAnchor: 1.0, topSet: true },
          { exId: "powerclean", sets: 5, reps: 3, pctOfAnchor: 1.0, optionId: "powerclean" }
        ]}
      ],
      options: [
        { id: "powerclean", label: "Power cleans on intensity day", sub: "Off → skip the pull", default: true,
          ifOff: { replaceExId: null } }
      ],
      progression: {
        squat:      { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } },
        bench:      { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } },
        press:      { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } },
        deadlift:   { increment: 5,   progressOn: "volume",    failRule: { misses: 2, pct: 0.9 } },
        powerclean: { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } }
      }
    }
  ];
  // built-in programs + any user-authored plans (db may not exist yet during self-test)
  var TEMPLATES = BUILTINS.concat(window.RC_PROGRAMS || []);
  var WOD_POOL = window.RC_WOD_POOL || [];
  var BADGES = window.RC_BADGES || [];
  function badgeById(id) { return BADGES.filter(function (b) { return b.id === id; })[0]; }
  var rollState = { filter: "all", wod: null };
  function allTemplates() {
    var custom = (typeof db !== "undefined" && db && db.customPlans) || [];
    return TEMPLATES.concat(custom);
  }
  function tplById(id) { return allTemplates().filter(function (t) { return t.id === id; })[0]; }
  function tplKind(t) { return (t && t.kind) || "barbell"; }
  function isMetcon(t) { return tplKind(t) === "metcon"; }
  function isDouble(t) { return t && t.progressionMode === "double"; }

  /* ============================================================ ENGINE */
  function e1RM(w, reps) { reps = Math.min(reps, 12); return w * (1 + reps / 30); }
  function w5RM(oneRM) { return oneRM / (1 + 5 / 30); }

  function roundLoad(w, eq) {
    var step = eq.step;
    var r = Math.round(w / step) * step;
    if (r < eq.bar) r = eq.bar;
    return Math.round(r * 100) / 100;
  }

  // round a working weight for a specific lift: barbell lifts snap to the plate
  // step and can't go below the bar; dumbbell/machine work rounds to a small
  // increment with no bar floor.
  function roundFor(exId, w, eq) {
    if (EX[exId] && EX[exId].bar) return roundLoad(w, eq);
    var inc = 2.5;
    var r = Math.max(inc, Math.round(w / inc) * inc);
    return Math.round(r * 100) / 100;
  }

  // first slot across the microcycle that trains this exId (for seed metadata)
  function slotFor(tpl, exId) {
    var mc = tpl.microcycle || [];
    for (var d = 0; d < mc.length; d++) {
      var slots = mc[d].slots || [];
      for (var i = 0; i < slots.length; i++) if (slots[i].exId === exId) return slots[i];
    }
    return null;
  }

  // give every progressing lift that isn't an anchor its own load entry so it can
  // advance independently (bodybuilding accessories). Seed from the slot's
  // seedLoad (absolute) or seedFromAnchor {id, pct}, else the bar.
  function seedExtraLifts(tpl, lifts, eq) {
    if (!tpl.progression) return lifts;
    Object.keys(tpl.progression).forEach(function (exId) {
      if (lifts[exId]) return;
      if (EX[exId] && EX[exId].bw) return;   // bodyweight moves have no load
      var slot = slotFor(tpl, exId);
      var seed;
      if (slot && slot.seedLoad != null) seed = slot.seedLoad;
      else if (slot && slot.seedFromAnchor && lifts[slot.seedFromAnchor.id]) seed = lifts[slot.seedFromAnchor.id].weight * slot.seedFromAnchor.pct;
      else seed = EX[exId] && EX[exId].bar ? eq.bar : 10;
      var w = roundFor(exId, seed, eq);
      lifts[exId] = { weight: w, start: w, failCount: 0, history: [{ t: Date.now(), w: w }] };
    });
    return lifts;
  }

  // perLiftInput[exId] = {mode:"direct", weight} | {mode:"reptest", weight, reps}
  function deriveStartingWeights(tpl, perLiftInput, eq) {
    var lifts = {};
    tpl.anchors.forEach(function (exId) {
      var inp = perLiftInput[exId];
      var base;
      if (!inp) base = eq.bar;
      else if (inp.mode === "direct") base = inp.weight;
      else base = w5RM(e1RM(inp.weight, inp.reps)) * (tpl.startingWeight.pct != null ? tpl.startingWeight.pct : 1);
      var w = roundLoad(base, eq);
      lifts[exId] = { weight: w, start: w, failCount: 0, history: [{ t: Date.now(), w: w }] };
    });
    return seedExtraLifts(tpl, lifts, eq);
  }

  function genWarmups(work, eq) {
    if (work <= eq.bar + eq.step * 1.5) return [{ weight: eq.bar, reps: 5 }];
    var out = [{ weight: eq.bar, reps: 5 }, { weight: eq.bar, reps: 5 }];
    [[0.55, 5], [0.7, 3], [0.85, 2]].forEach(function (p) {
      var w = roundLoad(eq.bar + (work - eq.bar) * p[0], eq);
      if (w > out[out.length - 1].weight && w < work) out.push({ weight: w, reps: p[1] });
    });
    return out;
  }

  function resolveExId(exId, weekIndex) {
    if (exId === "press_primary" || exId === "press_secondary") {
      var benchPrimary = (weekIndex % 2 === 0);
      if (exId === "press_primary") return benchPrimary ? "bench" : "press";
      return benchPrimary ? "press" : "bench";
    }
    return exId;
  }

  // reorder a resolved exercise list to the user's saved per-day order (by slot index)
  function applyOrder(dayLabel, exercises, ord) {
    ord = ord || (db && db.active && db.active.order && db.active.order[dayLabel]);
    if (!ord || !ord.length) return exercises;
    var bySlot = {}, used = {};
    exercises.forEach(function (x) { if (x.slotIdx != null) bySlot[x.slotIdx] = x; });
    var out = [];
    ord.forEach(function (si) { if (bySlot[si] && !used[si]) { out.push(bySlot[si]); used[si] = 1; } });
    exercises.forEach(function (x) { if (x.slotIdx == null || !used[x.slotIdx]) out.push(x); });
    return out;
  }

  function resolveSession(tpl, active, eq) {
    var cyc = tpl.microcycle;
    var day = cyc[active.cycleIndex % cyc.length];
    var wk = active.weekIndex;
    var exercises = [];
    day.slots.forEach(function (slot, slotIdx) {
      var s = slot;
      // option substitution
      if (slot.optionId && active.options[slot.optionId] === false) {
        var off = tpl.options.filter(function (o) { return o.id === slot.optionId; })[0].ifOff;
        if (!off.replaceExId) return; // dropped entirely
        s = { exId: off.replaceExId, sets: off.sets || slot.sets, reps: off.reps || slot.reps,
              pctOfAnchor: slot.pctOfAnchor };
      }
      var exId = resolveExId(s.exId, wk);
      var ex = EX[exId];
      if (!ex) return;
      var repHigh = s.repHigh || null;
      if (ex.bw) {
        exercises.push({
          exId: exId, name: ex.name, slotIdx: slotIdx, assist: true, bw: true, target: s.reps, repHigh: repHigh,
          workSets: Array.from({ length: s.sets }, function () { return { reps: s.reps, repHigh: repHigh, amrap: !!s.amrap }; })
        });
        return;
      }
      var anchorId = s.anchorId || exId;
      var lift = active.lifts[anchorId];
      var base = lift ? lift.weight : eq.bar;
      var weight;
      if (s.pctOfAnchor) weight = roundLoad(base * s.pctOfAnchor, eq);
      else if (lift) weight = roundFor(exId, lift.weight, eq);
      else if (s.seedLoad != null) weight = roundFor(exId, s.seedLoad, eq);
      else weight = roundFor(exId, base, eq);
      exercises.push({
        exId: exId, name: ex.name, slotIdx: slotIdx, weight: weight, target: s.reps, repHigh: repHigh, topSet: !!s.topSet,
        warmups: ex.bar ? genWarmups(weight, eq) : [],
        workSets: Array.from({ length: s.sets }, function () { return { weight: weight, reps: s.reps, repHigh: repHigh }; })
      });
    });
    var ordered = (db && db.active && tpl.id === db.active.templateId) ? applyOrder(day.label, exercises) : exercises;
    return { label: day.label, dayType: day.dayType || null, exercises: ordered };
  }

  /* ===================================================== METCON ENGINE */
  var FORMAT_LABEL = { amrap: "AMRAP", emom: "EMOM", fortime: "For Time", rft: "Rounds For Time", chipper: "Chipper", hyrox: "Hyrox" };
  // countdown formats show a shrinking clock; the rest count up
  function metconCountsDown(wod) { return wod.format === "amrap" || wod.format === "emom"; }
  function metconMoves(wod) { return wod.format === "hyrox" ? (wod.stations || []) : (wod.movements || []); }
  function metconSubtitle(wod) {
    if (wod.scheme) return wod.scheme + " " + (FORMAT_LABEL[wod.format] || "For Time");
    if (wod.format === "amrap") return (wod.capMin || "?") + ":00 AMRAP";
    if (wod.format === "emom") return "EMOM " + (wod.capMin || (wod.minutes ? wod.minutes.length : "?"));
    if (wod.format === "hyrox") return "Hyrox — " + ((wod.stations || []).length) + " stations";
    if (wod.format === "rft" || wod.format === "chipper") {
      var r = wod.targetRounds ? wod.targetRounds + " rounds for time" : FORMAT_LABEL[wod.format];
      return r + (wod.capMin ? " · cap " + wod.capMin + ":00" : "");
    }
    return "For Time" + (wod.capMin ? " · cap " + wod.capMin + ":00" : "");
  }
  function moveLine(m) {
    var u = m.unit || moveUnit(m.move);
    var amt = m.amount != null ? (u === "reps" ? m.amount + " × " : m.amount + " " + u + " ") : "";
    return amt + moveName(m.move) + (m.load ? " @ " + m.load + " " + (m.loadUnit || "kg") : "") + (m.note ? " (" + m.note + ")" : "");
  }
  function resolveMetcon(tpl, active) {
    var mc = tpl.microcycle;
    var day = mc[(active.cycleIndex || 0) % mc.length];
    return { kind: "metcon", label: day.label, wod: day.wod, title: day.wod.name, subtitle: metconSubtitle(day.wod) };
  }

  // result: { dayType, exercises: [{ exId, made:boolean, done:boolean, topWeight:number }] }
  // topWeight = heaviest work set actually performed; progression keys off what you really lifted.
  function applyResult(tpl, active, result, eq) {
    var notes = [];
    result.exercises.forEach(function (re) {
      var p = tpl.progression[re.exId];
      if (!p) return;
      if (re.done === false) return;   // exercise skipped entirely — no progression, no miss
      if (tpl.progressionMode === "weekly" && p.progressOn && p.progressOn !== result.dayType) return;
      var lift = active.lifts[re.exId];
      if (!lift) return;
      var basis = (re.topWeight && re.topWeight > 0) ? re.topWeight : lift.weight;

      // double progression: only add load once the top of the rep range is hit on every set.
      if (tpl.progressionMode === "double") {
        if (re.hitTop) {
          lift.weight = roundFor(re.exId, basis + p.increment, eq);
          lift.failCount = 0;
          notes.push({ exId: re.exId, kind: "up", to: lift.weight });
        } else if (re.made) {
          lift.weight = roundFor(re.exId, basis, eq);
          notes.push({ exId: re.exId, kind: "hold", double: true, to: lift.weight });
        } else {
          lift.failCount++;
          if (lift.failCount >= p.failRule.misses) {
            lift.weight = roundFor(re.exId, basis * p.failRule.pct, eq);
            lift.failCount = 0;
            notes.push({ exId: re.exId, kind: "deload", to: lift.weight });
          } else {
            lift.weight = roundFor(re.exId, basis, eq);
            notes.push({ exId: re.exId, kind: "hold", miss: lift.failCount, before: p.failRule.misses, to: lift.weight });
          }
        }
        lift.history.push({ t: Date.now(), w: lift.weight });
        return;
      }

      if (re.made) {
        lift.weight = roundLoad(basis + p.increment, eq);

    var outgoing = cur ? screens[cur] : null;
    var incoming = screens[name];
    if (back == null && cur) back = (DEPTH[name] || 0) < (DEPTH[cur] || 0);
    cur = name;

    var r = renderers[name]; if (r) r();
    if (cur !== name) return;               // renderer redirected via its own go()
    incoming.scrollTop = 0;
    renderChip();
    renderTabs();

    var RESET = SCR_RESET;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!outgoing || reduce) {
      Object.keys(screens).forEach(function (k) {
        RESET.forEach(function (c) { screens[k].classList.remove(c); });
        screens[k].classList.toggle("active", k === name);
      });
      return;
    }

    sliding = true;
    // forward: incoming rides in on top from the right; back: outgoing slides off to the right, revealing incoming underneath
    incoming.classList.add("anim", "active", back ? "from-left" : "from-right", back ? "trail" : "lead");
    outgoing.classList.add("anim", back ? "lead" : "trail");
    if (!back) outgoing.classList.add("behind");
    void incoming.offsetWidth;                // reflow so the start transform sticks
    incoming.classList.remove("from-left", "from-right");
    outgoing.classList.add(back ? "to-right" : "to-left");

    var cleanup = function () {
      outgoing.removeEventListener("transitionend", cleanup);
      clearTimeout(t);
      RESET.forEach(function (c) { incoming.classList.remove(c); outgoing.classList.remove(c); });
      outgoing.classList.remove("active");
      sliding = false;
    };
    var t = setTimeout(cleanup, 420);
    outgoing.addEventListener("transitionend", cleanup);
  }

    document.getElementById("pos-chip").hidden = true;

  /* ============================================================ CUSTOM CONTENT */
  function customWorkoutById(id) { return db.customWorkouts.filter(function (w) { return w.id === id; })[0]; }

  function openDuplicatePicker() {

    document.getElementById("ed-name").oninput = function () { t.name = this.value; };
    c.querySelectorAll(".ed-slot").forEach(function (row) {
      var di = +row.dataset.di, si = +row.dataset.si;
      var slot = t.microcycle[di].slots[si];
      row.querySelector("[data-pick]").onclick = function () {
        openMovePicker(false, function (exId) {
          var wasProg = t.progression && t.progression[slot.exId];
          slot.exId = exId;
          // keep the swapped-in lift progressing like the one it replaced
          if (wasProg && t.progression && !t.progression[exId] && !(EX[exId] && EX[exId].bw)) {
            t.progression[exId] = deepClone(wasProg);
            if (EX[exId] && EX[exId].bar && t.anchors && t.anchors.indexOf(exId) < 0) t.anchors = t.anchors.concat([exId]);

  function renderWorkoutBuilder(c) {
    var d = editorState.draft;
    if (d.kind === "metcon" && !d.wod) d.wod = { id: d.id, name: d.name, format: "amrap", scoreType: "rounds", capMin: 12, movements: [{ move: "burpee", amount: 10 }] };

    var html = '<button class="backlink" id="ed-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Programs</button>' +
      '<h2 class="title">' + (editorState.isNew ? "New workout" : "Edit workout") + '</h2>' +
      '<div class="field"><label>Name</label><input class="ed-name" id="wb-name" value="' + esc(d.name) + '" placeholder="Arm day, Saturday grind…"></div>' +
      '<div class="seg-ctl" data-wb-kind>' +
        '<button data-k="strength" aria-selected="' + (d.kind === "strength") + '">Lifting</button>' +
        '<button data-k="metcon" aria-selected="' + (d.kind === "metcon") + '">Conditioning</button>' +
      '</div>';

    if (d.kind === "strength") {
      d.exercises = d.exercises || [];
      d.exercises.forEach(function (row, i) {
        var ex = EX[row.exId] || { name: row.exId, bar: false };
        html += '<div class="day-block">' +
          '<div class="ed-slot"><button class="ed-ex" data-pickex="' + i + '">' + esc(ex.name) + '</button>' +
            '<div class="ed-nums">' + step("ex:" + i + ":sets", row.sets, 1) + step("ex:" + i + ":reps", row.reps, 1) + '</div></div>' +
          (ex.bw ? '' : '<div class="ed-slot"><span class="ed-cap">Weight (' + U() + ')</span><div class="ed-nums">' + step("ex:" + i + ":weight", row.weight || 20, 0, eq().step) + '</div></div>') +
          '<button class="btn btn-ghost sm" data-del="' + i + '" style="margin-top:6px">Remove</button>' +
        '</div>';
      });
      html += '<div class="btn-row"><button class="btn btn-ghost" id="wb-add">Add an exercise</button></div>';
    } else {
      html += '<div class="field"><label>Format</label><div class="seg-ctl" data-wb-fmt>' +
        ['amrap', 'fortime', 'rft'].map(function (f) { return '<button data-f="' + f + '" aria-selected="' + (d.wod.format === f) + '">' + FORMAT_LABEL[f] + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="ed-slot"><span class="ed-cap">' + (d.wod.format === "amrap" ? "Minutes" : "Time cap (min)") + '</span><div class="ed-nums">' + step("cap", d.wod.capMin || 12, 1) + '</div></div>';
      (d.wod.movements || []).forEach(function (m, i) {
        html += '<div class="day-block"><div class="ed-slot">' +
          '<button class="ed-ex" data-pickmv="' + i + '">' + esc(moveName(m.move)) + '</button>' +
          '<div class="ed-nums">' + step("mv:" + i + ":amount", m.amount || 10, 1) + '</div></div>' +
          '<button class="btn btn-ghost sm" data-delmv="' + i + '" style="margin-top:6px">Remove</button></div>';
      });
      html += '<div class="btn-row"><button class="btn btn-ghost" id="wb-addmv">Add a movement</button></div>';
    }
    html += '<div class="btn-row"><button class="btn btn-primary" id="wb-save">Save workout</button></div>';
    c.innerHTML = html;

    function step(path, val, min, stp) {
      return '<span class="ns" data-path="' + path + '" data-min="' + (min || 0) + '" data-step="' + (stp || 1) + '">' +
        '<button data-d="-">–</button><b>' + fmt(val) + '</b><button data-d="+">+</button></span>';
    }
    function setVal(path, delta) {
      var p = path.split(":");
      var obj, field;
      if (p[0] === "cap") { d.wod.capMin = Math.max(1, (d.wod.capMin || 12) + delta); }
      else if (p[0] === "ex") { obj = d.exercises[+p[1]]; field = p[2]; }
      else if (p[0] === "mv") { obj = d.wod.movements[+p[1]]; field = p[2]; }
      if (obj) {
        var el = c.querySelector('[data-path="' + path + '"]');
        var mn = +el.dataset.min, stp = +el.dataset.step;
        obj[field] = Math.max(mn, (+obj[field] || 0) + delta * stp);
      }
      renderers.editor();
    }

    document.getElementById("ed-back").onclick = function () { go("choose"); };
    document.getElementById("wb-name").oninput = function () { d.name = this.value; };
    c.querySelectorAll("[data-wb-kind] button").forEach(function (b) {
      b.onclick = function () { d.kind = b.dataset.k; renderers.editor(); };
    });
    var fmtSeg = c.querySelector("[data-wb-fmt]");
    if (fmtSeg) fmtSeg.querySelectorAll("button").forEach(function (b) {

      grp.querySelector("[data-d='+']").onclick = function () { setVal(grp.dataset.path, 1); };
    });
    c.querySelectorAll("[data-pickex]").forEach(function (b) {
      b.onclick = function () { var i = +b.dataset.pickex; openMovePicker(false, function (id) { d.exercises[i].exId = id; renderers.editor(); }); };
    });
    c.querySelectorAll("[data-pickmv]").forEach(function (b) {
      b.onclick = function () { var i = +b.dataset.pickmv; openMovePicker(true, function (id) { d.wod.movements[i].move = id; renderers.editor(); }); };
    });
    c.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () { d.exercises.splice(+b.dataset.del, 1); renderers.editor(); };
    });
    c.querySelectorAll("[data-delmv]").forEach(function (b) {
      b.onclick = function () { d.wod.movements.splice(+b.dataset.delmv, 1); renderers.editor(); };

    var addMv = document.getElementById("wb-addmv");

      if (d.kind === "metcon") {
        if (!(d.wod.movements || []).length) { toast("Add a movement first"); return; }
        d.wod.name = d.name; d.wod.id = d.id;
        d.wod.targetRounds = d.wod.format === "rft" ? (d.wod.targetRounds || 5) : null;
        delete d.exercises;
      } else {
        delete d.wod;
      }
      var idx = db.customWorkouts.map(function (w) { return w.id; }).indexOf(d.id);
      if (idx >= 0) db.customWorkouts[idx] = d; else db.customWorkouts.push(d);
      save();
      editorState = null;
      toast("Workout saved");
      go("choose");
    };
  }

  function runCustomWorkout(cw) {
    if (cw.kind === "metcon") {
      var w = deepClone(cw.wod);
      w.name = cw.name; w.style = "custom";
      startMetconPlayer(null, w);
      return;
    }
    startFreestyleStrength(cw);
  }

  function startFreestyleStrength(cw) {
    var exercises = (cw.exercises || []).map(function (row) {
      var ex = EX[row.exId] || { name: row.exId, bar: false };
      var isBw = !!ex.bw;
      return {
        exId: row.exId, name: ex.name, adhoc: true, assist: isBw, bw: isBw,
        target: row.reps, repHigh: null, weight: isBw ? 0 : (row.weight || 0),
        warmups: [],
        workSets: Array.from({ length: Math.max(1, row.sets || 1) }, function () { return { weight: isBw ? null : (row.weight || 0), reps: row.reps }; })
      };
    });
    if (!exercises.length) { toast("Add an exercise first"); return; }
    var queue = [];
    exercises.forEach(function (x, xi) {
      x.workSets.forEach(function (ws, si) {
        queue.push({ xi: xi, kind: "work", weight: x.assist ? null : ws.weight, reps: ws.reps,
          exId: x.exId, name: x.name, assist: !!x.assist, adhoc: true,
          setNo: si + 1, setCount: x.workSets.length, target: x.target });
      });
    });
    run = {
      custom: true, freestyleName: cw.name, customWorkoutId: cw.id,
      t: null, res: { label: cw.name, dayType: null, exercises: exercises }, queue: queue, i: 0,
      startedAt: Date.now(), chosenIdx: null,
      results: exercises.map(function (x) {
        return { exId: x.exId, name: x.name, assist: !!x.assist, bw: !!x.bw, adhoc: true, target: x.target, plannedWeight: x.weight || 0, sets: [] };
      })
    };
    renderPlayer();
  }

  function finishFreestylePlayer() {
    var sess = {
      id: uid(), date: run.startedAt, kind: "freestyle",
      templateId: null, programName: run.freestyleName, customWorkoutId: run.customWorkoutId,
      dayLabel: run.freestyleName, weekIndex: 0, dayType: null,
      durationSec: Math.round((Date.now() - run.startedAt) / 1000),
      snapshot: {}, notes: [],
      actual: run.results.map(function (r) {
        var top = r.sets.reduce(function (m, s) { return (s.weight || 0) >= (m.weight || 0) ? s : m; }, r.sets[0] || {});

  function computeStart(t, id) {

    }
    var reps = parseInt(inp.reps, 10);
    if (isNaN(w) || w <= 0 || isNaN(reps) || reps < 1 || reps > 20) return null;
    return roundLoad(w5RM(e1RM(w, reps)) * (t.startingWeight.pct != null ? t.startingWeight.pct : 1), e);
  }

  function commitProgram() {

    });
    db.equipment = Object.assign({}, draft.equipment);
