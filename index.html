<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rack Coach</title>
<meta name="description" content="A personal strength-training coach that runs a proven barbell program.">
<meta name="theme-color" content="#0f8a7c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rack Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* ============================================================
     THEME: "Arcane Teal" — the gem-glow teal from the reference
     figure carries the whole app. Light = aged paper ground,
     dark = arcane night. Amber = holding, red = missed.
     ============================================================ */
  :root {
    --bg: #e9e6da;           /* aged paper */
    --surface: #f7f5ef;
    --surface-2: #edece2;
    --line: #dbd7c8;
    --line-strong: #c4bda9;
    --text: #171c24;         /* blue-black ink */
    --text-muted: #575a54;
    --text-faint: #8b8a80;
    --accent: #0f8a7c;       /* arcane teal — actions, charts, active, emphasis */
    --accent-ink: #0a675c;   /* teal as text on the page ground */
    --accent-soft: #0f8a7c1c;
    --accent-text: #ffffff;  /* on the teal fill */
    --brand: #0f8a7c;
    --brand-soft: #0f8a7c1c;
    --wave: #0f8a7c;
    --gain: #0f8a7c;
    --hold: #9a6f26;
    --miss: #b5402c;
    --radius: 13px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(18,18,14,.06), 0 10px 30px rgba(24,26,22,.09);
    --shadow-sheet: 0 -8px 40px rgba(18,20,16,.2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1420;         /* deep blue-black */
      --surface: #151f2c;    /* night panel */
      --surface-2: #1c2938;
      --line: #2a3745;
      --line-strong: #3b4c5d;
      --text: #e7e8e4;
      --text-muted: #9aa4a5;
      --text-faint: #66727a;
      --accent: #35c8b6;
      --accent-ink: #59dccb;
      --accent-soft: #35c8b622;
      --accent-text: #04201c;
      --brand: #35c8b6;
      --brand-soft: #35c8b622;
      --wave: #35c8b6;
      --gain: #35c8b6;
      --hold: #d6a94e;
      --miss: #dd6047;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.42);
      --shadow-sheet: 0 -10px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1420; --surface: #151f2c; --surface-2: #1c2938; --line: #2a3745;
    --line-strong: #3b4c5d; --text: #e7e8e4; --text-muted: #9aa4a5; --text-faint: #66727a;
    --accent: #35c8b6; --accent-ink: #59dccb; --accent-soft: #35c8b622; --accent-text: #04201c;
    --brand: #35c8b6; --brand-soft: #35c8b622; --wave: #35c8b6; --gain: #35c8b6;
    --hold: #d6a94e; --miss: #dd6047;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.42);
    --shadow-sheet: 0 -10px 44px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  input, select { font: inherit; color: inherit; }
  h1,h2,h3,h4 { font-family: "Barlow Condensed", "Archivo Narrow", sans-serif; font-weight: 600; line-height: 1.05; text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

  /* header */
  .top {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--line);
    padding: max(11px, env(safe-area-inset-top)) 16px 11px;
    display: flex; align-items: center; gap: 10px;
  }
  .brand { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .13em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .brand b { color: var(--accent-ink); font-weight: 700; }
  .brand .mark { width: 9px; height: 9px; border-radius: 2px; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .spacer { flex: 1; }
  .pos-chip { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); border: 1px solid transparent; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 19px; height: 19px; }

  main { flex: 1; padding: 18px 16px calc(92px + env(safe-area-inset-bottom)); }
  .screen { display: none; animation: rise .26s ease both; }
  .screen.active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.title { font-size: 27px; margin-bottom: 3px; }
  .lead { color: var(--text-muted); font-size: 13.5px; margin-bottom: 18px; max-width: 46ch; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--text-faint); margin-bottom: 8px; }

  /* program cards */
  .prog-card {
    width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 15px; margin-bottom: 12px;
  }
  .prog-card:hover { border-color: var(--line-strong); }
  .prog-card h3 { font-size: 21px; }
  .prog-card .by { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-top: 2px; }
  .prog-card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 9px; }
  .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; }
  .prog-card p { font-size: 13px; color: var(--text-muted); }
  .prog-card .best { font-size: 12px; color: var(--text-faint); margin-top: 7px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: .08em; text-transform: uppercase;
    border-radius: var(--radius-sm); padding: 0 18px; height: 48px; width: 100%;
  }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-ghost { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line-strong); }
  .btn-danger { background: transparent; color: var(--miss); border: 1px solid color-mix(in srgb, var(--miss) 40%, var(--line)); }
  .btn-row { display: flex; gap: 9px; margin-top: 14px; }
  .btn-row .btn { flex: 1; }
  .btn.sm { height: 40px; font-size: 13px; padding: 0 13px; width: auto; }

  .backlink { display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
  .backlink svg { width: 15px; height: 15px; }

  /* day/session preview */
  .day-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px; margin-bottom: 10px; }
  .day-block h4 { font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .day-block h4 .dtype { font-size: 9.5px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px; letter-spacing: .08em; }
  .ex-line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .ex-line:last-child { border-bottom: none; }
  .ex-line .scheme { font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 12.5px; }
  .ex-line .wt { font-family: "IBM Plex Mono", monospace; font-weight: 500; }

  .rule-box { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: var(--radius-sm); padding: 12px 13px; font-size: 13px; color: var(--text); margin: 4px 0 16px; }
  .rule-box b { font-family: "Barlow Condensed"; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; color: var(--accent-ink); display: block; margin-bottom: 4px; }

  /* setup */
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--text-faint); margin-bottom: 7px; }
  .seg-ctl { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; }
  .seg-ctl button { flex: 1; padding: 8px 6px; border-radius: 6px; font-family: "Barlow Condensed"; font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .seg-ctl button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .num-in { width: 100%; height: 44px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); font-family: "IBM Plex Mono", monospace; font-size: 15px; }

  .lift-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 9px; }
  .lift-row .lr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .lift-row h4 { font-size: 16px; }
  .lift-row .mini-seg { display: flex; gap: 2px; padding: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; }
  .lift-row .mini-seg button { padding: 5px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; color: var(--text-muted); font-family: "Barlow Condensed"; letter-spacing: .04em; text-transform: uppercase; }
  .lift-row .mini-seg button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .lr-inputs { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .lr-inputs .fw { flex: 1; }
  .lr-inputs .fw span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; display: block; margin-bottom: 4px; }
  .lr-result { margin-top: 9px; font-size: 12.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
  .lr-result b { color: var(--accent-ink); font-weight: 600; }

  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .toggle-line:last-child { border-bottom: none; }
  .toggle-line .tl-k { font-size: 13.5px; }
  .toggle-line .tl-k p { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
  .sw { width: 46px; height: 27px; border-radius: 999px; background: var(--line-strong); position: relative; flex-shrink: 0; transition: background .16s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 999px; background: #fff; transition: transform .16s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw[aria-checked="true"] { background: var(--accent); }
  .sw[aria-checked="true"]::after { transform: translateX(19px); }

  /* train screen */
  .next-card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .next-card .nc-eye { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--accent-ink); }
  .next-card h3 { font-size: 24px; margin: 3px 0 12px; }
  .nc-ex { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .nc-ex:last-of-type { border-bottom: none; }
  .nc-ex .nx-name { font-size: 14.5px; font-weight: 500; }
  .nc-ex .nx-set { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--text-muted); }
  .nc-ex .nx-w { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 14px; }

  .recent { margin-top: 20px; }
  .rec-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 7px; font-size: 13px; }
  .rec-row .rr-day { font-family: "Barlow Condensed"; font-weight: 700; font-size: 14px; min-width: 30px; max-width: 82px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .rec-row .rr-sum { flex: 1; color: var(--text-muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .rec-row .rr-date { color: var(--text-faint); font-size: 11.5px; }

  /* home screen */
  .home-hero { padding: 14px 0 4px; }
  .home-hero .h-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .13em; font-weight: 700; color: var(--accent-ink); }
  .home-hero h2.title { font-size: 30px; margin: 4px 0 14px; }
  .home-hero .lead { margin-bottom: 22px; }
  .btn.btn-lg { height: 58px; font-size: 17px; }
  .home-links { display: flex; gap: 9px; margin-top: 10px; }
  .home-links .btn { flex: 1; }
  .home-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .home-stat { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 13px; width: 100%; }
  .home-stat .hs-k { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; }
  .home-stat .hs-v { display: block; font-family: "Barlow Condensed"; font-weight: 700; font-size: 20px; margin-top: 4px; line-height: 1; }
  .home-stat .hs-v small { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .home-stat .hs-sub { display: block; font-size: 11px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 4px; }
  .home-foot { margin-top: 22px; text-align: center; }
  .home-foot button { color: var(--text-faint); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }

  /* pick-your-workout screen */
  .pick-card { position: relative; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; margin-bottom: 12px; }
  .pick-card:hover { border-color: var(--line-strong); }
  .pick-card.suggested { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .pick-card h3 { font-size: 21px; }
  .pick-card .pk-badge { position: absolute; top: 13px; right: 13px; font-family: "Barlow Condensed"; font-weight: 700; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); background: var(--accent); border-radius: 5px; padding: 3px 7px 2px; }
  .pick-card .pk-dtype { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 600; margin-top: 1px; }
  .pick-card .pk-ex { margin-top: 10px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .pick-card .pk-w { font-family: "IBM Plex Mono", monospace; color: var(--text); font-size: 12px; margin-left: 2px; white-space: nowrap; }

  /* session player */
  .player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
  .pl-top { padding: max(12px, env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .pl-top .pl-x { color: var(--text-muted); }
  .pl-rail { flex: 1; display: flex; gap: 4px; }
  .pl-rail i { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
  .pl-rail i.done { background: color-mix(in srgb, var(--accent) 42%, var(--line)); }
  .pl-rail i.cur { background: var(--accent); }
  .pl-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 20px; gap: 6px; }
  .pl-ex { font-family: "Barlow Condensed"; font-weight: 600; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .pl-setno { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--text-faint); font-weight: 700; }
  .pl-target { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(52px, 17vw, 88px); line-height: .95; letter-spacing: .01em; }
  .pl-target .u { font-size: .34em; color: var(--text-muted); }
  .pl-x-reps { font-family: "IBM Plex Mono", monospace; font-size: 20px; color: var(--text-muted); margin-top: 2px; }
  .pl-tag { margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; }
  .pl-tag.warm { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line); }
  .pl-tag.top { background: var(--accent); color: var(--accent-text); }
  .pl-hint { font-size: 12px; color: var(--text-faint); margin-top: 10px; max-width: 30ch; }
  .pl-actions { padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 9px; }
  .pl-actions .row2 { display: flex; gap: 9px; }
  .pl-actions .row2 .btn { flex: 1; }
  .pl-done { height: 60px; font-size: 18px; }

  /* summary + progress */
  .statbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px 9px; }
  .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); font-weight: 600; }
  .stat .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: 23px; margin-top: 2px; line-height: 1; }
  .stat .v small { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .stat.hot .v { color: var(--accent-ink); }

  .change-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .change-row:last-child { border-bottom: none; }
  .change-row .cr-ic { width: 20px; text-align: center; font-weight: 700; }
  .change-row .cr-ic.up { color: var(--accent-ink); }
  .change-row .cr-ic.hold { color: var(--hold); }
  .change-row .cr-ic.deload { color: var(--miss); }
  .change-row .cr-w { margin-left: auto; font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 12.5px; }

  .lift-prog { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 13px; margin-bottom: 9px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .lift-prog h4 { font-size: 16px; }
  .lift-prog .lp-sub { font-size: 11.5px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 2px; }
  .lift-prog .lp-now { font-family: "Barlow Condensed"; font-weight: 700; font-size: 19px; text-align: right; }
  .lift-prog .lp-now small { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  svg.spark { width: 100%; height: 40px; display: block; margin-top: 6px; grid-column: 1 / -1; }

  .empty { text-align: center; padding: 40px 20px; }
  .empty .em-ic { font-size: 30px; opacity: .5; }
  .empty h3 { font-size: 20px; margin: 12px 0 5px; }
  .empty p { color: var(--text-muted); font-size: 13.5px; max-width: 34ch; margin: 0 auto 18px; }

  /* bottom tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar.show { display: flex; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--text-faint); border-radius: 10px; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button span { font-family: "Barlow Condensed"; font-weight: 600; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
  .tabbar button[aria-selected="true"] { color: var(--accent-ink); }

  /* home */
  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .home-head h2 { font-size: 26px; }
  .home-head .pos { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .snap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 18px; }
  .snap .s { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 11px; }
  .snap .s .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
  .snap .s .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: 20px; margin-top: 3px; line-height: 1; }
  .snap .s .v small { font-size: 11px; color: var(--text-muted); font-weight: 500; }

  /* line chart (weekly points) */
  svg.chart { width: 100%; height: 104px; display: block; margin-top: 10px; grid-column: 1 / -1; overflow: visible; }
  .chart-note { grid-column: 1 / -1; font-size: 11px; color: var(--text-faint); margin-top: 6px; font-family: "IBM Plex Mono", monospace; }

  /* body screen */
  .bw-hero { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .bw-hero .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; }
  .bw-hero .big { font-family: "Barlow Condensed"; font-weight: 700; font-size: 46px; line-height: 1; margin-top: 2px; }
  .bw-hero .big small { font-size: .36em; color: var(--text-muted); }
  .bw-hero .trend { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; font-family: "IBM Plex Mono", monospace; }
  .meas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0 4px; }
  .meas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; }
  .meas .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; }
  .meas .v { font-family: "Barlow Condensed"; font-weight: 700; font-size: 19px; margin-top: 2px; }
  .meas .v small { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .meas .d { font-size: 11px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; margin-top: 1px; }
  .entry-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 7px; font-size: 13px; width: 100%; text-align: left; }
  .entry-row .er-d { font-family: "Barlow Condensed"; font-weight: 700; font-size: 14px; width: 54px; flex-shrink: 0; }
  .entry-row .er-b { flex: 1; font-family: "IBM Plex Mono", monospace; color: var(--text-muted); font-size: 12px; }

  /* menu + picker */
  .menu-item { width: 100%; text-align: left; padding: 13px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 14.5px; margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .menu-item:hover { border-color: var(--accent); }
  .menu-item.danger { color: var(--miss); border-color: color-mix(in srgb, var(--miss) 35%, var(--line)); }
  .pick-item { width: 100%; text-align: left; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .pick-item:hover { border-color: var(--accent); background: var(--accent-soft); }
  .pick-item .k2 { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .field-inline { display: flex; gap: 8px; align-items: flex-end; margin: 10px 0; flex-wrap: wrap; }
  .field-inline .fi { flex: 1; min-width: 90px; }
  .field-inline .fi span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); font-weight: 700; display: block; margin-bottom: 4px; }
  .pl-menu-btn { color: var(--text-muted); }

  /* sheet */
  .sheet-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(10,8,6,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; border-radius: 18px 18px 0 0; box-shadow: var(--shadow-sheet); padding: 8px 16px max(18px, env(safe-area-inset-bottom)); overflow-y: auto; animation: slideup .26s cubic-bezier(.22,1,.36,1) both; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .grab { width: 36px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 6px auto 12px; }
  .sheet h2 { font-size: 21px; margin-bottom: 3px; }
  .sheet .sh-lead { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
  .adj-grid { display: flex; gap: 10px; margin: 14px 0; }
  .adj-grid .ag { flex: 1; text-align: center; }
  .adj-grid .ag .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .stepper { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; }
  .stepper button { height: 46px; font-size: 20px; color: var(--text-muted); font-family: "Barlow Condensed"; }
  .stepper button:active { background: var(--accent-soft); color: var(--accent-ink); }
  .stepper input { width: 100%; height: 46px; text-align: center; border: none; background: transparent; font-family: "IBM Plex Mono", monospace; font-size: 16px; font-weight: 500; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 90; opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none; box-shadow: var(--shadow); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .selftest { position: fixed; inset: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 20px; overflow: auto; z-index: 200; white-space: pre-wrap; line-height: 1.6; }
  .selftest .pass { color: var(--gain); }
  .selftest .fail { color: var(--miss); font-weight: 700; }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ============================================================ EXERCISES */
  // bar: true = loaded on a barbell (plate math + warm-ups apply)
  // grp: rough muscle group, for the add-exercise picker
  var EX = {
    // program lifts
    squat:      { name: "Back Squat",       bar: true,  grp: "Legs" },
    frontsquat: { name: "Front Squat",      bar: true,  grp: "Legs" },
    bench:      { name: "Bench Press",      bar: true,  grp: "Push" },
    incline:    { name: "Incline Bench",    bar: true,  grp: "Push" },
    closegrip:  { name: "Close-Grip Bench", bar: true,  grp: "Push" },
    press:      { name: "Overhead Press",   bar: true,  grp: "Push" },
    deadlift:   { name: "Deadlift",         bar: true,  grp: "Pull" },
    rdl:        { name: "Romanian Deadlift",bar: true,  grp: "Pull" },
    row:        { name: "Barbell Row",      bar: true,  grp: "Pull" },
    powerclean: { name: "Power Clean",      bar: true,  grp: "Pull" },
    hipthrust:  { name: "Hip Thrust",       bar: true,  grp: "Legs" },
    goodmorning:{ name: "Good Morning",     bar: true,  grp: "Pull" },
    bbcurl:     { name: "Barbell Curl",     bar: true,  grp: "Arms" },
    // dumbbell / accessory
    dbbench:    { name: "DB Bench Press",   bar: false, grp: "Push" },
    dbpress:    { name: "DB Shoulder Press",bar: false, grp: "Push" },
    dbrow:      { name: "DB Row",           bar: false, grp: "Pull" },
    dbcurl:     { name: "DB Curl",          bar: false, grp: "Arms" },
    lateral:    { name: "Lateral Raise",    bar: false, grp: "Push" },
    latpulldown:{ name: "Lat Pulldown",     bar: false, grp: "Pull" },
    cablerow:   { name: "Seated Cable Row", bar: false, grp: "Pull" },
    facepull:   { name: "Face Pull",        bar: false, grp: "Pull" },
    legpress:   { name: "Leg Press",        bar: false, grp: "Legs" },
    legcurl:    { name: "Leg Curl",         bar: false, grp: "Legs" },
    legext:     { name: "Leg Extension",    bar: false, grp: "Legs" },
    calfraise:  { name: "Calf Raise",       bar: false, grp: "Legs" },
    tricepext:  { name: "Triceps Pushdown", bar: false, grp: "Arms" },
    // bodyweight
    chinup:     { name: "Chin-up",          bar: false, grp: "Pull", bw: true },
    pullup:     { name: "Pull-up",          bar: false, grp: "Pull", bw: true },
    dip:        { name: "Dip",              bar: false, grp: "Push", bw: true },
    pushup:     { name: "Push-up",          bar: false, grp: "Push", bw: true },
    backext:    { name: "Back Extension",   bar: false, grp: "Pull", bw: true },
    plank:      { name: "Plank",            bar: false, grp: "Core", bw: true },
    legraise:   { name: "Hanging Leg Raise",bar: false, grp: "Core", bw: true },
    abwheel:    { name: "Ab Wheel",         bar: false, grp: "Core", bw: true }
  };

  /* ============================================================ TEMPLATES */
  // progressionMode: "linear" (per session) | "weekly"
  // slot: { exId, sets, reps, pctOfAnchor?, anchorId?, topSet?, amrap?, optionId? }
  // progression[exId]: { increment, progressOn?("volume"|"intensity"), failRule:{misses,pct} }
  var TEMPLATES = [
    {
      id: "starting-strength",
      name: "Starting Strength",
      author: "Mark Rippetoe",
      blurb: "The classic novice barbell program. Three big lifts a day, three days a week, a little more weight every single session.",
      bestFor: "Brand-new lifters, first 3–9 months under the bar",
      daysPerWeek: 3,
      progressionMode: "linear",
      startingWeight: { method: "pct-5rm", pct: 0.88 },
      anchors: ["squat", "bench", "press", "deadlift", "powerclean"],
      microcycle: [
        { label: "A", slots: [
          { exId: "squat", sets: 3, reps: 5 },
          { exId: "press", sets: 3, reps: 5 },
          { exId: "deadlift", sets: 1, reps: 5 }
        ]},
        { label: "B", slots: [
          { exId: "squat", sets: 3, reps: 5 },
          { exId: "bench", sets: 3, reps: 5 },
          { exId: "powerclean", sets: 5, reps: 3, optionId: "powerclean" }
        ]}
      ],
      options: [
        { id: "powerclean", label: "Power cleans on Day B", sub: "Off → Barbell Row 3×5 instead", default: true,
          ifOff: { replaceExId: "row", sets: 3, reps: 5 } }
      ],
      progression: {
        squat:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        bench:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        press:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        deadlift:   { increment: 5,   failRule: { misses: 3, pct: 0.9 } },
        powerclean: { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        row:        { increment: 2.5, failRule: { misses: 3, pct: 0.9 } }
      }
    },
    {
      id: "stronglifts-5x5",
      name: "StrongLifts 5×5",
      author: "Mehdi",
      blurb: "Five sets of five on the core barbell lifts. Start light, add 2.5 kg every workout, deload when you stall.",
      bestFor: "Beginners who want a simple, rigid structure",
      daysPerWeek: 3,
      progressionMode: "linear",
      startingWeight: { method: "pct-5rm", pct: 0.5 },
      anchors: ["squat", "bench", "press", "deadlift", "row"],
      microcycle: [
        { label: "A", slots: [
          { exId: "squat", sets: 5, reps: 5 },
          { exId: "bench", sets: 5, reps: 5 },
          { exId: "row",   sets: 5, reps: 5 }
        ]},
        { label: "B", slots: [
          { exId: "squat",    sets: 5, reps: 5 },
          { exId: "press",    sets: 5, reps: 5 },
          { exId: "deadlift", sets: 1, reps: 5 }
        ]}
      ],
      options: [],
      progression: {
        squat:    { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        bench:    { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        press:    { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        row:      { increment: 2.5, failRule: { misses: 3, pct: 0.9 } },
        deadlift: { increment: 5,   failRule: { misses: 3, pct: 0.9 } }
      }
    },
    {
      id: "texas-method",
      name: "Texas Method",
      author: "Rippetoe / Kilgore",
      blurb: "An intermediate weekly cycle: a hard volume day, an easy recovery day, then a new 5-rep record on the intensity day.",
      bestFor: "Lifters who have stalled on daily linear progression",
      daysPerWeek: 3,
      progressionMode: "weekly",
      startingWeight: { method: "pct-5rm", pct: 1.0 },
      anchors: ["squat", "bench", "press", "deadlift"],
      microcycle: [
        { label: "Volume", dayType: "volume", slots: [
          { exId: "squat", sets: 5, reps: 5, pctOfAnchor: 0.9 },
          { exId: "press_primary", sets: 5, reps: 5, pctOfAnchor: 0.9 },
          { exId: "deadlift", sets: 1, reps: 5, pctOfAnchor: 1.0 }
        ]},
        { label: "Light", dayType: "light", slots: [
          { exId: "squat", sets: 2, reps: 5, pctOfAnchor: 0.7 },
          { exId: "press_secondary", sets: 3, reps: 5, pctOfAnchor: 0.75 },
          { exId: "chinup", sets: 3, reps: 8, amrap: true },
          { exId: "backext", sets: 3, reps: 12 }
        ]},
        { label: "Intensity", dayType: "intensity", slots: [
          { exId: "squat", sets: 1, reps: 5, pctOfAnchor: 1.0, topSet: true },
          { exId: "press_primary", sets: 1, reps: 5, pctOfAnchor: 1.0, topSet: true },
          { exId: "powerclean", sets: 5, reps: 3, pctOfAnchor: 1.0, optionId: "powerclean" }
        ]}
      ],
      options: [
        { id: "powerclean", label: "Power cleans on intensity day", sub: "Off → skip the pull", default: true,
          ifOff: { replaceExId: null } }
      ],
      progression: {
        squat:      { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } },
        bench:      { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } },
        press:      { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } },
        deadlift:   { increment: 5,   progressOn: "volume",    failRule: { misses: 2, pct: 0.9 } },
        powerclean: { increment: 2.5, progressOn: "intensity", failRule: { misses: 2, pct: 0.9 } }
      }
    }
  ];
  function tplById(id) { return TEMPLATES.filter(function (t) { return t.id === id; })[0]; }

  /* ============================================================ ENGINE */
  function e1RM(w, reps) { reps = Math.min(reps, 12); return w * (1 + reps / 30); }
  function w5RM(oneRM) { return oneRM / (1 + 5 / 30); }

  function roundLoad(w, eq) {
    var step = eq.step;
    var r = Math.round(w / step) * step;
    if (r < eq.bar) r = eq.bar;
    return Math.round(r * 100) / 100;
  }

  // perLiftInput[exId] = {mode:"direct", weight} | {mode:"reptest", weight, reps}
  function deriveStartingWeights(tpl, perLiftInput, eq) {
    var lifts = {};
    tpl.anchors.forEach(function (exId) {
      var inp = perLiftInput[exId];
      var base;
      if (!inp) base = eq.bar;
      else if (inp.mode === "direct") base = inp.weight;
      else base = w5RM(e1RM(inp.weight, inp.reps)) * (tpl.startingWeight.pct != null ? tpl.startingWeight.pct : 1);
      var w = roundLoad(base, eq);
      lifts[exId] = { weight: w, start: w, failCount: 0, history: [{ t: Date.now(), w: w }] };
    });
    return lifts;
  }

  function genWarmups(work, eq) {
    if (work <= eq.bar + eq.step * 1.5) return [{ weight: eq.bar, reps: 5 }];
    var out = [{ weight: eq.bar, reps: 5 }, { weight: eq.bar, reps: 5 }];
    [[0.55, 5], [0.7, 3], [0.85, 2]].forEach(function (p) {
      var w = roundLoad(eq.bar + (work - eq.bar) * p[0], eq);
      if (w > out[out.length - 1].weight && w < work) out.push({ weight: w, reps: p[1] });
    });
    return out;
  }

  function resolveExId(exId, weekIndex) {
    if (exId === "press_primary" || exId === "press_secondary") {
      var benchPrimary = (weekIndex % 2 === 0);
      if (exId === "press_primary") return benchPrimary ? "bench" : "press";
      return benchPrimary ? "press" : "bench";
    }
    return exId;
  }

  function resolveSession(tpl, active, eq) {
    var cyc = tpl.microcycle;
    var day = cyc[active.cycleIndex % cyc.length];
    var wk = active.weekIndex;
    var exercises = [];
    day.slots.forEach(function (slot) {
      var s = slot;
      // option substitution
      if (slot.optionId && active.options[slot.optionId] === false) {
        var off = tpl.options.filter(function (o) { return o.id === slot.optionId; })[0].ifOff;
        if (!off.replaceExId) return; // dropped entirely
        s = { exId: off.replaceExId, sets: off.sets || slot.sets, reps: off.reps || slot.reps,
              pctOfAnchor: slot.pctOfAnchor };
      }
      var exId = resolveExId(s.exId, wk);
      var ex = EX[exId];
      if (!ex) return;
      if (ex.bw) {
        exercises.push({
          exId: exId, name: ex.name, assist: true, bw: true, target: s.reps,
          workSets: Array.from({ length: s.sets }, function () { return { reps: s.reps, amrap: !!s.amrap }; })
        });
        return;
      }
      var anchorId = s.anchorId || exId;
      var base = active.lifts[anchorId] ? active.lifts[anchorId].weight : eq.bar;
      var weight = s.pctOfAnchor ? roundLoad(base * s.pctOfAnchor, eq) : roundLoad(base, eq);
      exercises.push({
        exId: exId, name: ex.name, weight: weight, target: s.reps, topSet: !!s.topSet,
        warmups: ex.bar ? genWarmups(weight, eq) : [],
        workSets: Array.from({ length: s.sets }, function () { return { weight: weight, reps: s.reps }; })
      });
    });
    return { label: day.label, dayType: day.dayType || null, exercises: exercises };
  }

  // result: { dayType, exercises: [{ exId, made:boolean, done:boolean, topWeight:number }] }
  // topWeight = heaviest work set actually performed; progression keys off what you really lifted.
  function applyResult(tpl, active, result, eq) {
    var notes = [];
    result.exercises.forEach(function (re) {
      var p = tpl.progression[re.exId];
      if (!p) return;
      if (re.done === false) return;   // exercise skipped entirely — no progression, no miss
      if (tpl.progressionMode === "weekly" && p.progressOn && p.progressOn !== result.dayType) return;
      var lift = active.lifts[re.exId];
      if (!lift) return;
      var basis = (re.topWeight && re.topWeight > 0) ? re.topWeight : lift.weight;
      if (re.made) {
        lift.weight = roundLoad(basis + p.increment, eq);
        lift.failCount = 0;
        notes.push({ exId: re.exId, kind: "up", to: lift.weight });
      } else {
        lift.failCount++;
        if (lift.failCount >= p.failRule.misses) {
          lift.weight = roundLoad(basis * p.failRule.pct, eq);
          lift.failCount = 0;
          notes.push({ exId: re.exId, kind: "deload", to: lift.weight });
        } else {
          lift.weight = roundLoad(basis, eq);
          notes.push({ exId: re.exId, kind: "hold", miss: lift.failCount, before: p.failRule.misses, to: lift.weight });
        }
      }
      lift.history.push({ t: Date.now(), w: lift.weight });
    });
    // advance from the workout that was actually done (the user may have picked a
    // different day than the one scheduled). "Next" becomes the day after it.
    var len = tpl.microcycle.length;
    var done = (result.cycleIndex != null) ? (result.cycleIndex % len) : (active.cycleIndex % len);
    active.cycleIndex = done + 1;
    if (active.cycleIndex % len === 0) active.weekIndex++;
    return notes;
  }

  /* ============================================================ SELF TEST */
  function runSelfTest() {
    var out = [], ok = true;
    function A(cond, msg) { ok = ok && cond; out.push((cond ? "PASS " : "FAIL ") + msg); }
    var eq = { bar: 20, step: 2.5 };

    // --- StrongLifts derive + resolve + linear progression ---
    var SL = tplById("stronglifts-5x5");
    var slLifts = deriveStartingWeights(SL, {
      squat: { mode: "reptest", weight: 100, reps: 5 },
      bench: { mode: "direct", weight: 40 },
      press: { mode: "direct", weight: 30 },
      deadlift: { mode: "direct", weight: 60 },
      row: { mode: "direct", weight: 35 }
    }, eq);
    A(slLifts.squat.weight === 50, "SL squat start = 50% of 5RM(100×5)=50 → got " + slLifts.squat.weight);
    A(Object.keys(slLifts).every(function (k) { return slLifts[k].weight >= eq.bar && slLifts[k].weight % 2.5 === 0; }), "SL all starts loadable & ≥ bar");

    var slState = { templateId: SL.id, options: {}, cycleIndex: 0, weekIndex: 0, lifts: slLifts };
    var s0 = resolveSession(SL, slState, eq);
    A(s0.label === "A" && s0.exercises[0].exId === "squat" && s0.exercises[0].workSets.length === 5, "SL day A = Squat 5×5");
    A(s0.exercises[0].warmups[0].weight === 20 && s0.exercises[0].warmups.every(function (x, i, a) { return i === 0 || x.weight >= a[i - 1].weight; }), "SL warmups start at bar & ascend");
    A(s0.exercises[0].warmups[s0.exercises[0].warmups.length - 1].weight < 50, "SL last warmup < work weight");

    applyResult(SL, slState, { dayType: null, exercises: [{ exId: "squat", made: true }, { exId: "bench", made: true }, { exId: "row", made: true }] }, eq);
    A(slState.lifts.squat.weight === 52.5 && slState.cycleIndex === 1, "SL all-hit → squat 50→52.5, cycle advanced");

    slState.lifts.squat.failCount = 0; slState.lifts.squat.weight = 52.5;
    applyResult(SL, slState, { dayType: null, exercises: [{ exId: "squat", made: false }] }, eq);
    applyResult(SL, slState, { dayType: null, exercises: [{ exId: "squat", made: false }] }, eq);
    A(slState.lifts.squat.weight === 52.5 && slState.lifts.squat.failCount === 2, "SL 2 misses → hold at 52.5");
    var n3 = applyResult(SL, slState, { dayType: null, exercises: [{ exId: "squat", made: false }] }, eq);
    A(slState.lifts.squat.weight === 47.5 && n3[0].kind === "deload", "SL 3rd miss → deload 52.5×0.9→47.5");

    // --- Starting Strength option substitution ---
    var SS = tplById("starting-strength");
    var ssLifts = deriveStartingWeights(SS, { squat: { mode: "direct", weight: 60 }, bench: { mode: "direct", weight: 40 }, press: { mode: "direct", weight: 30 }, deadlift: { mode: "direct", weight: 80 }, powerclean: { mode: "direct", weight: 40 } }, eq);
    var ssB = resolveSession(SS, { options: { powerclean: false }, cycleIndex: 1, weekIndex: 0, lifts: ssLifts }, eq);
    A(ssB.label === "B" && ssB.exercises[2].exId === "row" && ssB.exercises[2].workSets.length === 3, "SS powerclean OFF → Barbell Row 3×5 on day B");
    var ssBon = resolveSession(SS, { options: { powerclean: true }, cycleIndex: 1, weekIndex: 0, lifts: ssLifts }, eq);
    A(ssBon.exercises[2].exId === "powerclean" && ssBon.exercises[2].workSets.length === 5, "SS powerclean ON → Power Clean 5×3");

    // --- Texas Method weekly ---
    var TX = tplById("texas-method");
    var txLifts = deriveStartingWeights(TX, { squat: { mode: "direct", weight: 140 }, bench: { mode: "direct", weight: 100 }, press: { mode: "direct", weight: 60 }, deadlift: { mode: "direct", weight: 180 } }, eq);
    var txState = { options: { powerclean: true }, cycleIndex: 0, weekIndex: 0, lifts: txLifts };
    var vol = resolveSession(TX, txState, eq);
    A(vol.dayType === "volume" && vol.exercises[0].exId === "squat" && vol.exercises[0].weight === 125 && vol.exercises[0].workSets.length === 5, "TX volume squat = round(140×0.9)=125, 5×5 → got " + vol.exercises[0].weight);
    A(vol.exercises[1].exId === "bench", "TX week 0 volume press slot = bench (bench primary on even weeks)");
    var intens = resolveSession(TX, { options: { powerclean: true }, cycleIndex: 2, weekIndex: 0, lifts: txLifts }, eq);
    A(intens.dayType === "intensity" && intens.exercises[0].weight === 140 && intens.exercises[0].topSet && intens.exercises[0].workSets.length === 1, "TX intensity squat = 140, 1×5 top set");

    var txState2 = { options: { powerclean: true }, cycleIndex: 2, weekIndex: 0, lifts: JSON.parse(JSON.stringify(txLifts)) };
    applyResult(TX, txState2, { dayType: "intensity", exercises: [{ exId: "squat", made: true }, { exId: "bench", made: true }, { exId: "powerclean", made: true }] }, eq);
    A(txState2.lifts.squat.weight === 142.5 && txState2.weekIndex === 1, "TX intensity all-hit → squat 140→142.5, week advanced");
    var volW1 = resolveSession(TX, { options: { powerclean: true }, cycleIndex: 3, weekIndex: 1, lifts: txState2.lifts }, eq);
    A(volW1.exercises[1].exId === "press", "TX week 1 (odd) volume press slot flips to overhead press");

    // deadlift progresses on volume day, not intensity
    var txState3 = { options: { powerclean: true }, cycleIndex: 0, weekIndex: 0, lifts: JSON.parse(JSON.stringify(txLifts)) };
    applyResult(TX, txState3, { dayType: "volume", exercises: [{ exId: "squat", made: true }, { exId: "bench", made: true }, { exId: "deadlift", made: true }] }, eq);
    A(txState3.lifts.deadlift.weight === 185 && txState3.lifts.squat.weight === 140, "TX deadlift progresses on volume day (+5), squat does not");

    // --- mid-session weight change feeds progression from what was actually lifted ---
    var slS2 = { options: {}, cycleIndex: 0, weekIndex: 0, lifts: deriveStartingWeights(SL, { squat: { mode: "direct", weight: 100 }, bench: { mode: "direct", weight: 60 }, press: { mode: "direct", weight: 40 }, deadlift: { mode: "direct", weight: 80 }, row: { mode: "direct", weight: 40 } }, eq) };
    applyResult(SL, slS2, { dayType: null, exercises: [{ exId: "squat", done: true, made: true, topWeight: 90 }] }, eq);
    A(slS2.lifts.squat.weight === 92.5, "mid-session drop to 90 & hit → next = 90+2.5 (not 100+2.5) → got " + slS2.lifts.squat.weight);
    var slS3 = { options: {}, cycleIndex: 0, weekIndex: 0, lifts: deriveStartingWeights(SL, { squat: { mode: "direct", weight: 100 }, bench: { mode: "direct", weight: 60 }, press: { mode: "direct", weight: 40 }, deadlift: { mode: "direct", weight: 80 }, row: { mode: "direct", weight: 40 } }, eq) };
    var n0 = applyResult(SL, slS3, { dayType: null, exercises: [{ exId: "squat", done: false }] }, eq);
    A(slS3.lifts.squat.weight === 100 && slS3.lifts.squat.failCount === 0 && n0.length === 0, "skipped exercise (done:false) → no miss, no change");

    // --- pick-a-workout: advancement follows the day actually done ---
    var pk = { options: {}, cycleIndex: 5, weekIndex: 3, lifts: deriveStartingWeights(SL, { squat: { mode: "direct", weight: 100 }, bench: { mode: "direct", weight: 60 }, press: { mode: "direct", weight: 40 }, deadlift: { mode: "direct", weight: 80 }, row: { mode: "direct", weight: 40 } }, eq) };
    applyResult(SL, pk, { dayType: null, cycleIndex: 0, exercises: [{ exId: "squat", made: true }] }, eq);
    A(pk.cycleIndex % SL.microcycle.length === 1 && pk.weekIndex === 3, "picked day A (idx 0) → next resolves to day B (idx 1), no week bump");
    var pk2 = { options: {}, cycleIndex: 5, weekIndex: 3, lifts: deriveStartingWeights(SL, { squat: { mode: "direct", weight: 100 }, bench: { mode: "direct", weight: 60 }, press: { mode: "direct", weight: 40 }, deadlift: { mode: "direct", weight: 80 }, row: { mode: "direct", weight: 40 } }, eq) };
    applyResult(SL, pk2, { dayType: null, cycleIndex: 1, exercises: [{ exId: "squat", made: true }] }, eq);
    A(pk2.cycleIndex % SL.microcycle.length === 0 && pk2.weekIndex === 4, "completed last microcycle day → weekIndex increments");

    var el = document.createElement("div");
    el.className = "selftest";
    el.innerHTML = "RACK COACH — SELF TEST\n" + (ok ? "<span class='pass'>ALL PASSED</span>" : "<span class='fail'>FAILURES ABOVE</span>") + "\n\n" +
      out.map(function (l) { return l.replace(/^PASS/, "<span class='pass'>PASS</span>").replace(/^FAIL/, "<span class='fail'>FAIL</span>"); }).join("\n") +
      "\n\n(add ?selftest to the URL to see this; reload without it to use the app)";
    document.body.appendChild(el);
    return ok;
  }
