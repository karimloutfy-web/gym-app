      } },
    jp4: { name: "4-site", sites: function () { return ["triceps", "abdomen", "suprailiac", "thigh"]; },
      bf: function (S, age, sex) {
        return sex === "f" ? 0.29669 * S - 0.00043 * S * S + 0.02963 * age + 1.4072
                           : 0.29288 * S - 0.0005 * S * S + 0.15845 * age - 5.76377;
      } },
    jp7: { name: "7-site", sites: function () { return ["chest", "axilla", "triceps", "subscap", "abdomen", "suprailiac", "thigh"]; },
      bf: function (S, age, sex) {
        var bd = sex === "f" ? 1.097 - 0.00046971 * S + 0.00000056 * S * S - 0.00012828 * age
                             : 1.112 - 0.00043499 * S + 0.00000055 * S * S - 0.00028826 * age;
        return 495 / bd - 450;
      } }
  };
  // lean / fat mass for an entry with both bodyweight and body fat
  function leanMass(e) {
    if (e.bw == null || e.bf == null) return null;
    var fat = Math.round(e.bw * e.bf / 10) / 10;
    return { fat: fat, lean: Math.round((e.bw - fat) * 10) / 10 };
  }
  function validBirthYear(v) { v = parseInt(v, 10); var y = new Date().getFullYear(); return v > 1900 && v <= y - 10 ? v : null; }
  function ageAt(birthYear, t) { return birthYear > 1900 ? new Date(t).getFullYear() - birthYear : null; }
  // -> %BF rounded to 0.1, or null if any required fold / age is missing
  function jpBodyFat(method, sex, age, folds) {
    var eq = JP[method]; if (!eq || !(age > 0)) return null;
    var S = 0, ok = true;
    eq.sites(sex).forEach(function (k) { var v = folds[k]; if (!(v > 0)) ok = false; else S += v; });
    if (!ok) return null;
    var bf = eq.bf(S, age, sex);
    return (isFinite(bf) && bf > 0 && bf < 75) ? Math.round(bf * 10) / 10 : null;
  }

  // pick(entry) -> number | null ; last entry in a week wins (db.body is date-sorted)
  function bodyWeeklySeries(pick) {
    var byWeek = {};
    db.body.slice().sort(function (a, b) { return a.date - b.date; }).forEach(function (e) {
      var v = pick(e);
      if (v == null) return;

    return Object.keys(byWeek).map(Number).sort(function (a, b) { return a - b; })
      .map(function (k) { return { t: k, v: byWeek[k] }; });
  }

  renderers.body = function () {
    var c = screens.body;
    var entries = db.body.slice().sort(function (a, b) { return a.date - b.date; });
    var last = entries[entries.length - 1] || null;
    var first = entries[0] || null;

    var html = '<div class="home-head"><h2>Body</h2>' +
      '<span class="pos">' + entries.length + ' log' + (entries.length === 1 ? '' : 's') + '</span></div>';

      html += '<div class="empty"><div class="em-ic">⚖️</div><h3>No entries yet</h3>' +

        '<button class="btn btn-primary" id="bd-log">Log an entry</button></div>';

    var series = bodyWeeklySeries(function (e) { return e.bw; });
    // judge the bodyweight card on entries that have a weight — a body-fat-only log shouldn't blank it
    var withBw = entries.filter(function (e) { return e.bw != null; });
    var lastW = withBw[withBw.length - 1] || last, firstW = withBw[0] || first;
    var trend = "";
    if (withBw.length > 1) {
      var d = lastW.bw - firstW.bw;
      trend = (d >= 0 ? "+" : "") + fmt(d) + " " + U() + " since " + shortDate(firstW.date);
    } else if (lastW) {

    }
    html += '<div class="bw-hero"><div class="k">Bodyweight</div>' +

      '<div class="trend">' + esc(trend) + '</div>' +
      (series.length >= 2 ? lineChart(series) : '') + '</div>';

    var withBf = entries.filter(function (e) { return e.bf != null; });
    if (withBf.length) {
      var lbf = withBf[withBf.length - 1], fbf = withBf[0];
      var bfSeries = bodyWeeklySeries(function (e) { return e.bf; });
      var bfd = lbf.bf - fbf.bf;
      var mName = function (e) { return e.sf ? "JP " + JP[e.sf.method].name : "entered"; };
      var prevBf = withBf[withBf.length - 2];
      var switched = prevBf && mName(prevBf) !== mName(lbf);
      var lean = leanMass(lbf);
      html += '<div class="bw-hero"><div class="k">Body fat · ' + esc(mName(lbf)) + '</div>' +
        '<div class="big">' + fmt(lbf.bf) + '<small> %</small></div>' +
        '<div class="trend">' + esc(withBf.length > 1 ? (bfd >= 0 ? "+" : "") + fmt(bfd) + " % since " + shortDate(fbf.date) : "logged " + relDate(lbf.date)) + '</div>' +
        (lean ? '<div class="trend">lean ' + fmt(lean.lean) + ' ' + U() + '  ·  fat ' + fmt(lean.fat) + ' ' + U() + '</div>' : '') +
        (switched ? '<div class="trend" style="color:var(--hold)">Method changed from ' + esc(mName(prevBf)) + ' — readings may not line up</div>' : '') +
        (bfSeries.length >= 2 ? lineChart(bfSeries) : '') + '</div>';
    }

    // measurements grid
    var shown = MEAS.filter(function (m) { return entries.some(function (e) { return e.m && e.m[m.id] != null; }); });
    if (shown.length) {
      html += '<div class="eyebrow">Measurements (' + L() + ')</div><div class="meas-grid">';
      shown.forEach(function (m) {
        var withVal = entries.filter(function (e) { return e.m && e.m[m.id] != null; });
        var lv = withVal[withVal.length - 1].m[m.id];
        var fv = withVal[0].m[m.id];
        var dd = withVal.length > 1 ? (lv - fv >= 0 ? "+" : "") + fmt(lv - fv) : "";
        html += '<div class="meas"><div class="k">' + esc(m.name) + '</div>' +
          '<div class="v">' + fmt(lv) + ' <small>' + L() + '</small></div>' +
          (dd ? '<div class="d">' + dd + ' since ' + shortDate(withVal[0].date) + '</div>' : '') + '</div>';
      });
      html += '</div>';
    }

    html += '<div class="btn-row"><button class="btn btn-primary" id="bd-log">Log an entry</button></div>';

    html += '<div class="eyebrow" style="margin-top:20px">History</div>';
    entries.slice().reverse().slice(0, 12).forEach(function (e) {
      var bits = [];
      if (e.bw != null) bits.push(fmt(e.bw) + U());
      if (e.bf != null) bits.push(fmt(e.bf) + "% bf");
      MEAS.forEach(function (m) { if (e.m && e.m[m.id] != null) bits.push(m.name.toLowerCase() + " " + fmt(e.m[m.id])); });
      html += '<button class="entry-row" data-entry="' + e.id + '">' +
        '<span class="er-d">' + shortDate(e.date) + '</span>' +
        '<span class="er-b">' + esc(bits.join("  ·  ") || "note only") + '</span></button>';
    });

    c.innerHTML = html;
    document.getElementById("bd-log").onclick = function () { openBodyEntry(null); };
    c.querySelectorAll("[data-entry]").forEach(function (b) {
      b.onclick = function () {
        var e = db.body.filter(function (x) { return x.id === b.dataset.entry; })[0];
        if (e) openBodyEntry(e);
      };
    });
  };

  function openBodyEntry(existing) {
    var e = existing || { id: null, date: Date.now(), bw: null, bf: null, m: {}, note: "" };
    var wStep = U() === "lb" ? 1 : 0.5;
    // skinfold calculator state: folds + method from this entry's calc (else last-used method);
    // sex and birth year always come from the profile in Settings
    var sf = e.sf ? { method: e.sf.method, folds: Object.assign({}, e.sf.folds) } : { method: db.settings.bfMethod || "jp4", folds: {} };
    if (!db.settings.sex && e.sf) db.settings.sex = e.sf.sex;
    if (!db.settings.birthYear && e.sf) db.settings.birthYear = e.sf.birthYear;
    Object.defineProperty(sf, "sex", { get: function () { return db.settings.sex || "m"; } });
    Object.defineProperty(sf, "birthYear", { get: function () { return db.settings.birthYear || null; } });
    var sfAge = function () { return ageAt(sf.birthYear, e.date); };
    var profileEdit = !db.settings.sex || !db.settings.birthYear;   // ask inline only when the profile is incomplete
    var sfUsed = !!e.sf;
    var html = '<h2>' + (existing ? "Edit entry · " + shortDate(e.date) : "Log entry") + '</h2>' +
      '<p class="sh-lead">Fill in whatever you measured — blanks are fine.</p>' +
      '<div class="field-inline"><div class="fi"><span>Bodyweight (' + U() + ')</span>' +
      '<div class="stepper"><button data-b="bw-">–</button><input class="mono" id="be-bw" inputmode="decimal" value="' + (e.bw != null ? fmt(e.bw) : "") + '" placeholder="—"><button data-b="bw+">+</button></div></div>' +
      '<div class="fi"><span>Body fat (%)</span>' +
      '<div class="stepper"><button data-b="bf-">–</button><input class="mono" id="be-bf" inputmode="decimal" value="' + (e.bf != null ? fmt(e.bf) : "") + '" placeholder="—"><button data-b="bf+">+</button></div></div></div>' +
      '<button class="bf-toggle" id="be-sf-toggle">' + (sfUsed ? 'Hide' : 'Calculate from') + ' skinfolds</button>' +
      '<div class="bf-calc" id="be-sf"' + (sfUsed ? '' : ' hidden') + '></div>' +
      '<div class="eyebrow" style="margin:14px 0 6px">Measurements (' + L() + ')</div><div class="meas-grid">';
    MEAS.forEach(function (m) {
      var v = (e.m && e.m[m.id] != null) ? fmt(e.m[m.id]) : "";
      html += '<div class="fi"><span>' + esc(m.name) + '</span>' +
        '<div class="stepper"><button data-b="' + m.id + '-">–</button><input class="mono" data-m="' + m.id + '" inputmode="decimal" value="' + v + '" placeholder="—"><button data-b="' + m.id + '+">+</button></div></div>';
    });
    html += '</div>' +
      '<div class="btn-row">' +
      (existing ? '<button class="btn btn-danger" id="be-del">Delete</button>' : '<button class="btn btn-ghost" id="be-cancel">Cancel</button>') +
      '<button class="btn btn-primary" id="be-save">Save</button></div>';
    openSheet(html);

    sheetRoot.querySelectorAll("[data-b]").forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.dataset.b;
        var sign = key.slice(-1) === "+" ? 1 : -1;
        var base = key.slice(0, -1);
        var inp = base === "bw" ? document.getElementById("be-bw") : base === "bf" ? document.getElementById("be-bf") : sheetRoot.querySelector('[data-m="' + base + '"]');
        var stepv = base === "bw" ? wStep : base === "bf" ? 0.5 : (L() === "in" ? 0.25 : 0.5);
        if (base === "bf") sfUsed = false;   // hand-adjusted: no longer the calculator's number
        var cur = parseFloat(inp.value);
        inp.value = fmt(Math.max(0, (isNaN(cur) ? 0 : cur) + sign * stepv));
        if (base === "bw") bwChanged(inp);
      };
    });

    var bfInp = document.getElementById("be-bf");
    var sfBox = document.getElementById("be-sf");
    bfInp.oninput = function () { sfUsed = false; };
    // the entry's bodyweight and the calculator's bodyweight are one value — mirror either way
    function bwChanged(src) {
      var top = document.getElementById("be-bw"), calc = sfBox.querySelector('[data-sf="bw"]');
      if (src !== top) top.value = src.value;
      if (calc && src !== calc) calc.value = src.value;
      if (document.getElementById("be-sf-out")) sfRecalc();
    }
    document.getElementById("be-bw").oninput = function () { bwChanged(this); };
    function sfRecalc() {
      var out = document.getElementById("be-sf-out");
      var bf = jpBodyFat(sf.method, sf.sex, sfAge(), sf.folds);
      if (bf == null) {
        out.innerHTML = sfAge() ? 'Fill in every fold to calculate.' : 'Add your birth year to calculate.';
        if (sfUsed) { bfInp.value = ""; sfUsed = false; }   // don't leave a stale calculated number behind
        return;
      }
      var S = JP[sf.method].sites(sf.sex).reduce(function (a, k) { return a + sf.folds[k]; }, 0);
      var bw = parseFloat(document.getElementById("be-bw").value);
      var lm = leanMass({ bw: isNaN(bw) ? null : bw, bf: bf });
      out.innerHTML = '<b>' + fmt(bf) + '%</b> &nbsp;Σ ' + fmt(S) + ' mm · age ' + sfAge() +
        (lm ? '<br>lean ' + fmt(lm.lean) + ' ' + U() + ' · fat ' + fmt(lm.fat) + ' ' + U() : '');
      bfInp.value = fmt(bf); sfUsed = true;
    }
    function sfRender() {
      var h = '<div class="seg-ctl" data-sf-method>' + Object.keys(JP).map(function (k) {
          return '<button data-v="' + k + '" aria-selected="' + (sf.method === k) + '">JP ' + JP[k].name + '</button>'; }).join("") + '</div>';
      if (profileEdit) {
        h += '<div class="sf-prof-note">Saved to your profile — you won\'t be asked again.</div>' +
          '<div class="seg-ctl" data-sf-sex><button data-v="m" aria-selected="' + (db.settings.sex === "m") + '">Male</button>' +
            '<button data-v="f" aria-selected="' + (db.settings.sex === "f") + '">Female</button></div>';
      } else {
        h += '<div class="sf-prof">' + (sf.sex === "f" ? "Female" : "Male") + ' · age ' + sfAge() +
          ' <span>from your profile</span><button id="be-sf-prof">Change</button></div>';
      }
      var bwNow = document.getElementById("be-bw").value;
      h += '<div class="meas-grid">' +
        '<div class="fi"><span>Bodyweight (' + U() + ')</span><div class="stepper"><button data-sfb="bw-">–</button>' +
          '<input class="mono" data-sf="bw" inputmode="decimal" value="' + esc(bwNow) + '" placeholder="—"><button data-sfb="bw+">+</button></div></div>' +
        (profileEdit ? '<div class="fi"><span>Birth year</span><div class="stepper"><button data-sfb="by-">–</button>' +
          '<input class="mono" data-sf="by" inputmode="numeric" value="' + (db.settings.birthYear || "") + '" placeholder="—"><button data-sfb="by+">+</button></div></div>' : '');
      JP[sf.method].sites(sf.sex).forEach(function (k) {
        h += '<div class="fi"><span>' + SF_SITES[k] + ' (mm) <button class="sf-i" data-sfi="' + k + '" aria-label="Where to measure ' + SF_SITES[k] + '">i</button></span><div class="stepper"><button data-sfb="' + k + '-">–</button>' +
          '<input class="mono" data-sf="' + k + '" inputmode="decimal" value="' + (sf.folds[k] != null ? fmt(sf.folds[k]) : "") + '" placeholder="—"><button data-sfb="' + k + '+">+</button></div></div>';
      });
      h += '</div><div class="sf-help" id="be-sf-help" hidden></div><div class="bf-out" id="be-sf-out"></div>';
      sfBox.innerHTML = h;
      var help = document.getElementById("be-sf-help"), helpFor = null;
      sfBox.querySelectorAll("[data-sfi]").forEach(function (b) {
        b.onclick = function () {
          var k = b.dataset.sfi, g = SF_GUIDE[k];
          if (helpFor === k) { help.hidden = true; helpFor = null; return; }
          helpFor = k; help.hidden = false;
          help.innerHTML = sfFigure(k) + '<div><div class="sh-k">' + SF_SITES[k] + ' · <span>' + g.dir + ' fold</span></div>' +
            '<p>' + esc(g.how) + '</p><p class="sh-tip">Right side, standing. Pinch 1 cm above the site, jaws on the site, read after 1–2 s.</p></div>';
        };
      });
      sfBox.querySelectorAll("[data-sf-method] button").forEach(function (b) { b.onclick = function () { sf.method = b.dataset.v; sfRender(); }; });
      sfBox.querySelectorAll("[data-sf-sex] button").forEach(function (b) { b.onclick = function () { db.settings.sex = b.dataset.v; save(); sfRender(); }; });
      var profBtn = document.getElementById("be-sf-prof");
      if (profBtn) profBtn.onclick = function () { profileEdit = true; sfRender(); };
      function read(inp) {
        var v = parseFloat(inp.value), k = inp.dataset.sf;
        if (k === "bw") { bwChanged(inp); return; }
        if (k === "by") { db.settings.birthYear = validBirthYear(inp.value); save(); }
        else if (v > 0) sf.folds[k] = v; else delete sf.folds[k];
      }
      sfBox.querySelectorAll("[data-sf]").forEach(function (inp) { inp.oninput = function () { read(inp); if (inp.dataset.sf !== "bw") sfRecalc(); }; });
      sfBox.querySelectorAll("[data-sfb]").forEach(function (b) {
        b.onclick = function () {
          var key = b.dataset.sfb, base = key.slice(0, -1), sign = key.slice(-1) === "+" ? 1 : -1;
          var inp = sfBox.querySelector('[data-sf="' + base + '"]');
          var cur = parseFloat(inp.value);
          var st = base === "by" ? 1 : base === "bw" ? wStep : 0.5;
          inp.value = fmt(Math.max(0, (isNaN(cur) ? (base === "by" ? 1990 : 0) : cur) + sign * st));
          read(inp); if (base !== "bw") sfRecalc();
        };
      });
      sfRecalc();
    }
    if (sfUsed) sfRender();
    document.getElementById("be-sf-toggle").onclick = function () {
      var open = sfBox.hidden;
      sfBox.hidden = !open;
      this.textContent = (open ? "Hide" : "Calculate from") + " skinfolds";
      if (open && !sfBox.innerHTML) sfRender();
    };

    var cancel = document.getElementById("be-cancel");
    if (cancel) cancel.onclick = function () { closeSheet(); go("body"); };
    var del = document.getElementById("be-del");
    if (del) del.onclick = function () {
      db.body = db.body.filter(function (x) { return x.id !== e.id; });
      save(); closeSheet(); go("body"); toast("Entry deleted");
    };
    document.getElementById("be-save").onclick = function () {
      var bwv = parseFloat(document.getElementById("be-bw").value);
      var m = {};
      MEAS.forEach(function (mm) {
        var v = parseFloat(sheetRoot.querySelector('[data-m="' + mm.id + '"]').value);
        if (!isNaN(v) && v > 0) m[mm.id] = v;
      });
      var bfv = parseFloat(bfInp.value);
      if (!(bfv > 0 && bfv < 75)) bfv = NaN;
      if (isNaN(bwv) && isNaN(bfv) && !Object.keys(m).length) { toast("Enter at least one number"); return; }
      // keep the skinfolds only when they produced the saved number
      var sfSave = (!isNaN(bfv) && sfUsed && jpBodyFat(sf.method, sf.sex, sfAge(), sf.folds) === bfv) ? {
        method: sf.method, sex: sf.sex, birthYear: sf.birthYear, age: sfAge(),
        folds: JP[sf.method].sites(sf.sex).reduce(function (o, k) { o[k] = sf.folds[k]; return o; }, {})
      } : null;
      if (sfSave) db.settings.bfMethod = sf.method;
      var rec = { bw: isNaN(bwv) ? null : bwv, bf: isNaN(bfv) ? null : bfv, sf: sfSave, m: m };
      if (existing) {
        Object.assign(e, rec);
      } else {
        db.body.push(Object.assign({ id: uid(), date: Date.now(), note: "" }, rec));
      }
      db.body.sort(function (a, b) { return a.date - b.date; });
      save();
      var newB = evaluateBadges();
      closeSheet(); go("body");
      toast(newB.length ? newB.length + " new badge" + (newB.length > 1 ? "s" : "") + " unlocked" : "Saved");
    };
  }

  /* ============================================================ SHEETS */
  var sheetRoot = document.getElementById("sheet-root");
  function closeSheet() { sheetRoot.innerHTML = ""; }
  function openSheet(inner) {
    sheetRoot.innerHTML = '<div class="sheet-wrap"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + '</div></div>';
    var wrap = sheetRoot.querySelector(".sheet-wrap");
    wrap.addEventListener("click", function (e) { if (e.target === wrap) closeSheet(); });
  }
  function confirmSheet(title, body, onYes, yesLabel) {
    openSheet('<h2>' + esc(title) + '</h2><p class="sh-lead">' + esc(body) + '</p>' +

  /* ============================================================ SETTINGS */
  document.getElementById("btn-settings").onclick = openSettings;
  function restByExHtml() {
    var ids = Object.keys(db.settings.restByEx).filter(function (id) { return EX[id]; })
      .sort(function (x, y) { return EX[x].name.localeCompare(EX[y].name); });
    if (!ids.length) return '';
    return '<div class="day-block rest-ex"><div class="rx-k">Per exercise</div>' + ids.map(function (id) {
      var o = db.settings.restByEx[id], bits = [];
      if (o.warm != null) bits.push("warm-ups " + restLabel(o.warm));
      if (o.work != null) bits.push("sets " + restLabel(o.work));
      return '<div class="toggle-line"><div class="tl-k">' + esc(EX[id].name) + '<p>' + bits.join(" · ") + '</p></div>' +
        '<button class="rx-reset" data-rest-reset="' + id + '">Reset</button></div>';
    }).join("") + '</div>';
  }
  function restSelect(key, opts) {
    var cur = +db.settings[key] || 0;
    if (opts.indexOf(cur) < 0) opts = opts.concat([cur]).sort(function (a, b) { return a - b; });
    return '<select class="rest-sel" data-rest="' + key + '" aria-label="' + (key === "restWarm" ? "Rest after warm-ups" : "Rest after working sets") + '">' +
      opts.map(function (v) { return '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + restLabel(v) + '</option>'; }).join("") + '</select>';
  }

    var hasData = db.sessions.length > 0 || db.active;
    openSheet(
      '<h2>Settings</h2><p class="sh-lead">Rack Coach</p>' +
      '<div class="day-block">' +
        '<div class="toggle-line"><div class="tl-k">Weight</div><div class="mini-seg" data-set="unit">' +

        '<div class="toggle-line"><div class="tl-k">Measurements</div><div class="mini-seg" data-set="len">' +
          '<button data-v="cm" aria-selected="' + (L() === "cm") + '">cm</button><button data-v="in" aria-selected="' + (L() === "in") + '">in</button></div></div>' +
        '<div class="toggle-line"><div class="tl-k">Theme</div><div class="mini-seg" data-set="theme">' +
          ['system', 'light', 'dark'].map(function (x) { return '<button data-v="' + x + '" aria-selected="' + (db.settings.theme === x) + '">' + (x === "system" ? "Auto" : x) + '</button>'; }).join("") + '</div></div>' +
        '<div class="toggle-line"><div class="tl-k">Effort scale</div><div class="mini-seg" data-set="effort">' +
          '<button data-v="rir" aria-selected="' + (!effortIsRpe()) + '">RIR</button><button data-v="rpe" aria-selected="' + (effortIsRpe()) + '">RPE</button></div></div>' +
      '</div>' +
      (db.active ? '<div class="btn-row"><button class="btn btn-ghost" id="st-change">Switch program</button></div>' : '') +
      '<div class="eyebrow" style="margin:18px 0 8px">Rest timer</div>' +
      '<div class="day-block">' +
        '<div class="toggle-line"><div class="tl-k">After warm-ups</div>' + restSelect("restWarm", REST_WARM_OPTS) + '</div>' +
        '<div class="toggle-line"><div class="tl-k">After working sets</div>' + restSelect("restWork", REST_WORK_OPTS) + '</div>' +

      '<div class="eyebrow" style="margin:18px 0 8px">Profile</div>' +
      '<div class="day-block">' +
        '<div class="toggle-line"><div class="tl-k">Sex</div><div class="mini-seg" data-set="sex">' +
          '<button data-v="m" aria-selected="' + (db.settings.sex === "m") + '">Male</button><button data-v="f" aria-selected="' + (db.settings.sex === "f") + '">Female</button></div></div>' +
        '<div class="toggle-line"><div class="tl-k">Birth year</div>' +
          '<input class="num-in mono" id="st-by" inputmode="numeric" maxlength="4" value="' + (db.settings.birthYear || "") + '" placeholder="YYYY" style="width:96px;padding:7px 10px;text-align:center"></div>' +
      '</div>' +
      '<p style="font-size: var(--fs-xs);color:var(--text-faint);line-height:1.5;margin-top:6px">Used for the body-fat calculator. Kept on this device — not shared to the feed.</p>' +
      '<div class="eyebrow" style="margin:18px 0 8px">Feed</div>' +
      (db.account

          '<div class="btn-row"><button class="btn btn-ghost" id="st-editprofile">Edit profile</button><button class="btn btn-ghost" id="st-signout">Sign out</button></div>'

      unit: function (v) { db.settings.unit = v; go(cur); },   // repaint the screen behind in the new unit
      len: function (v) { db.settings.lengthUnit = v; go(cur); },

        '<div class="btn-row"><button class="btn btn-ghost" id="er-no">Cancel</button><button class="btn btn-danger" id="er-yes">Erase</button></div>');
      document.getElementById("er-no").onclick = openSettings;
      document.getElementById("er-yes").onclick = function () {
        db = defaults(); try { localStorage.removeItem(KEY); } catch (e) {}
        applyTheme(); closeSheet(); go("choose"); toast("Erased");

  function exportData() {
    var payload = JSON.stringify(db, null, 2);
    var name = "rackcoach-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    try {
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("Backup downloaded");
    } catch (e) {
      openSheet('<h2>Backup</h2><p class="sh-lead">Copy this and keep it somewhere safe.</p>' +
        '<textarea class="num-in" style="height:200px;font-size: var(--fs-xs);padding:10px;width:100%" readonly>' + esc(JSON.stringify(db)) + '</textarea>' +
        '<div class="btn-row"><button class="btn btn-primary" id="bk-ok">Done</button></div>');
      document.getElementById("bk-ok").onclick = openSettings;
    }
  }

  function openImport() {
    openSheet('<h2>Restore backup</h2><p class="sh-lead">Paste an exported Rack Coach backup. This replaces everything on this device.</p>' +
      '<textarea class="num-in" id="imp" style="height:160px;font-size: var(--fs-xs);padding:10px;width:100%" placeholder="Paste backup JSON…"></textarea>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="imp-cancel">Cancel</button><button class="btn btn-primary" id="imp-do">Restore</button></div>');
    document.getElementById("imp-cancel").onclick = openSettings;
    document.getElementById("imp-do").onclick = function () {
      var raw = document.getElementById("imp").value.trim();
      var obj; try { obj = JSON.parse(raw); } catch (e) { toast("Not valid backup text"); return; }
      if (!obj || !obj.equipment || !Array.isArray(obj.sessions)) { toast("Not a Rack Coach backup"); return; }
      db = Object.assign(defaults(), obj);
      db.settings = Object.assign(defaults().settings, obj.settings || {});
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
      applyTheme(); closeSheet();
      go("home");
      toast("Backup restored");
    };
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (sheetRoot.innerHTML) closeSheet(); }
  });

  // a metcon clock runs on wall-clock deltas; repaint it the instant we return to foreground
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && run && run.kind === "metcon") metconTick();
    if (!document.hidden && run && run.restUntil) restTick();
  });

  /* ============================================================ SOCIAL / FEED
     A thin layer over Supabase: email-OTP sign-in, one shared profile per
     user, and a single global activity feed. The app works fully without it;
     everything here no-ops when window.RC.sb is absent (offline / blocked). */

  function sb() { return (window.RC && window.RC.sb) || null; }

  var followingIds = null;  // cached array of userIds the signed-in account follows; null = not loaded yet
  var feed = { items: [], loading: false, done: false, error: null, loaded: false, scope: "everyone" };
  var FEED_PAGE = 25;

  function tidyAuthUrl() {
    var qs = location.search || "";
    if (/[?&]error/.test(qs)) {
      var m = /error_description=([^&]+)/.exec(qs);
      toast(m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "Sign-in didn't complete — try again");
    }
    if (/[?&](code|error|state)=/.test(qs)) history.replaceState(null, "", location.origin + location.pathname);
  }

  window.addEventListener("rc-sb-ready", function () {
    var c = sb();
    if (!c) { if (cur === "feed") renderers.feed(); return; }
    c.auth.getSession().then(function (r) {
      var s = r && r.data && r.data.session;
      if (s && s.user) hydrateAccount(s.user, false);
      else if (cur === "feed") renderers.feed();
      tidyAuthUrl();
    });
    c.auth.onAuthStateChange(function (evt, session) {
      if (session && session.user) {
        tidyAuthUrl();
        var already = db.account && db.account.userId === session.user.id;
        // Supabase re-emits SIGNED_IN / TOKEN_REFRESHED when the app regains focus;
        // for an account we already know that's not a new sign-in, so stay put.
        if (already && evt !== "INITIAL_SESSION" && evt !== "USER_UPDATED") return;
        hydrateAccount(session.user, evt === "SIGNED_IN" && !already);
      } else {
        db.account = null; save();
        feed = { items: [], loading: false, done: false, error: null, loaded: false, scope: "everyone" }; followingIds = null;
        renderTabs();
        if (cur === "feed") renderers.feed();
      }
    });
  });

  function hydrateAccount(user, navigate) {
    var c = sb();
    if (!c) return;
    c.from("profiles").select("display_name, avatar_url").eq("id", user.id).maybeSingle().then(function (r) {
      var name = r && r.data && r.data.display_name;
      var avatar = (r && r.data && r.data.avatar_url) || null;
      var known = db.knownProfiles[user.id];
      // A failed or empty lookup (flaky network, token still refreshing) is not
      // proof the profile is missing — if this device already knows the name, use
      // it, and quietly re-save it in case the row really is gone.
      if (!name && known && known.displayName) {
        name = known.displayName; avatar = known.avatarUrl || null;
        if (!(r && r.error)) c.from("profiles").upsert({ id: user.id, display_name: name, avatar_url: avatar }).then(function () {});
      }
      if (!name && r && r.error) return;   // couldn't reach the server — try again on the next launch rather than re-asking
      if (name) {
        db.account = { userId: user.id, displayName: name, avatarUrl: avatar };
        db.knownProfiles[user.id] = { displayName: name, avatarUrl: avatar };
        save();
        renderTabs();
        flushPendingPush();
        backfillHistory();
        if (navigate) { closeSheet(); toast("Signed in"); go("feed"); }
        else if (cur === "feed") renderers.feed();
      } else {
        promptDisplayName(user);
      }
    });
  }

  function openSignIn() {
    if (!sb()) { toast("No connection yet — try again in a moment"); return; }
    openSheet('<h2>Sign in</h2><p class="sh-lead">Sign in with Google to share your workouts to the feed. Nothing is posted without you finishing a session.</p>' +
      '<div class="btn-row"><button class="btn btn-primary" id="si-google">Continue with Google</button></div>');
    document.getElementById("si-google").onclick = function () {
      var btn = this; btn.disabled = true; btn.textContent = "Opening Google…";
      sb().auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.origin + location.pathname }
      }).then(function (r) {
        if (r.error) { toast(r.error.message || "Couldn't start Google sign-in"); btn.disabled = false; btn.textContent = "Continue with Google"; }
        // success => full-page redirect to Google; nothing else to do here
      });
    };
  }

  function googleName(user) {
    var m = user.user_metadata || {};
    return (m.full_name || m.name || m.preferred_username || "").toString().trim().slice(0, 30);
  }
  function googleAvatar(user) {
    var m = user.user_metadata || {};
    return m.avatar_url || m.picture || null;
  }

  function promptDisplayName(user) {
    var suggested = googleName(user);
    var avatar = googleAvatar(user);
    openSheet('<h2>Pick a name</h2><p class="sh-lead">This is how you show up in the feed. You can change it later in Settings.</p>' +
      '<input class="num-in" id="dn-in" maxlength="30" autocomplete="off" placeholder="e.g. Karim L" value="' + esc(suggested) + '" style="width:100%;padding:12px;font-size: var(--fs-md)">' +
      '<div class="btn-row"><button class="btn btn-primary" id="dn-ok">Continue</button></div>');
    var i = document.getElementById("dn-in");
    i.focus(); i.select();
    document.getElementById("dn-ok").onclick = function () {
      var name = (i.value || "").trim();
      if (name.length < 2) { toast("A little longer, please"); return; }
      var btn = this; btn.disabled = true;
      sb().from("profiles").upsert({ id: user.id, display_name: name, avatar_url: avatar }).then(function (r) {
        if (r.error) { toast("Couldn't save that name"); btn.disabled = false; return; }
        db.account = { userId: user.id, displayName: name, avatarUrl: avatar };
        db.knownProfiles[user.id] = { displayName: name, avatarUrl: avatar };
        save(); closeSheet(); renderTabs(); flushPendingPush(); backfillHistory();
        toast("You're in");
        go("feed");
      });
    };
  }

  function rcSignOut() {
    if (sb()) sb().auth.signOut();
    db.account = null; save();
    feed = { items: [], loading: false, done: false, error: null, loaded: false, scope: "everyone" }; followingIds = null;
    closeSheet(); renderTabs();
    go("home");
    toast("Signed out");
  }

  function initials(name) {
    var parts = (name || "").trim().split(/\s+/);
    return ((parts[0] || "")[0] || "?").toUpperCase() + ((parts[1] || "")[0] || "").toUpperCase();
  }
  function avatarHtml(url, name, size) {
    var s = size || 36;
    if (url) return '<img class="avatar" src="' + esc(url) + '" width="' + s + '" height="' + s + '" style="width:' + s + 'px;height:' + s + 'px" alt="">';
    return '<span class="avatar avatar-fallback" style="width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(s * 0.4) + 'px">' + esc(initials(name)) + '</span>';
  }

  // downscale to a small square JPEG before upload, so phone photos don't balloon storage
  function resizeImageFile(file, maxSize, cb) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      var out = Math.min(maxSize, side);
      var cv = document.createElement("canvas");
      cv.width = out; cv.height = out;
      cv.getContext("2d").drawImage(img, sx, sy, side, side, 0, 0, out, out);
      cv.toBlob(function (blob) { cb(blob); }, "image/jpeg", 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  function uploadAvatar(file) {
    if (!db.account || !sb()) return;
    resizeImageFile(file, 256, function (blob) {
      if (!blob) { toast("Couldn't read that image"); return; }
      var path = db.account.userId + "/" + Date.now() + ".jpg";
      sb().storage.from("avatars").upload(path, blob, { contentType: "image/jpeg", upsert: true }).then(function (r) {
        if (r.error) { toast("Upload failed"); return; }
        var url = sb().storage.from("avatars").getPublicUrl(path).data.publicUrl;
        sb().from("profiles").update({ avatar_url: url }).eq("id", db.account.userId).then(function (r2) {
          if (r2.error) { toast("Couldn't save your photo"); return; }
          db.account.avatarUrl = url; db.knownProfiles[db.account.userId] = { displayName: db.account.displayName, avatarUrl: url }; save();
          toast("Photo updated");
          openEditProfile();
          if (cur === "feed") loadFeed(true);
        });
      });
    });
  }

  function openEditProfile() {
    if (!db.account) return;
    openSheet('<h2>Edit profile</h2>' +
      '<div style="display:flex;align-items:center;gap:14px;margin:10px 0 16px">' +
        '<button id="ep-avatar-btn" style="border:none;background:none;padding:0;cursor:pointer;border-radius:999px">' +
          avatarHtml(db.account.avatarUrl, db.account.displayName, 64) +
        '</button>' +
        '<div><button class="btn btn-ghost" id="ep-avatar-pick">Change photo</button></div>' +
        '<input type="file" accept="image/*" id="ep-avatar-file" hidden>' +
      '</div>' +
      '<input class="num-in" id="ep-name" maxlength="30" autocomplete="off" value="' + esc(db.account.displayName) + '" style="width:100%;padding:12px;font-size: var(--fs-md)">' +
      '<div class="btn-row"><button class="btn btn-ghost" id="ep-cancel">Cancel</button><button class="btn btn-primary" id="ep-save">Save</button></div>');
    var pick = function () { document.getElementById("ep-avatar-file").click(); };
    document.getElementById("ep-avatar-btn").onclick = pick;
    document.getElementById("ep-avatar-pick").onclick = pick;
    document.getElementById("ep-avatar-file").onchange = function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) uploadAvatar(f);
    };
    document.getElementById("ep-cancel").onclick = openSettings;
    document.getElementById("ep-save").onclick = function () {
      var name = (document.getElementById("ep-name").value || "").trim();
      if (name.length < 2) { toast("A little longer, please"); return; }
      var btn = this; btn.disabled = true;
      sb().from("profiles").update({ display_name: name }).eq("id", db.account.userId).then(function (r) {
        if (r.error) { toast("Couldn't save"); btn.disabled = false; return; }
        db.account.displayName = name; db.knownProfiles[db.account.userId] = { displayName: name, avatarUrl: db.account.avatarUrl || null }; save();
        closeSheet(); toast("Profile updated");
        if (cur === "feed") loadFeed(true);
      });
    };
  }

  function toggleFollow(userId, isFollowing, btn) {
    if (!db.account || !sb()) return;
    btn.disabled = true;
    var after = function (nowFollowing) {
      btn.disabled = false;
      btn.textContent = nowFollowing ? "Following" : "Follow";
      btn.className = "btn " + (nowFollowing ? "btn-ghost" : "btn-primary");
      btn.onclick = function () { toggleFollow(userId, nowFollowing, btn); };
      if (followingIds) {
        followingIds = nowFollowing
          ? (followingIds.indexOf(userId) < 0 ? followingIds.concat([userId]) : followingIds)
          : followingIds.filter(function (id) { return id !== userId; });
      }
      if (feed.scope === "following") loadFeed(true);
    };
    if (isFollowing) {
      sb().from("follows").delete().eq("follower_id", db.account.userId).eq("followee_id", userId).then(function (r) {
        if (r.error) { toast("Couldn't unfollow"); btn.disabled = false; return; }
        after(false);
      });
    } else {
      sb().from("follows").insert({ follower_id: db.account.userId, followee_id: userId }).then(function (r) {
        if (r.error) { toast("Couldn't follow"); btn.disabled = false; return; }
        after(true);
      });
    }
  }

  function openProfile(userId) {
    if (!sb() || !db.account) return;
    var isSelf = userId === db.account.userId;
    openSheet('<h2>Profile</h2><p class="lead">Loading…</p>');
    Promise.all([
      sb().from("profiles").select("display_name, avatar_url").eq("id", userId).maybeSingle(),
      sb().from("follows").select("follower_id", { count: "exact", head: true }).eq("followee_id", userId),
      sb().from("follows").select("followee_id", { count: "exact", head: true }).eq("follower_id", userId),
      isSelf ? Promise.resolve({ data: null }) : sb().from("follows").select("follower_id").eq("follower_id", db.account.userId).eq("followee_id", userId).maybeSingle(),
      sb().from("workouts").select(WORKOUT_SELECT).eq("user_id", userId).order("completed_at", { ascending: false }).limit(10)
    ]).then(function (results) {
      var prof = (results[0] && results[0].data) || {};
      var name = prof.display_name || "Someone";
      var followers = results[1].count || 0;
      var following = results[2].count || 0;
      var amFollowing = !!(results[3] && results[3].data);
      var workouts = (results[4] && results[4].data) || [];
      var html = '<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">' +
          avatarHtml(prof.avatar_url, name, 56) +
          '<div><h2 style="margin:0">' + esc(name) + '</h2>' +
            '<p class="sh-lead" style="margin:2px 0 0">' + followers + ' follower' + (followers === 1 ? '' : 's') + ' · ' + following + ' following</p></div>' +
        '</div>' +
        (isSelf ? '' : '<div class="btn-row"><button class="btn ' + (amFollowing ? 'btn-ghost' : 'btn-primary') + '" id="pf-follow">' + (amFollowing ? 'Following' : 'Follow') + '</button></div>') +
        '<div class="eyebrow" style="margin-top:16px">Recent workouts</div>' +
        (workouts.length ? feedItemsHtml(workouts, true) : '<p class="lead">No workouts yet.</p>');
      openSheet(html);
      var fb = document.getElementById("pf-follow");
      if (fb) fb.onclick = function () { toggleFollow(userId, amFollowing, fb); };
    }, function () {
      openSheet('<h2>Profile</h2><p class="lead">Couldn\'t load this profile.</p>');
    });
  }

  /* ---- publishing completed workouts ---- */

  function sessProgramName(sess) {
    if (sess.programName) return sess.programName;
    var t = sess.templateId ? tplById(sess.templateId) : null;
    return (t && t.name) || "Workout";
  }

  function compactSummary(sess) {
    var lifts = (sess.actual || []).filter(function (a) { return !a.assist; }).map(function (a) {
      return {
        name: a.name,
        weight: a.topWeight || 0,
        reps: a.topReps || 0,
        sets: (a.sets || []).length,
        made: a.made === true
      };
    });
    var out = { lifts: lifts, unit: U(), dayType: sess.dayType || null };
    if (sess.score) {  // metcon/WOD sessions carry a score instead of lift sets
      var sc = sess.score, bit = null;
      if (sc.rounds != null) bit = sc.rounds + " rounds" + (sc.reps ? " +" + sc.reps : "");
      else if (sc.reps != null) bit = sc.reps + " reps";
      else if (sc.load != null) bit = fmt(sc.load) + " " + U();
      else if (sc.timeSec != null) bit = fmtClock(sc.timeSec * 1000) + (sc.cappedOut ? " (capped)" : "");
      if (bit) out.score = bit + (sc.rx === false ? " · scaled" : "");
    }
    return out;
  }

  function workoutRow(sess) {
    return {
      user_id: db.account.userId,
      client_id: sess.id,
      completed_at: new Date(sess.date || Date.now()).toISOString(),
      program_name: sessProgramName(sess),
      day_label: sess.dayLabel || sess.wodName || null,
      duration_sec: sess.durationSec || null,
      summary: compactSummary(sess)
    };
  }

  function queuePush(id) {
    db.pendingPush = db.pendingPush || [];
    if (db.pendingPush.indexOf(id) < 0) { db.pendingPush.push(id); save(); }
  }
  function unqueuePush(id) {
    if (!db.pendingPush) return;
    var i = db.pendingPush.indexOf(id);
    if (i >= 0) { db.pendingPush.splice(i, 1); save(); }
  }

  function rcPublishWorkout(sess) {
    if (!sess) return;
    if (!db.account || !sb()) { queuePush(sess.id); return; }
    sb().from("workouts").upsert(workoutRow(sess), { onConflict: "user_id,client_id" }).then(function (r) {
      if (r.error) queuePush(sess.id);
      else { unqueuePush(sess.id); if (cur === "feed") loadFeed(true); }
    }, function () { queuePush(sess.id); });
  }

  function flushPendingPush() {
    if (!db.account || !sb() || !db.pendingPush || !db.pendingPush.length) return;
    db.pendingPush.slice().forEach(function (id) {
      var sess = (db.sessions || []).filter(function (s) { return s.id === id; })[0];
      if (sess) rcPublishWorkout(sess); else unqueuePush(id);
    });
  }

  // one-time-per-account: push existing local history to the feed with its real timestamps
  function backfillHistory() {
    if (!db.account || !sb() || db.backfilledFor[db.account.userId]) return;
    var sessions = db.sessions || [];
    if (!sessions.length) { db.backfilledFor[db.account.userId] = true; save(); return; }
    var rows = sessions.map(workoutRow);
    var CHUNK = 200, i = 0;
    function next() {
      if (i >= rows.length) {
        db.backfilledFor[db.account.userId] = true; save();
        if (cur === "feed") loadFeed(true);
        return;
      }
      sb().from("workouts").upsert(rows.slice(i, i + CHUNK), { onConflict: "user_id,client_id" }).then(function () {
        i += CHUNK; next();
      }, function () { /* leave unflagged — retried on next sign-in */ });
    }
    next();
  }

  /* ---- the feed ---- */

  var loadFeedCalls = [];
  var WORKOUT_SELECT = "id, user_id, completed_at, program_name, day_label, duration_sec, summary, profiles!workouts_user_id_fkey(display_name, avatar_url), kudos(user_id)";

  function ensureFollowing(cb) {
    if (followingIds) { cb(followingIds); return; }
    if (!db.account || !sb()) { cb([]); return; }
    sb().from("follows").select("followee_id").eq("follower_id", db.account.userId).then(function (r) {
      followingIds = (r.data || []).map(function (row) { return row.followee_id; });
      cb(followingIds);
    }, function () { cb([]); });
  }

  function loadFeed(reset) {
    var now = Date.now();
    loadFeedCalls = loadFeedCalls.filter(function (t) { return now - t < 3000; });
    loadFeedCalls.push(now);
    if (loadFeedCalls.length > 8) {
      console.error("Rack Coach: feed load loop detected — stopped automatically.");
      feed.loading = false; feed.loaded = true; feed.error = "Couldn't load the feed. Pull to refresh.";
      if (cur === "feed") renderers.feed();
      return;
    }
    if (feed.loading || !sb() || !db.account) return;
    if (reset) { feed.items = []; feed.done = false; }
    feed.loading = true; feed.error = null;
    if (cur === "feed") renderers.feed();

    function run(ids) {
      if (feed.scope === "following" && (!ids || !ids.length)) {
        feed.loading = false; feed.loaded = true; feed.items = []; feed.done = true;
        if (cur === "feed") renderers.feed();
        return;
      }
      var from = feed.items.length, to = from + FEED_PAGE - 1;
      var q = sb().from("workouts").select(WORKOUT_SELECT).order("completed_at", { ascending: false }).range(from, to);
      if (feed.scope === "following") q = q.in("user_id", ids);
      q.then(function (r) {
        feed.loading = false; feed.loaded = true;
        if (r.error) { feed.error = "Couldn't load the feed. Pull to refresh."; }
        else {
          var rows = r.data || [];
          feed.items = feed.items.concat(rows);
          if (rows.length < FEED_PAGE) feed.done = true;
        }
        if (cur === "feed") renderers.feed();
      }, function () {
        feed.loading = false; feed.loaded = true; feed.error = "Couldn't load the feed.";
        if (cur === "feed") renderers.feed();
      });
    }

    if (feed.scope === "following") ensureFollowing(run); else run(null);
  }

  function toggleKudos(workoutId, el) {
    if (!db.account || !sb()) return;
    var item = feed.items.filter(function (w) { return w.id === workoutId; })[0];
    if (!item) return;
    item.kudos = item.kudos || [];
    var mine = item.kudos.filter(function (k) { return k.user_id === db.account.userId; })[0];
    if (mine) {
      item.kudos = item.kudos.filter(function (k) { return k.user_id !== db.account.userId; });
      renderers.feed();
      sb().from("kudos").delete().eq("workout_id", workoutId).eq("user_id", db.account.userId).then(function (r) {
        if (r.error) { item.kudos.push({ user_id: db.account.userId }); if (cur === "feed") renderers.feed(); }
      });
    } else {
      item.kudos.push({ user_id: db.account.userId });
      renderers.feed();
      sb().from("kudos").insert({ workout_id: workoutId, user_id: db.account.userId }).then(function (r) {
        if (r.error) { item.kudos = item.kudos.filter(function (k) { return k.user_id !== db.account.userId; }); if (cur === "feed") renderers.feed(); }
      });
    }
  }

  function feedItemsHtml(items, readOnly) {
    return items.map(function (w) {
      var prof = w.profiles || {};
      var who = prof.display_name || "Someone";
      var s = w.summary || {};
      var unit = s.unit || "kg";
      var lifts = (s.lifts || []).slice(0, 4).map(function (l) {
        var wt = l.weight ? fmt(l.weight) + " " + unit : "BW";
        return '<li>' + esc(l.name) + ' · ' + wt + ' × ' + (l.reps || 0) +
          (l.sets > 1 ? ' · ' + l.sets + ' sets' : '') + (l.made ? ' ✓' : '') + '</li>';
      }).join("");
      var dur = w.duration_sec ? Math.round(w.duration_sec / 60) + " min" : "";
      var when = relDate(new Date(w.completed_at).getTime());
      var kudos = w.kudos || [];
      var gaveKudos = db.account && kudos.some(function (k) { return k.user_id === db.account.userId; });
      var isMine = db.account && w.user_id === db.account.userId;
      return '<div class="feed-card">' +
        '<div class="feed-head">' +
          '<button class="feed-who" data-profile="' + esc(w.user_id) + '">' + avatarHtml(prof.avatar_url, who, 28) + '<b>' + esc(who) + '</b></button>' +
          '<span>' + esc(when) + '</span>' +
        '</div>' +
        '<div class="feed-sub">' + esc(w.program_name || "Workout") +
          (w.day_label ? ' · ' + esc(w.day_label) : '') + (dur ? ' · ' + dur : '') + '</div>' +
        (s.score ? '<div class="feed-sub" style="margin-top:4px;font-weight:600;color:var(--accent-ink)">' + esc(s.score) + '</div>' : '') +
        (lifts ? '<ul class="feed-lifts">' + lifts + '</ul>' : '') +
        (isMine || readOnly ? (kudos.length ? '<div class="kudos-count">' + kudos.length + ' kudos</div>' : '') :
          '<button class="kudos-btn' + (gaveKudos ? ' given' : '') + '" data-kudos="' + esc(w.id) + '">' +
            (gaveKudos ? '★ Kudos' : '☆ Kudos') + (kudos.length ? ' · ' + kudos.length : '') + '</button>') +
      '</div>';
    }).join("");
  }

  function wireFeedCards(root) {
    root.querySelectorAll("[data-profile]").forEach(function (b) {
      b.onclick = function () { openProfile(b.dataset.profile); };
    });
    root.querySelectorAll("[data-kudos]").forEach(function (b) {
      b.onclick = function () { toggleKudos(b.dataset.kudos, b); };
    });
  }

  renderers.feed = function () {
    var c = screens.feed;
    if (!db.account) {
      // a faded preview of what the feed looks like, so signing in has an obvious payoff
      var ago = function (h) { return new Date(Date.now() - h * 3600000).toISOString(); };
      var sample = [
        { id: "x1", user_id: "x1", completed_at: ago(2), program_name: "Starting Strength", day_label: "A", duration_sec: 3300,
          profiles: { display_name: "Example lifter" }, kudos: [{}, {}, {}],
          summary: { unit: U(), lifts: [{ name: "Back Squat", weight: U() === "lb" ? 225 : 100, reps: 5, sets: 3, made: true }, { name: "Overhead Press", weight: U() === "lb" ? 95 : 42.5, reps: 5, sets: 3, made: true }] } },
        { id: "x2", user_id: "x2", completed_at: ago(5), program_name: "CrossFit Benchmarks", day_label: "Fran", duration_sec: 540,
          profiles: { display_name: "Example athlete" }, kudos: [{}, {}], summary: { score: "4:12 · RX" } }
      ];
      c.innerHTML = '<h2 class="title">Feed</h2>' +
        '<p class="lead">See what everyone’s lifting, follow friends and give kudos. Sign in with Google to join.</p>' +
        '<div class="btn-row"><button class="btn btn-primary btn-lg" id="fd-signin">Sign in with Google</button></div>' +
        (sb() ? '' : '<p class="lead" style="color:var(--text-faint);font-size: var(--fs-sm);margin-top:10px">Waiting for a connection…</p>') +
        '<div class="feed-preview" aria-hidden="true"><div class="fp-k">Preview</div>' + feedItemsHtml(sample, true) + '</div>';
      var b = document.getElementById("fd-signin");
      if (b) b.onclick = openSignIn;
      return;
    }
    var body;
    if (feed.items.length) body = feedItemsHtml(feed.items);
    else if (feed.loading) body = '<p class="lead">Loading…</p>';
    else if (feed.error) body = '';
    else if (feed.scope === "following") body = '<p class="lead">Follow people to see their workouts here.</p>';
    else body = '<p class="lead">No workouts yet — finish a session to be the first.</p>';

    var html = '<h2 class="title">Feed</h2>' +
      '<div class="mini-seg" data-set="feedscope" style="margin:4px 0 12px">' +
        '<button data-v="everyone" aria-selected="' + (feed.scope === "everyone") + '">Everyone</button>' +
        '<button data-v="following" aria-selected="' + (feed.scope === "following") + '">Following</button>' +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="fd-refresh"' + (feed.loading ? ' disabled' : '') + '>Refresh</button></div>' +
      '<div id="fd-list">' + body + '</div>' +
      (feed.error ? '<p class="lead" style="color:var(--miss,#c0392b)">' + esc(feed.error) + '</p>' : '') +
      (feed.items.length && !feed.done ? '<div class="btn-row"><button class="btn btn-ghost" id="fd-more"' + (feed.loading ? ' disabled' : '') + '>Load more</button></div>' : '');
    c.innerHTML = html;
    c.querySelectorAll('[data-set="feedscope"] button').forEach(function (btn) {
      btn.onclick = function () {
        if (btn.dataset.v === feed.scope) return;
        feed.scope = btn.dataset.v; feed.loaded = false;
        loadFeed(true);
      };
    });
    var rf = document.getElementById("fd-refresh"); if (rf) rf.onclick = function () { loadFeed(true); };
    var mo = document.getElementById("fd-more"); if (mo) mo.onclick = function () { loadFeed(false); };
    wireFeedCards(c);
    if (!feed.loaded && !feed.loading) loadFeed(true);
  };

  /* ============================================================ BOOT */
  go("home");
  restoreRun();
})();
</script>

<script>
  // offline support + auto-update: cache the shell so it runs with no signal,
  // and reload once when a new version has been deployed.
  if ("serviceWorker" in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading || !hadController) return;   // skip the very first claim
      reloading = true;
      // never yank the page out from under a workout (or its summary): if one is
      // running, wait until the app is next backgrounded with no workout going
      var busy = function () { return window.RC && window.RC.workoutActive && window.RC.workoutActive(); };
      if (!busy()) { location.reload(); return; }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden && !busy()) location.reload();
      });
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.update();
        setInterval(function () { reg.update(); }, 60 * 60 * 1000);
      }).catch(function () {});
    });
  }
</script>
</body>
</html>
