  /* ============================================================ HOME */
  function sessionsThisWeek() {
    var monday = new Date(); var day = (monday.getDay() + 6) % 7;
    monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - day);
    return db.sessions.filter(function (s) { return s.date >= monday.getTime(); }).length;
  }
  function latestBody() { return db.body.length ? db.body[db.body.length - 1] : null; }

  // rolling consistency metric, 0–100, over the last 4 Monday-weeks.
  // 70 pts adherence to the weekly target · 20 pts on-target streak · 10 pts recency.
  function weeklyTarget() {
    if (db.active) { var t = tplById(db.active.templateId); if (t && t.daysPerWeek) return t.daysPerWeek; }
    return 3;
  }
  function gritScore() {
    if (!db.sessions.length) return null;
    var target = weeklyTarget();
    var thisWk = weekKey(Date.now());
    var counts = [0, 0, 0, 0]; // index 0 = current week, 3 = three weeks ago
    db.sessions.forEach(function (s) {
      var idx = Math.round((thisWk - weekKey(s.date)) / 604800000);
      if (idx >= 0 && idx < 4) counts[idx]++;
    });
    var adher = 0;
    counts.forEach(function (n) { adher += Math.min(n, target); });
    adher = Math.round((adher / (target * 4)) * 70);
    var streak = 0;
    for (var i = 0; i < 4; i++) { if (counts[i] >= target) streak++; else break; }
    var streakPts = Math.min(streak, 4) * 5;
    var last = db.sessions[db.sessions.length - 1].date;
    var days = (Date.now() - last) / 86400000;
    var recency = days <= 3 ? 10 : days <= 7 ? 5 : 0;
    var score = Math.max(0, Math.min(100, adher + streakPts + recency));
    var band = score >= 80 ? "Forging" : score >= 55 ? "Steady" : score >= 25 ? "Slipping" : "Cold";
    return { score: score, band: band, weeks: counts.slice().reverse(), target: target };
  }
  /* ============================================================ BADGE STATS */
  var DAY_MS = 86400000;
  function dayKey(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function seasonOf(ts) { return ["winter", "spring", "summer", "autumn"][Math.floor(((new Date(ts).getMonth()) % 12) / 3)]; }

  function computeStats() {
    var ss = db.sessions.slice().sort(function (a, b) { return a.date - b.date; });
    var st = {
      totalSessions: ss.length, totalVolume: 0, maxSessionVolume: 0, totalReps: 0,
      metconCount: 0, hyroxCount: 0, rollerCount: 0, freestyleCount: 0,
      hyroxFullSims: 0, wodsRx: 0, rirZeroSets: 0, tankSessions: 0,
      earlyCount: 0, lateCount: 0, weekendCount: 0, midnight: false,
      longestSessionSec: 0, fastestWodSec: null, bestHyroxSec: null,
      emomDone: false, chipperDone: false, doubleBumps: 0, noteCount: 0,
      bestLift: {}, prCount: 0, deloadRecovered: false,
      bestWeekCount: 0, weeksHitTarget: 0, currentStreak: 0, longestStreak: 0,
      comeback: false, daysOfWeek: 0, seasonCount: 0,
      distinctExercises: 0, distinctPrograms: 0, distinctWods: 0,
      maxProgramSessions: 0, ranBarbellTrio: false, bestBwMultiple: 0, hybridDay: false,
      bodyLogCount: db.body.length, measureLogCount: 0,
      grit: (gritScore() || { score: 0 }).score
    };

    var bestE1 = {}, sawDeload = {}, seasons = {}, dows = {}, exSet = {}, progSet = {}, wodSet = {};
    var progCount = {}, weekCount = {}, dayHits = {}, dayHasKind = {};

    ss.forEach(function (s) {
      var d = new Date(s.date), hr = d.getHours();
      if (hr < 6) st.earlyCount++;
      if (hr >= 21) st.lateCount++;
      if (hr < 4) st.midnight = true;
      if (d.getDay() === 0 || d.getDay() === 6) st.weekendCount++;
      dows[d.getDay()] = 1;
      seasons[seasonOf(s.date)] = 1;
      st.longestSessionSec = Math.max(st.longestSessionSec, s.durationSec || 0);
      var wk = weekKey(s.date); weekCount[wk] = (weekCount[wk] || 0) + 1;
      var dk = dayKey(s.date); dayHits[dk] = 1;
      var kindTag = s.kind === "metcon" ? "metcon" : "strength";
      dayHasKind[dk] = dayHasKind[dk] || {}; dayHasKind[dk][kindTag] = 1;

      if (s.templateId) { progSet[s.templateId] = 1; progCount[s.templateId] = (progCount[s.templateId] || 0) + 1; }

      if (s.kind === "metcon") {
        st.metconCount++;
        if (s.style === "hyrox" || s.format === "hyrox") st.hyroxCount++;
        if (s.format === "hyrox" && (s.movements || []).length >= 8) {
          st.hyroxFullSims++;
          if (s.score && s.score.timeSec > 0) st.bestHyroxSec = st.bestHyroxSec == null ? s.score.timeSec : Math.min(st.bestHyroxSec, s.score.timeSec);
        }
        if (s.format === "emom") st.emomDone = true;
        if (s.format === "chipper") st.chipperDone = true;
        if (s.score && s.score.rx) st.wodsRx++;
        if (s.score && s.score.type === "time" && s.score.timeSec > 0 && !s.score.cappedOut)
          st.fastestWodSec = st.fastestWodSec == null ? s.score.timeSec : Math.min(st.fastestWodSec, s.score.timeSec);
        if (s.wodName) wodSet[s.wodName] = 1;
        if (s.source === "roller") st.rollerCount++;
        return;
      }
      if (s.kind === "freestyle") st.freestyleCount++;
      if (s.source === "roller") st.rollerCount++;

      // strength-shaped session
      var vol = 0, sessRirs = [], loggedWork = 0;
      (s.actual || []).forEach(function (a) {
        exSet[a.exId] = 1;
        var topW = 0, topR = 0;
        (a.sets || []).forEach(function (x) {
          vol += (x.weight || 0) * (x.reps || 0);
          st.totalReps += (x.reps || 0);
          if (x.rir === 0) st.rirZeroSets++;
          if (!a.assist && x.reps > 0) { loggedWork++; sessRirs.push(x.rir); }
          if ((x.weight || 0) >= topW) { topW = x.weight || 0; topR = x.reps || 0; }
        });
        if (topW > 0) {
          st.bestLift[a.exId] = Math.max(st.bestLift[a.exId] || 0, topW);
          var e1 = topW * (1 + Math.min(topR, 12) / 30);
          if (bestE1[a.exId] && e1 > bestE1[a.exId] * 1.001) st.prCount++;
          bestE1[a.exId] = Math.max(bestE1[a.exId] || 0, e1);
        }
      });
      st.totalVolume += vol;
      st.maxSessionVolume = Math.max(st.maxSessionVolume, vol);
      if (loggedWork >= 3 && sessRirs.every(function (v) { return v != null && v >= 2; })) st.tankSessions++;

      (s.notes || []).forEach(function (n) {
        if (n.kind === "deload") sawDeload[n.exId] = 1;
        if (n.kind === "up" && sawDeload[n.exId]) st.deloadRecovered = true;
        if (n.kind === "up") {
          var tt = tplById(s.templateId);
          if (tt && tt.progressionMode === "double") st.doubleBumps++;
        }
      });
    });

    // notes on body logs
    db.body.forEach(function (e) {
      if (e.note) st.noteCount++;
      if (e.m && Object.keys(e.m).some(function (k) { return e.m[k] != null; })) st.measureLogCount++;
    });

    // streaks
    var days = Object.keys(dayHits).map(Number).sort(function (a, b) { return a - b; });
    var run = 0, best = 0;
    for (var i = 0; i < days.length; i++) {
      if (i > 0 && days[i] - days[i - 1] === DAY_MS) run++; else run = 1;
      best = Math.max(best, run);
      if (i > 0 && days[i] - days[i - 1] >= 14 * DAY_MS) st.comeback = true;
    }
    st.longestStreak = best;
    if (days.length) {
      var today = dayKey(Date.now()), lastDay = days[days.length - 1];
      if (today - lastDay <= DAY_MS) {
        var cs = 1;
        for (var j = days.length - 1; j > 0; j--) { if (days[j] - days[j - 1] === DAY_MS) cs++; else break; }
        st.currentStreak = cs;
      }
    }

    var target = weeklyTarget();
    Object.keys(weekCount).forEach(function (k) {
      st.bestWeekCount = Math.max(st.bestWeekCount, weekCount[k]);
      if (weekCount[k] >= target) st.weeksHitTarget++;
    });
    Object.keys(dayHasKind).forEach(function (k) { if (dayHasKind[k].metcon && dayHasKind[k].strength) st.hybridDay = true; });

    st.daysOfWeek = Object.keys(dows).length;
    st.seasonCount = Object.keys(seasons).length;
    st.distinctExercises = Object.keys(exSet).length;
    st.distinctPrograms = Object.keys(progSet).length;
    st.distinctWods = Object.keys(wodSet).length;

  function confettiBurst(canvas) {
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var W = canvas.width = canvas.offsetWidth, H = canvas.height = canvas.offsetHeight;
    var cols = ["#35c8b6", "#dcae3c", "#48c9b6", "#9aa7b2", "#e0b64a"];
    var bits = [];
    for (var i = 0; i < 90; i++) bits.push({
      x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.32,
      vx: (Math.random() - 0.5) * 9, vy: -6 - Math.random() * 8,
      s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4
    });
    var t0 = Date.now();
    function frame() {
      var el = Date.now() - t0;
      ctx.clearRect(0, 0, W, H);
      bits.forEach(function (b) {
        b.vy += 0.32; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vx *= 0.99;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.globalAlpha = Math.max(0, 1 - el / 2600);
        ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.6);
        ctx.restore();
      });
      if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

    var rb = document.getElementById("rl-roll"); if (rb) rb.onclick = doRoll;
    var ra = document.getElementById("rl-again"); if (ra) ra.onclick = doRoll;
    var rs = document.getElementById("rl-start");
    if (rs) rs.onclick = function () { startMetconPlayer(null, rollState.wod); };
  };

  /* ============================================================ SESSION PLAYER */
  var run = null;
  function startPlayer(chosenIdx) {
    var t = tplById(db.active.templateId);
    if (!t) { db.active = null; save(); go("choose"); return; }
    if (isMetcon(t)) { startMetconPlayer(chosenIdx); return; }
    var len = t.microcycle.length;
    var idx = (chosenIdx == null) ? (db.active.cycleIndex % len) : (chosenIdx % len);
    var actForResolve = (chosenIdx == null) ? db.active
      : { options: db.active.options, cycleIndex: idx, weekIndex: db.active.weekIndex, lifts: db.active.lifts };
    var res = resolveSession(t, actForResolve, eq());
    // flatten to a queue of sets: warmups + work per exercise
    var queue = [];
    res.exercises.forEach(function (x, xi) {
      (x.warmups || []).forEach(function (w) {
        queue.push({ xi: xi, kind: "warm", weight: w.weight, reps: w.reps, exId: x.exId, name: x.name });
      });
      x.workSets.forEach(function (w, si) {
        queue.push({ xi: xi, kind: "work", weight: x.assist ? null : w.weight, reps: w.reps, amrap: !!w.amrap,
          exId: x.exId, name: x.name, assist: !!x.assist, topSet: !!x.topSet,
          setNo: si + 1, setCount: x.workSets.length, target: x.target, repHigh: w.repHigh || x.repHigh || null });
      });
    });
    run = { t: t, res: res, queue: queue, i: 0, startedAt: Date.now(), chosenIdx: idx,
      results: res.exercises.map(function (x) {
        return { exId: x.exId, name: x.name, assist: !!x.assist, bw: !!x.bw, adhoc: !!x.adhoc,
          target: x.target, plannedWeight: x.weight || 0, sets: [] };
      }) };
    renderPlayer();
  }

  // insert a new exercise at the end of the current run
  function addExerciseToRun(exId, sets, reps, weight) {
    var ex = EX[exId];
    var xi = run.res.exercises.length;
    var isBw = !!ex.bw;
    var exObj = {
      exId: exId, name: ex.name, adhoc: true, assist: isBw, bw: isBw,
      target: reps, weight: isBw ? 0 : weight,
      warmups: [],
      workSets: Array.from({ length: sets }, function () { return { weight: isBw ? null : weight, reps: reps }; })
    };
    run.res.exercises.push(exObj);
    run.results.push({ exId: exId, name: ex.name, assist: isBw, bw: isBw, adhoc: true,
      target: reps, plannedWeight: isBw ? 0 : weight, sets: [] });
    for (var si = 0; si < sets; si++) {
      run.queue.push({ xi: xi, kind: "work", weight: isBw ? null : weight, reps: reps,
        exId: exId, name: ex.name, assist: isBw, adhoc: true,
        setNo: si + 1, setCount: sets, target: reps });
    }
    renderPlayer();
  }

  // change the working weight for the current exercise, from this set onward
  function changeCurrentWeight(newW) {
    var step = run.queue[run.i];
    var xi = step.xi;
    for (var k = run.i; k < run.queue.length; k++) {
      if (run.queue[k].xi === xi && run.queue[k].kind === "work") run.queue[k].weight = newW;
    }
    run.res.exercises[xi].weight = newW;
    run.results[xi].changedWeight = newW;
    renderPlayer();
  }

  function renderPlayer() {
    var root = document.getElementById("player-root");
    if (!run) { root.innerHTML = ""; return; }
    if (run.kind === "metcon") { renderMetconPlayer(); return; }
    if (run.i >= run.queue.length) { run.custom ? finishFreestylePlayer() : finishPlayer(); return; }

    // build the shell once, then update its parts in place (no full-DOM flash between sets)
    if (!root.querySelector(".player")) {
      root.innerHTML =
        '<div class="player">' +
          '<div class="pl-top">' +
            '<button class="icon-btn pl-x" id="pl-close" aria-label="Close">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
            '<div class="pl-rail" id="pl-rail"></div>' +
            '<span class="pl-count" id="pl-count"></span>' +
            '<button class="icon-btn pl-menu-btn" id="pl-menu" aria-label="Workout options">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>' +
          '</div>' +
          '<div class="pl-body" id="pl-body"></div>' +
          '<div class="pl-actions" id="pl-actions"></div>' +
        '</div>';
      document.getElementById("pl-close").onclick = endWorkoutPrompt;
      document.getElementById("pl-menu").onclick = function () { openPlayerMenu(run.queue[run.i]); };
      var plNew = root.querySelector(".player");
      void plNew.offsetWidth;                 // commit the off-screen start position
      plNew.classList.add("show");            // then slide up
    }

    var step = run.queue[run.i];

    document.getElementById("pl-rail").innerHTML = run.res.exercises.map(function (x, xi) {
      return '<i class="' + (xi < step.xi ? "done" : xi === step.xi ? "cur" : "") + '"></i>';
    }).join("");

    var totalWork = 0, doneWork = 0;
    run.queue.forEach(function (q, qi) { if (q.kind === "work") { totalWork++; if (qi < run.i) doneWork++; } });
    document.getElementById("pl-count").textContent = "Set " + Math.min(doneWork + 1, totalWork) + " / " + totalWork;

    var body;
    if (step.assist) {

        '<div class="pl-sub">' +
        (step.amrap ? '<div class="pl-hint">As many good reps as you can — at least ' + step.target + '.</div>'
          : (step.repHigh ? '<div class="pl-hint">Aim for the top of the range on every set.</div>' : '<div class="pl-hint">Bodyweight.</div>')) +
        '</div>';
    } else {
      var setLabel = step.kind === "warm" ? "Warm-up" : (step.topSet ? "Work set" : "Set " + step.setNo + " of " + step.setCount);
      body = '<div class="pl-ex">' + esc(step.name) + '</div>' +
        '<div class="pl-setno">' + setLabel + '</div>' +
        '<div class="pl-target">' + fmt(step.weight) + '<span class="u"> ' + U() + '</span></div>' +
        '<div class="pl-sub">' +
        '<div class="pl-x-reps">× ' + repRange(step.reps, step.repHigh) + (step.amrap ? '+' : '') + ' reps</div>' +
        (step.kind === "warm" ? '<div class="pl-tag warm">Warm-up</div>' : (step.topSet ? '<div class="pl-tag top">Top set — make it count</div>' : '')) +
        ((EX[step.exId] && EX[step.exId].bar && (step.kind === "warm" || step.kind === "work") && plateStr(step.weight)) ? '<div class="pl-hint">' + plateStr(step.weight) + '</div>' : (step.repHigh ? '<div class="pl-hint">Top of the range on every set.</div>' : '')) +
        '</div>';
    }
    document.getElementById("pl-body").innerHTML = body;

    var doneLabel = step.kind === "warm" ? "Warm-up done" : "Set done";
    var effortStrip = "";
    if (step.kind === "work") {
      effortStrip = '<div class="pl-effort" id="pl-effort"><span class="pe-k">' +
        (effortIsRpe() ? "RPE" : "Reps left") + '</span>' +
        RIR_VALUES.map(function (v) {
          return '<button class="pe-chip' + (run.pendingRir === v ? ' on' : '') + '" data-rir="' + v + '">' + effortChipLabel(v) + '</button>';
        }).join("") + '</div>';
    }
    document.getElementById("pl-actions").innerHTML =
      effortStrip +
      '<div class="pl-prow">' +
        '<button class="btn btn-ghost pl-back" id="pl-back"' + (run.i <= 0 ? ' disabled' : '') + '>Back</button>' +
        '<button class="btn btn-primary pl-done" id="pl-done">' + doneLabel + '</button>' +
      '</div>' +
      (!step.assist ? '<button class="btn btn-ghost pl-cw" id="pl-cw">Change weight</button>' : '') +
      '<div class="row2">' +
        (step.kind === "work" && !step.assist ? '<button class="btn btn-ghost sm" id="pl-adjust">Log different</button>' : '') +
        (step.assist ? '<button class="btn btn-ghost sm" id="pl-adjust">Log reps</button>' : '') +
        '<button class="btn btn-ghost sm" id="pl-skip">Skip set</button>' +
      '</div>';

    var back = document.getElementById("pl-back");
    if (back) back.onclick = stepBack;
    var eff = document.getElementById("pl-effort");
    if (eff) eff.querySelectorAll("[data-rir]").forEach(function (b) {
      b.onclick = function () {
        var v = +b.dataset.rir;
        run.pendingRir = (run.pendingRir === v) ? null : v;
        eff.querySelectorAll("[data-rir]").forEach(function (x) { x.classList.toggle("on", +x.dataset.rir === run.pendingRir); });
      };
    });
    // a range set's prescription is "top of the range" — "Set done" logs that; fell short → "Log different"
    document.getElementById("pl-done").onclick = function () { recordSet(step, step.weight, step.repHigh || step.reps, true); };
    document.getElementById("pl-skip").onclick = function () { recordSet(step, step.weight, 0, false); };
    var adj = document.getElementById("pl-adjust");
    if (adj) adj.onclick = function () { openAdjust(step); };

  }

  function endWorkoutPrompt() {
    confirmSheet("End this workout?", "Nothing from this session is saved and your program won't advance.", function () {
      if (run && run.tick) { clearInterval(run.tick); run.tick = null; }
      run = null;
      dismissPlayer(function () { go("home", true); });
    });
  }

  function openPlayerMenu(step) {
    openSheet(
      '<h2>Workout options</h2>' +
      '<button class="menu-item" id="pm-reorder"><span>Reorder exercises</span><span class="k2">↕</span></button>' +
      '<button class="menu-item" id="pm-add"><span>Add an exercise</span><span class="k2">+</span></button>' +
      '<button class="menu-item danger" id="pm-end">End workout without saving</button>'
    );
    document.getElementById("pm-reorder").onclick = function () { openReorder(); };
    document.getElementById("pm-add").onclick = function () { openExercisePicker(); };
    document.getElementById("pm-end").onclick = function () { closeSheet(); endWorkoutPrompt(); };
  }

  // an exercise can be reordered until you've logged a set for it
  function firstMovableXi() {
    var curXi = run.queue[run.i].xi;
    return run.results[curXi].sets.length === 0 ? curXi : curXi + 1;
  }

  function openReorder() {
    var first = firstMovableXi();
    var curXi = run.queue[run.i].xi;
    var mov = [];
    for (var i = first; i < run.res.exercises.length; i++) mov.push(i);

    if (mov.length < 2) {
      openSheet('<h2>Reorder exercises</h2><p class="sh-lead">' +
        (mov.length ? "Only one exercise left to reorder." : "The exercises left are already underway — nothing to reorder.") +
        '</p><div class="btn-row"><button class="btn btn-primary" id="ro-done">OK</button></div>');
      document.getElementById("ro-done").onclick = closeSheet;
      return;
    }

    var locked = "";
    for (var j = 0; j < first; j++) {
      locked += '<div class="ro-row done"><span>' + esc(run.res.exercises[j].name) + '</span><span class="k2">' +
        (run.results[j].sets.length ? "logged" : "skipped") + '</span></div>';
    }

    openSheet('<h2>Reorder exercises</h2>' +
      '<p class="sh-lead">Arrange what’s left. Anything you’ve logged a set for stays put, and it’s saved as your order for this workout.</p>' +
      '<div class="ro-list" id="ro-list">' + locked + '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="ro-cancel">Cancel</button><button class="btn btn-primary" id="ro-save">Save order</button></div>');

    var list = document.getElementById("ro-list");
    var nodes = {};
    mov.forEach(function (xi) {
      var row = document.createElement("div");
      row.className = "ro-row";
      row.dataset.xi = xi;
      row.innerHTML = '<span>' + esc(run.res.exercises[xi].name) +
        (xi === curXi ? ' <span class="k2" style="color:var(--accent-ink)">on now</span>' : '') + '</span>' +
        '<span class="ro-btns"><button data-dir="-1" aria-label="Move up">▲</button><button data-dir="1" aria-label="Move down">▼</button></span>';
      nodes[xi] = row;
      list.appendChild(row);
    });

    function reflectDisabled() {
      mov.forEach(function (xi, i) {
        var b = nodes[xi].querySelectorAll("button");
        b[0].disabled = (i === 0);
        b[1].disabled = (i === mov.length - 1);
      });
    }
    reflectDisabled();

    function move(xi, dir) {
      var i = mov.indexOf(xi), to = i + dir;
      if (to < 0 || to >= mov.length) return;
      var before = {};
      mov.forEach(function (x) { before[x] = nodes[x].getBoundingClientRect().top; });

      mov.splice(i, 1); mov.splice(to, 0, xi);
      mov.forEach(function (x) { list.appendChild(nodes[x]); });
      reflectDisabled();

      // FLIP: invert then play, reflow-based (no rAF — reliable on iOS standalone)
      mov.forEach(function (x) {
        var d = before[x] - nodes[x].getBoundingClientRect().top;
        nodes[x].style.transition = "none";
        nodes[x].style.transform = d ? "translateY(" + d + "px)" : "";
      });
      void list.offsetWidth;
      mov.forEach(function (x) {
        nodes[x].style.transition = "transform .2s cubic-bezier(.3,.7,0,1)";
        nodes[x].style.transform = "";
      });
    }

    list.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-dir]");
      if (!b || b.disabled) return;
      move(+b.closest(".ro-row").dataset.xi, +b.dataset.dir);
    });

    document.getElementById("ro-cancel").onclick = closeSheet;
    document.getElementById("ro-save").onclick = function () { closeSheet(); applyReorderToRun(mov); };
  }

  // movOrder = the new order of the movable-exercise xi values (a contiguous tail)
  function applyReorderToRun(movOrder) {
    var first = firstMovableXi();
    var curXi = run.queue[run.i].xi;
    var curMovable = curXi >= first;

    var newExOrder = [];
    for (var i = 0; i < first; i++) newExOrder.push(i);
    movOrder.forEach(function (xi) { newExOrder.push(xi); });
    run.res.exercises = newExOrder.map(function (o) { return run.res.exercises[o]; });
    run.results = newExOrder.map(function (o) { return run.results[o]; });

    // frozen queue steps: everything belonging to exercises before `first` (old xi < first).
    // remember how many were already passed so we can restore run.i.
    var frozen = [], passed = 0;
    run.queue.forEach(function (q, qi) {
      if (q.xi >= first) return;                 // xi unchanged for 0..first-1
      frozen.push(q);
      if (qi < run.i) passed++;
    });

    // rebuild the movable tail fresh, in the new order
    var tail = [];
    for (var m = 0; m < movOrder.length; m++) {
      var nx = first + m;
      var x = run.res.exercises[nx];
      (x.warmups || []).forEach(function (w) {
        tail.push({ xi: nx, kind: "warm", weight: w.weight, reps: w.reps, exId: x.exId, name: x.name });
      });
      x.workSets.forEach(function (w, si) {
        tail.push({ xi: nx, kind: "work", weight: x.assist ? null : w.weight, reps: w.reps, amrap: !!w.amrap,
          exId: x.exId, name: x.name, assist: !!x.assist, topSet: !!x.topSet, adhoc: !!x.adhoc,
          setNo: si + 1, setCount: x.workSets.length, target: x.target });
      });
    }

    run.queue = frozen.concat(tail);
    run.i = curMovable ? frozen.length : passed;

    // persist the full new order (slot-based; ad-hoc exercises are session-only)
    if (db.active && !run.custom) {
      db.active.order = db.active.order || {};
      db.active.order[run.res.label] = run.res.exercises
        .map(function (x) { return x.slotIdx; })
        .filter(function (s) { return s != null; });
      save();
      toast("Order saved");
    }
    renderPlayer();
  }

  function openChangeWeight(step) {
    var wStep = eq().step;
    openSheet(
      '<h2>' + esc(step.name) + '</h2><p class="sh-lead">Set the working weight for this set and the rest of this exercise.</p>' +
      '<div class="adj-grid"><div class="ag"><div class="lab">Weight (' + U() + ')</div>' +
      '<div class="stepper"><button data-a="-">–</button><input class="mono" id="cw" inputmode="decimal" value="' + fmt(step.weight) + '"><button data-a="+">+</button></div></div></div>' +
      '<div id="cw-plate" class="chart-note" style="text-align:center;margin:-4px 0 8px"></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="cw-cancel">Cancel</button><button class="btn btn-primary" id="cw-save">Update</button></div>'
    );

    sheetRoot.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () {

  function openExercisePicker() {
    var groups = {};
    Object.keys(EX).forEach(function (id) {

      (groups[g] = groups[g] || []).push(id);
    });

      '<input class="num-in" id="ep-search" placeholder="Search…" autocomplete="off" style="margin-bottom:12px">' +
      '<div id="ep-list">';
    order.concat(Object.keys(groups).filter(function (g) { return order.indexOf(g) < 0; })).forEach(function (g) {

          '<span class="k2">' + (EX[id].bw ? "bodyweight" : EX[id].bar ? "barbell" : "weighted") + '</span></button>';
      });
    });
    html += '</div>';
    openSheet(html);
    var search = document.getElementById("ep-search");
    search.oninput = function () {
      var q = search.value.trim().toLowerCase();
      sheetRoot.querySelectorAll(".pick-item").forEach(function (b) {
        b.style.display = !q || EX[b.dataset.ex].name.toLowerCase().indexOf(q) >= 0 ? "" : "none";
      });
    };
    sheetRoot.querySelectorAll(".pick-item").forEach(function (b) {
      b.onclick = function () { openAddConfig(b.dataset.ex); };
    });
  }

  function openAddConfig(exId) {
    var ex = EX[exId];
    var isBw = !!ex.bw;
    var wStep = ex.bar ? eq().step : (U() === "lb" ? 5 : 2.5);
    openSheet(
      '<h2>' + esc(ex.name) + '</h2><p class="sh-lead">How much are you doing?</p>' +
      '<div class="field-inline">' +
        '<div class="fi"><span>Sets</span><div class="stepper"><button data-f="s-">–</button><input class="mono" id="ac-s" inputmode="numeric" value="3"><button data-f="s+">+</button></div></div>' +
        '<div class="fi"><span>Reps</span><div class="stepper"><button data-f="r-">–</button><input class="mono" id="ac-r" inputmode="numeric" value="' + (isBw ? 10 : 8) + '"><button data-f="r+">+</button></div></div>' +
        (isBw ? '' : '<div class="fi"><span>Weight (' + U() + ')</span><div class="stepper"><button data-f="w-">–</button><input class="mono" id="ac-w" inputmode="decimal" value="' + (ex.bar ? eq().bar : (U() === "lb" ? 20 : 10)) + '"><button data-f="w+">+</button></div></div>') +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="ac-cancel">Back</button><button class="btn btn-primary" id="ac-add">Add to workout</button></div>'
    );
    sheetRoot.querySelectorAll("[data-f]").forEach(function (b) {
      b.onclick = function () {
        var f = b.dataset.f;
        var si = document.getElementById("ac-s"), ri = document.getElementById("ac-r"), wi = document.getElementById("ac-w");
        if (f === "s-") si.value = Math.max(1, (parseInt(si.value, 10) || 1) - 1);
        if (f === "s+") si.value = Math.min(10, (parseInt(si.value, 10) || 1) + 1);
        if (f === "r-") ri.value = Math.max(1, (parseInt(ri.value, 10) || 1) - 1);
        if (f === "r+") ri.value = (parseInt(ri.value, 10) || 1) + 1;
        if (f === "w-" && wi) wi.value = fmt(Math.max(0, (parseFloat(wi.value) || 0) - wStep));
        if (f === "w+" && wi) wi.value = fmt((parseFloat(wi.value) || 0) + wStep);
      };
    });
    document.getElementById("ac-cancel").onclick = openExercisePicker;
    document.getElementById("ac-add").onclick = function () {
      var s = Math.max(1, parseInt(document.getElementById("ac-s").value, 10) || 3);
      var r = Math.max(1, parseInt(document.getElementById("ac-r").value, 10) || 8);
      var w = isBw ? 0 : (parseFloat(document.getElementById("ac-w").value) || 0);
      if (ex.bar) w = roundLoad(w, eq());
      closeSheet();
      addExerciseToRun(exId, s, r, w);
      toast(ex.name + " added");
    };
  }

  function plateStr(weight) {
    var e = eq();
    var per = (weight - e.bar) / 2;
    if (per <= 0) return U() === "kg" && weight === e.bar ? "Empty bar" : "";
    var sizes = U() === "lb" ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25, 0.5];
    var out = [], rem = per;
    sizes.forEach(function (p) { while (rem >= p - 1e-9) { out.push(p); rem -= p; } });
    if (rem > 0.01) return "";
    return "Per side: " + out.map(fmt).join(" · ");
  }

  function recordSet(step, weight, reps, made) {
    if (!run) return;
    var r = run.results[step.xi];
    if (step.kind === "work") {
      r.sets.push({ weight: weight, reps: reps, target: step.target, repHigh: step.repHigh || null, made: made, amrap: !!step.amrap,
        rir: (run.pendingRir == null ? null : run.pendingRir) });
    }
    run.pendingRir = null;
    run.i++;
    renderPlayer();
  }

  // step back to the previous set, discarding whatever was logged for it
  function stepBack() {
    if (!run || run.i <= 0) return;
    run.pendingRir = null;
    run.i--;
    var prev = run.queue[run.i];
    if (prev.kind === "work") {
      var sets = run.results[prev.xi].sets;
      if (sets.length) sets.pop();
    }
    renderPlayer();
  }

  function openAdjust(step) {
    var isAssist = step.assist;
    var w = step.weight, reps = step.reps;
    var wStep = eq().step;
    openSheet(
      '<h2>' + esc(step.name) + '</h2><p class="sh-lead">Log what you actually did for this set.</p>' +
      '<div class="adj-grid">' +
        (isAssist ? '' : '<div class="ag"><div class="lab">Weight (' + U() + ')</div><div class="stepper"><button data-a="w-">–</button><input class="mono" id="aj-w" inputmode="decimal" value="' + fmt(w) + '"><button data-a="w+">+</button></div></div>') +
        '<div class="ag"><div class="lab">Reps</div><div class="stepper"><button data-a="r-">–</button><input class="mono" id="aj-r" inputmode="numeric" value="' + reps + '"><button data-a="r+">+</button></div></div>' +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="aj-cancel">Cancel</button><button class="btn btn-primary" id="aj-save">Log set</button></div>'
    );
    var root = document.getElementById("sheet-root");
    root.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () {
        var wi = document.getElementById("aj-w"), ri = document.getElementById("aj-r");
        if (b.dataset.a === "w-") wi.value = fmt(Math.max(eq().bar, (parseFloat(wi.value) || 0) - wStep));
        if (b.dataset.a === "w+") wi.value = fmt((parseFloat(wi.value) || 0) + wStep);
        if (b.dataset.a === "r-") ri.value = Math.max(0, (parseInt(ri.value, 10) || 0) - 1);
        if (b.dataset.a === "r+") ri.value = (parseInt(ri.value, 10) || 0) + 1;
      };
    });
    document.getElementById("aj-cancel").onclick = closeSheet;
    document.getElementById("aj-save").onclick = function () {
      var nw = isAssist ? null : (parseFloat(document.getElementById("aj-w").value) || step.weight);
      var nr = parseInt(document.getElementById("aj-r").value, 10); if (isNaN(nr)) nr = 0;
      var made = nr >= step.target;
      closeSheet();
      recordSet(step, nw, nr, made);
    };
  }

  function finishPlayer() {
    var t = run.t;
    // progression: only program lifts (not bodyweight assistance, not ad-hoc additions)
    var progExercises = [];
    run.results.forEach(function (r) {
      if (r.assist || r.adhoc) return;
      var ws = r.sets;
      var topW = ws.reduce(function (m, s) { return Math.max(m, s.weight || 0); }, 0);
      progExercises.push({
        exId: r.exId,
        done: ws.length > 0,
        made: ws.length > 0 && ws.every(function (s) { return s.reps >= s.target; }),
        hitTop: ws.length > 0 && ws.every(function (s) { return s.reps >= (s.repHigh || s.target); }),
        topWeight: topW
      });
    });
    var notes = applyResult(t, db.active, { dayType: run.res.dayType, cycleIndex: run.chosenIdx, exercises: progExercises }, eq());

    // snapshot of working weights after this session — for the weekly progress chart
    var snapshot = {};
    (t.anchors || []).forEach(function (id) { if (db.active.lifts[id]) snapshot[id] = db.active.lifts[id].weight; });

    var sess = {
      id: uid(), date: run.startedAt, templateId: t.id, dayLabel: run.res.label,
      weekIndex: db.active.weekIndex, dayType: run.res.dayType,
      durationSec: Math.round((Date.now() - run.startedAt) / 1000),
      snapshot: snapshot,
      actual: run.results.map(function (r) {
        var top = r.sets.reduce(function (m, s) { return (s.weight || 0) >= (m.weight || 0) ? s : m; }, r.sets[0] || {});
        return {
          exId: r.exId, name: r.name, assist: r.assist, adhoc: r.adhoc,
          made: (r.assist || r.adhoc) ? null : (r.sets.length > 0 && r.sets.every(function (s) { return s.reps >= s.target; })),
          sets: r.sets, topWeight: (top && top.weight) || 0, topReps: (top && top.reps) || 0
        };
      }),
      notes: notes
    };
    db.sessions.push(sess);
    save();

    lastSummary = sess;
    run = null;
    finishAndCelebrate(sess, function () { go("summary"); });
  }

  /* ===================================================== METCON PLAYER */
  function metconElapsed() {
    if (!run || !run.startWall) return 0;
    var nowRef = run.running ? Date.now() : (run.pausedAt || run.startWall);
    return Math.max(0, nowRef - run.startWall - run.pausedMs);
  }
  function fmtClock(ms) {
    var s = Math.round(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function metconMinuteText() {
    var w = run.wod;
    if (w.format !== "emom" || !w.minutes || !w.minutes.length) return "";
    var min = Math.floor(metconElapsed() / 60000);
    return "Minute " + (min + 1) + " — " + w.minutes[min % w.minutes.length].text;
  }

  function startMetconPlayer(chosenIdx, explicitWod) {
    var t = db.active ? tplById(db.active.templateId) : null;
    var wod, label, idx = null;
    if (explicitWod) { wod = explicitWod; label = explicitWod.name; }
    else {
      var len = t.microcycle.length;
      idx = (chosenIdx == null) ? (db.active.cycleIndex % len) : (chosenIdx % len);
      var r = resolveMetcon(t, { cycleIndex: idx });
      wod = r.wod; label = r.label;
    }
    run = {
      kind: "metcon", t: t, adhoc: !!explicitWod, chosenIdx: idx,
      wod: wod, res: { label: label, dayType: null },
      startedAt: Date.now(), startWall: null, pausedMs: 0, pausedAt: null,
      running: false, roundsDone: 0, checks: {}, emomLastMin: -1
    };
    renderMetconPlayer();
  }

  function metconTick() {
    if (!run || run.kind !== "metcon") return;
    var clk = document.getElementById("mc-clock");
    if (!clk) return;
    var el = metconElapsed(), w = run.wod;
    if (metconCountsDown(w)) {
      var cap = (w.capMin || 0) * 60000;
      var rem = cap - el;
      clk.textContent = fmtClock(Math.max(0, rem));
      if (rem <= 0 && run.running) { run.running = false; navigator.vibrate && navigator.vibrate([200, 100, 200]); openMetconScore(); return; }
    } else {
      clk.textContent = fmtClock(el);
    }
    if (w.format === "emom") {
      var min = Math.floor(el / 60000);
      if (min !== run.emomLastMin) { run.emomLastMin = min; navigator.vibrate && navigator.vibrate(180); }
      var mt = document.getElementById("mc-minute");
      if (mt) mt.textContent = metconMinuteText();
    }
  }

  function metconStartPause() {
    if (!run.startWall) { run.startWall = Date.now(); run.running = true; }
    else if (run.running) { run.running = false; run.pausedAt = Date.now(); }
    else { run.pausedMs += Date.now() - run.pausedAt; run.pausedAt = null; run.running = true; }
    renderMetconPlayer();
  }

  function renderMetconPlayer() {
    var root = document.getElementById("player-root");
    if (!run || run.kind !== "metcon") { root.innerHTML = ""; return; }
    var w = run.wod, moves = metconMoves(w);
    var down = metconCountsDown(w);

    if (!root.querySelector(".player")) {
      root.innerHTML =
        '<div class="player">' +
          '<div class="pl-top">' +
            '<button class="icon-btn pl-x" id="mc-close" aria-label="Close">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
            '<div class="pl-rail" id="mc-rail"></div>' +
            '<span class="pl-count" id="mc-count"></span>' +
            '<span style="width:34px"></span>' +
          '</div>' +
          '<div class="pl-body" id="mc-bodywrap"></div>' +
          '<div class="pl-actions" id="mc-actions"></div>' +
        '</div>';
      document.getElementById("mc-close").onclick = endWorkoutPrompt;
      var plNew = root.querySelector(".player");
      void plNew.offsetWidth;
      plNew.classList.add("show");
      if (!run.tick) run.tick = setInterval(metconTick, 250);
    }

    var hyrox = w.format === "hyrox";
    var checkedCount = moves.filter(function (_, j) { return run.checks[j]; }).length;
    var progress = hyrox ? checkedCount : run.roundsDone;
    var target = w.targetRounds || (hyrox ? moves.length : null);
    document.getElementById("mc-rail").innerHTML = target
      ? Array.from({ length: target }, function (_, i) { return '<i class="' + (i < progress ? "done" : "") + '"></i>'; }).join("")
      : "";
    document.getElementById("mc-count").textContent = w.format === "amrap" || w.format === "rft" || hyrox || w.format === "chipper"
      ? (target ? progress + " / " + target : "Round " + (run.roundsDone + 1)) : "";

    var el = metconElapsed();
    var clockTxt = down ? fmtClock(Math.max(0, (w.capMin || 0) * 60000 - el)) : fmtClock(el);
    var body = '<div class="mc-format">' + esc(metconSubtitle(w)) + '</div>' +
      '<div class="mc-clock mono" id="mc-clock">' + clockTxt + '</div>' +
      (w.format === "emom" ? '<div class="mc-minute" id="mc-minute">' + esc(metconMinuteText()) + '</div>' : '') +
      '<div class="mc-moves">' +
      moves.map(function (m, i) {
        return '<button class="mc-move' + (run.checks[i] ? ' done' : '') + '" data-mi="' + i + '">' +
          '<span class="mc-chk"></span><span>' + esc(moveLine(m)) + '</span></button>';
      }).join("") +
      '</div>' +
      (w.format === "rft" || w.format === "amrap" || w.format === "chipper"
        ? '<div class="mc-round-ctl"><button id="mc-rminus">–</button><span>Rounds done: <b>' + run.roundsDone + '</b></span><button id="mc-rplus">+</button></div>' : '');
    document.getElementById("mc-bodywrap").innerHTML = body;

    var startLbl = !run.startWall ? "Start" : (run.running ? "Pause" : "Resume");
    document.getElementById("mc-actions").innerHTML =
      '<button class="btn btn-primary mc-startbtn" id="mc-start">' + startLbl + '</button>' +
      '<button class="btn btn-ghost" id="mc-finish">Finish &amp; log score</button>';

    document.getElementById("mc-start").onclick = metconStartPause;
    document.getElementById("mc-finish").onclick = function () { openMetconScore(); };
    document.getElementById("mc-bodywrap").querySelectorAll("[data-mi]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.mi;
        run.checks[i] = !run.checks[i];
        var allDone = moves.every(function (_, j) { return run.checks[j]; });
        if (allDone && !hyrox && (w.format === "rft" || w.format === "amrap")) {
          run.roundsDone++;
          run.checks = {};
        }
        renderMetconPlayer();
      };
    });
    var rm = document.getElementById("mc-rminus"), rp = document.getElementById("mc-rplus");
    if (rm) rm.onclick = function () { run.roundsDone = Math.max(0, run.roundsDone - 1); renderMetconPlayer(); };
    if (rp) rp.onclick = function () { run.roundsDone++; renderMetconPlayer(); };
  }

  function openMetconScore() {
    var w = run.wod, st = w.scoreType || "time";
    var el = metconElapsed();
    var prefillSec = Math.round(el / 1000);
    var pm = Math.floor(prefillSec / 60), ps = prefillSec % 60;
    var fields = "";
    if (st === "rounds") {
      fields = '<div class="ag"><div class="lab">Rounds completed</div><div class="stepper"><button data-a="ro-">–</button><input class="mono" id="ms-ro" inputmode="numeric" value="' + run.roundsDone + '"><button data-a="ro+">+</button></div></div>' +
        '<div class="ag"><div class="lab">+ reps into next round</div><div class="stepper"><button data-a="rp-">–</button><input class="mono" id="ms-rp" inputmode="numeric" value="0"><button data-a="rp+">+</button></div></div>';
    } else if (st === "reps") {
      fields = '<div class="ag"><div class="lab">Total reps</div><div class="stepper"><button data-a="tr-">–</button><input class="mono" id="ms-tr" inputmode="numeric" value="0"><button data-a="tr+">+</button></div></div>';
    } else if (st === "load") {
      fields = '<div class="ag"><div class="lab">Top load (' + U() + ')</div><div class="stepper"><button data-a="ld-">–</button><input class="mono" id="ms-ld" inputmode="decimal" value="0"><button data-a="ld+">+</button></div></div>';
    } else {
      fields = '<div class="ag"><div class="lab">Time — min</div><div class="stepper"><button data-a="mm-">–</button><input class="mono" id="ms-mm" inputmode="numeric" value="' + pm + '"><button data-a="mm+">+</button></div></div>' +
        '<div class="ag"><div class="lab">sec</div><div class="stepper"><button data-a="ss-">–</button><input class="mono" id="ms-ss" inputmode="numeric" value="' + ps + '"><button data-a="ss+">+</button></div></div>' +
        '<label class="mc-cap"><input type="checkbox" id="ms-cap"> Hit the time cap (did not finish)</label>';
    }
    openSheet(
      '<h2>' + esc(w.name) + '</h2><p class="sh-lead">Log your score — it goes in your history.</p>' +
      '<div class="adj-grid">' + fields + '</div>' +
      '<div class="field" style="margin-top:10px"><div class="mini-seg" data-set="rx"><button data-v="rx" aria-selected="true">RX</button><button data-v="scaled" aria-selected="false">Scaled</button></div></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="ms-cancel">Back</button><button class="btn btn-primary" id="ms-save">Log it</button></div>'
    );
    var rx = true;
    var sr = document.getElementById("sheet-root");
    sr.querySelectorAll('[data-set="rx"] button').forEach(function (b) {
      b.onclick = function () { rx = b.dataset.v === "rx"; sr.querySelectorAll('[data-set="rx"] button').forEach(function (x) { x.setAttribute("aria-selected", x === b); }); };
    });
    sr.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () {
        var map = { "ro": "ms-ro", "rp": "ms-rp", "tr": "ms-tr", "ld": "ms-ld", "mm": "ms-mm", "ss": "ms-ss" };
        var k = b.dataset.a.slice(0, 2), dir = b.dataset.a.slice(2) === "+" ? 1 : -1;
        var inp = document.getElementById(map[k]);
        var step = k === "ld" ? eq().step : 1;
        inp.value = Math.max(0, (parseFloat(inp.value) || 0) + dir * step);
      };
    });
    document.getElementById("ms-cancel").onclick = function () { closeSheet(); renderMetconPlayer(); };
    document.getElementById("ms-save").onclick = function () {
      var score = { rx: rx };
      if (st === "rounds") { score.rounds = parseInt(document.getElementById("ms-ro").value, 10) || 0; score.reps = parseInt(document.getElementById("ms-rp").value, 10) || 0; }
      else if (st === "reps") { score.reps = parseInt(document.getElementById("ms-tr").value, 10) || 0; }
      else if (st === "load") { score.load = parseFloat(document.getElementById("ms-ld").value) || 0; }
      else {
        score.timeSec = (parseInt(document.getElementById("ms-mm").value, 10) || 0) * 60 + (parseInt(document.getElementById("ms-ss").value, 10) || 0);
        score.cappedOut = document.getElementById("ms-cap").checked;
      }
      closeSheet();
      finishMetconPlayer(score);
    };
  }

  function finishMetconPlayer(score) {
    if (!run) return;
    if (run.tick) { clearInterval(run.tick); run.tick = null; }
    var w = run.wod, t = run.t;
    var sess = {
      id: uid(), date: run.startedAt, kind: "metcon",
      templateId: run.adhoc ? null : (t && t.id), programName: t ? t.name : (run.adhoc ? "Rolled workout" : null),
      adhoc: run.adhoc, source: run.adhoc ? "roller" : "program",
      dayLabel: run.res.label, wodId: w.id, wodName: w.name, style: w.style, format: w.format,
      weekIndex: db.active ? db.active.weekIndex : null,
      durationSec: Math.round((Date.now() - run.startedAt) / 1000),
      score: {
        type: w.scoreType || "time",
        rounds: score.rounds != null ? score.rounds : null,
        reps: score.reps != null ? score.reps : null,
        timeSec: score.timeSec != null ? score.timeSec : null,
        load: score.load != null ? score.load : null,
        cappedOut: !!score.cappedOut,
        rx: score.rx !== false
      },
      movements: metconMoves(w).map(function (m) { return { move: m.move, amount: m.amount }; }),
      note: ""
    };
    db.sessions.push(sess);
    if (db.active && !run.adhoc && t) advanceRotation(db.active, t, run.chosenIdx);
    save();
    lastSummary = sess;
    run = null;
    finishAndCelebrate(sess, function () { go("summary"); });
  }

  function dismissPlayer(cb) {
    if (run && run.tick) { clearInterval(run.tick); run.tick = null; }
    var pl = document.querySelector("#player-root .player");
    if (!pl) { document.getElementById("player-root").innerHTML = ""; if (cb) cb(); return; }
    pl.classList.remove("show");
    var done = function () {
      pl.removeEventListener("transitionend", done);
      clearTimeout(tm);
      document.getElementById("player-root").innerHTML = "";
      if (cb) cb();
    };
    var tm = setTimeout(done, 400);
    pl.addEventListener("transitionend", done);
  }

  /* ============================================================ SUMMARY */
  var lastSummary = null;
  renderers.summary = function () {
    var c = screens.summary;
    var s = lastSummary;
    if (!s) { go("home"); return; }

    if (s.kind === "metcon") { renderMetconSummary(c, s); return; }

    var freestyle = s.kind === "freestyle";
    var t = tplById(s.templateId) || { name: s.programName || "Workout" };
    var vol = 0, sets = 0;
    s.actual.forEach(function (a) { a.sets.forEach(function (x) { vol += (x.weight || 0) * (x.reps || 0); sets++; }); });
    var mins = Math.max(1, Math.round(s.durationSec / 60));

    var html = '<h2 class="title">' + esc(s.dayLabel) + ' done</h2>' +
      '<p class="lead">' + (freestyle ? 'One-off workout' : esc(t.name) + ' · Week ' + (s.weekIndex + 1)) + '</p>' +
      '<div class="statbar">' +
        '<div class="stat"><div class="k">Volume</div><div class="v">' + fmt(Math.round(vol)) + '<small> ' + U() + '</small></div></div>' +
        '<div class="stat"><div class="k">Sets</div><div class="v">' + sets + '</div></div>' +
        '<div class="stat"><div class="k">Time</div><div class="v">' + mins + '<small> min</small></div></div>' +
      '</div>';

    // what you logged
    html += '<div class="eyebrow">Logged</div><div class="day-block">';
    s.actual.forEach(function (a) {
      if (!a.sets.length) return;
      var top = a.topWeight ? fmt(a.topWeight) + U() + " × " + a.topReps : a.topReps + " reps";
      var rirs = a.sets.map(function (x) { return x.rir; }).filter(function (v) { return v != null; });
      var effTag = rirs.length ? ' · ' + effortText(Math.min.apply(null, rirs)) : '';
      html += '<div class="ex-line"><span>' + esc(a.name) + (a.adhoc && !freestyle ? ' <span class="k2" style="font-size:9.5px;color:var(--text-faint)">ADDED</span>' : '') +
        '</span><span class="scheme">' + a.sets.length + " sets · " + esc(top) + esc(effTag) + '</span></div>';
    });
    html += '</div>';

    if (freestyle) {
      html += '<div class="btn-row"><button class="btn btn-primary" id="sm-done">Done</button></div>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="sm-progress">See history</button></div>';
      c.innerHTML = html;
      document.getElementById("sm-done").onclick = function () { go("home", true); };
      document.getElementById("sm-progress").onclick = function () { go("progress", false); };
      return;
    }

    html += '<div class="eyebrow">Next session\'s weights</div><div class="day-block">';
    if (!s.notes.length) html += '<p style="font-size:13px;color:var(--text-muted)">No program changes this session.</p>';
    s.notes.forEach(function (n) {
      var ic, txt;
      if (n.kind === "up") { ic = "up"; txt = "up to " + fmt(n.to) + " " + U(); }
      else if (n.kind === "deload") { ic = "deload"; txt = "stalled — cut to " + fmt(n.to) + " " + U() + " to rebuild"; }
      else if (n.double) { ic = "hold"; txt = "hold " + fmt(n.to) + " " + U() + " — add reps until you own the top of the range"; }
      else { ic = "hold"; txt = "stay at " + fmt(n.to) + " " + U() + " (" + n.miss + " miss" + (n.miss > 1 ? "es" : "") + ", " + (n.before - n.miss) + " more before a cut)"; }
      html += '<div class="change-row"><span class="cr-ic ' + ic + '">' + (n.kind === "up" ? "▲" : n.kind === "deload" ? "▼" : "–") + '</span>' +
        '<span>' + esc(EX[n.exId] ? EX[n.exId].name : n.exId) + '</span><span class="cr-w">' + esc(txt) + '</span></div>';
    });
    html += '</div>';

    html += '<div class="btn-row"><button class="btn btn-primary" id="sm-done">Back to program</button></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="sm-progress">See progress</button></div>';
    c.innerHTML = html;
    document.getElementById("sm-done").onclick = function () { go("home", true); };
    document.getElementById("sm-progress").onclick = function () { go("progress", false); };
  };

  function metconScoreText(s) {
    var sc = s.score || {};
    if (sc.type === "rounds") return sc.rounds + " rounds" + (sc.reps ? " + " + sc.reps : "");
    if (sc.type === "reps") return sc.reps + " reps";
    if (sc.type === "load") return fmt(sc.load) + " " + U();
    if (sc.timeSec != null) return fmtClock(sc.timeSec * 1000) + (sc.cappedOut ? " (capped)" : "");
    return "—";
  }
  function renderMetconSummary(c, s) {
    var mins = Math.max(1, Math.round(s.durationSec / 60));
    var html = '<h2 class="title">' + esc(s.wodName || s.dayLabel) + '</h2>' +
      '<p class="lead">' + esc(s.programName || (s.adhoc ? "Rolled workout" : "Workout")) + ' · ' + esc(FORMAT_LABEL[s.format] || s.format) + '</p>' +
      '<div class="statbar">' +
        '<div class="stat"><div class="k">Score</div><div class="v">' + esc(metconScoreText(s)) + '</div></div>' +
        '<div class="stat"><div class="k">Time</div><div class="v">' + mins + '<small> min</small></div></div>' +
        '<div class="stat"><div class="k">Effort</div><div class="v">' + (s.score && s.score.rx ? "RX" : "Scaled") + '</div></div>' +
      '</div>';
    if (s.movements && s.movements.length) {
      html += '<div class="eyebrow">The workout</div><div class="day-block">' +
        s.movements.map(function (m) {
          return '<div class="ex-line"><span>' + esc(moveName(m.move)) + '</span><span class="scheme">' + (m.amount != null ? m.amount + " " + moveUnit(m.move) : "") + '</span></div>';
        }).join("") + '</div>';
    }
    if (s.note) html += '<p style="font-size:13px;color:var(--text-muted)">' + esc(s.note) + '</p>';
    html += '<div class="btn-row"><button class="btn btn-primary" id="sm-done">Done</button></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="sm-progress">See history</button></div>';
    c.innerHTML = html;
    document.getElementById("sm-done").onclick = function () { go("home", true); };
    document.getElementById("sm-progress").onclick = function () { go("progress", false); };
  }

  /* ============================================================ PROGRESS */
  // Monday-anchored week key for a timestamp
  function weekKey(ts) {
    var d = new Date(ts); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.getTime();
  }
  // heaviest work set actually performed for this lift, most recent session first
  // (only sessions where at least one set had reps > 0 — a skipped lift doesn't count)
  function lastLiftedTop(exId) {
    for (var i = db.sessions.length - 1; i >= 0; i--) {
      var a = ((db.sessions[i] || {}).actual || []).filter(function (x) {
        return x.exId === exId && x.sets && x.sets.some(function (s) { return s.reps > 0; });
      })[0];
      if (a) return a.topWeight;
    }
    return null;
  }

  // one point per week: heaviest weight actually lifted for that lift that week
  function weeklySeries(exId, startWeight, startedAt) {
    var byWeek = {};
    byWeek[weekKey(startedAt)] = startWeight;
    db.sessions.forEach(function (s) {
      var a = (s.actual || []).filter(function (x) {
        return x.exId === exId && x.sets && x.sets.some(function (st) { return st.reps > 0; });
      })[0];
      var w = a ? a.topWeight
        : (s.snapshot && s.snapshot[exId] != null ? s.snapshot[exId] : null); // not trained / legacy
      if (w == null) return;
      var k = weekKey(s.date);
      byWeek[k] = byWeek[k] == null ? w : Math.max(byWeek[k], w);
    });
    return Object.keys(byWeek).map(Number).sort(function (a, b) { return a - b; })
      .map(function (k) { return { t: k, v: byWeek[k] }; });
  }

  // a chart card: title, sub-line, delta, weekly series. When nowVal is given the
  // right-hand cell shows that weight big with a small "N since start" line beneath.
  function progCard(title, sub, delta, unit, series, nowVal) {
    var now = nowVal != null
      ? '<span class="lp-w">' + fmt(nowVal) + ' <small>' + unit + '</small></span>' +
        (delta !== 0 ? '<span class="lp-since">' + (delta > 0 ? '+' : '') + fmt(delta) + ' since start</span>' : '')
      : (delta >= 0 ? '+' : '') + fmt(delta) + ' <small>' + unit + '</small>';
    return '<div class="lift-prog"><div><h4>' + esc(title) + '</h4>' +
      '<div class="lp-sub">' + esc(sub) + '</div></div>' +
      '<div class="lp-now' + (nowVal != null ? ' has-now' : '') + '">' + now + '</div>' +
      (series.length >= 2
        ? lineChart(series) + '<div class="chart-note">' + series.length + ' weeks · one point each</div>'
        : '<div class="chart-note">Chart starts after your first full week</div>') +
    '</div>';
  }

  function bodyChartsHtml() {
    if (!db.body.length) {
      return '<p class="chart-note" style="margin-top:2px">Log your bodyweight or measurements on the Body tab — they chart here too.</p>';
    }
    var entries = db.body.slice().sort(function (a, b) { return a.date - b.date; });
    var html = "";
    var withBw = entries.filter(function (e) { return e.bw != null; });
    if (withBw.length) {
      var d = withBw[withBw.length - 1].bw - withBw[0].bw;
      html += progCard("Bodyweight",
        fmt(withBw[0].bw) + " → " + fmt(withBw[withBw.length - 1].bw) + " " + U(),
        d, U(), bodyWeeklySeries(function (e) { return e.bw; }));
    }
    MEAS.forEach(function (m) {
      var withV = entries.filter(function (e) { return e.m && e.m[m.id] != null; });
      if (!withV.length) return;
      var dd = withV[withV.length - 1].m[m.id] - withV[0].m[m.id];
      html += progCard(m.name,
        fmt(withV[0].m[m.id]) + " → " + fmt(withV[withV.length - 1].m[m.id]) + " " + L(),
        dd, L(), bodyWeeklySeries(function (e) { return (e.m && e.m[m.id] != null) ? e.m[m.id] : null; }));
    });
    return html;
  }

  function metconHistoryHtml() {
    var ms = db.sessions.filter(function (s) { return s.kind === "metcon" || s.kind === "freestyle"; });
    if (!ms.length) return "";
    var html = '<div class="eyebrow" style="margin-top:22px">Workouts</div>';
    ms.slice(-12).reverse().forEach(function (s) {
      var sum = s.kind === "freestyle"

      html += '<div class="rec-row"><span class="rr-day">' + esc(s.wodName || s.dayLabel) + '</span>' +
        '<span class="rr-sum">' + sum + '</span>' +
        '<span class="rr-date">' + relDate(s.date) + '</span></div>';
    });
    return html;
  }

  renderers.progress = function () {
    var c = screens.progress;
    if (!db.active) {
      if (!db.sessions.length) { go("home"); return; }
      var html0 = '<h2 class="title">History</h2>' +
        '<p class="lead">' + db.sessions.length + ' workout' + (db.sessions.length === 1 ? '' : 's') + ' logged · no active program</p>' +
        metconHistoryHtml() +
        '<div class="eyebrow" style="margin-top:22px">Body</div>' + bodyChartsHtml();
      c.innerHTML = html0;
      return;
    }
    var t = tplById(db.active.templateId);
    if (!t) { db.active = null; save(); go("choose"); return; }
    var metcon = isMetcon(t);
    var liftSessions = db.sessions.filter(function (s) { return !s.kind || s.kind === "barbell" || s.kind === "bodybuilding"; });

    var html = '<h2 class="title">Progress</h2>' +
      '<p class="lead">' + esc(t.name) + ' · started ' + relDate(db.active.startedAt) + ' · ' + db.sessions.length + ' session' + (db.sessions.length === 1 ? '' : 's') + '</p>';

    if (!metcon) {
      html += '<div class="eyebrow" style="margin-top:4px">Lifts</div>';
      if (!liftSessions.length) {
        html += '<p class="chart-note" style="margin-bottom:6px">Finish your first workout and your lifts start charting here.</p>';
      } else {
        (t.anchors || []).forEach(function (id) {
          var lift = db.active.lifts[id];
          if (!lift) return;

    html += metconHistoryHtml();

    html += '<div class="eyebrow" style="margin-top:22px">Body</div>' + bodyChartsHtml();

    if (db.sessions.length) {
      html += '<div class="statbar" style="margin-top:22px">' +
        '<div class="stat hot"><div class="k">Week</div><div class="v">' + (db.active.weekIndex + 1) + '</div></div>' +
        '<div class="stat"><div class="k">Sessions</div><div class="v">' + db.sessions.length + '</div></div>' +
        '<div class="stat"><div class="k">Per week</div><div class="v">' + t.daysPerWeek + '</div></div>' +
      '</div>';

      if (!metcon && liftSessions.length) {
        html += '<div class="eyebrow" style="margin-top:22px">Recent sessions</div>';
        liftSessions.slice(-6).reverse().forEach(function (s) {
          html += '<div class="rec-row"><span class="rr-day">' + esc(s.dayLabel) + '</span>' +
            '<span class="rr-sum">' + (s.actual || []).filter(function (a) { return !a.assist; }).map(function (a) {
              return fmt(a.topWeight) + "×" + a.topReps;
            }).join("  ") + '</span>' +
            '<span class="rr-date">' + relDate(s.date) + '</span></div>';
        });
      }
    }
    c.innerHTML = html;
  };

  // weekly line chart with a visible dot at every week
  function lineChart(series) {
    var w = 300, h = 104, padX = 6, padY = 12;
    if (series.length < 2) {
      var only = series.length ? fmt(series[0].v) : "";
      return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
        (series.length ? '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="4" fill="var(--accent)"/>' +
          '<text x="' + (w / 2) + '" y="' + (h / 2 - 12) + '" text-anchor="middle" fill="var(--text-faint)" font-size="12" font-family="IBM Plex Mono, monospace">' + only + '</text>' : '') +
        '</svg>';
    }
    var vs = series.map(function (p) { return p.v; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), rng = (mx - mn) || 1;
    var innerW = w - padX * 2, innerH = h - padY * 2;
    var pts = series.map(function (p, i) {
      return [padX + (i / (series.length - 1)) * innerW, padY + innerH - ((p.v - mn) / rng) * innerH];
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = d + " L " + pts[pts.length - 1][0].toFixed(1) + " " + h + " L " + pts[0][0].toFixed(1) + " " + h + " Z";
    var dots = pts.map(function (p, i) {
      var last = i === pts.length - 1;
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (last ? 4 : 3) + '" fill="var(--accent)"' +
        (last ? '' : ' fill-opacity="0.9"') + ' stroke="var(--surface)" stroke-width="1.5"/>';
    }).join("");
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<path d="' + area + '" fill="var(--accent)" fill-opacity="0.10"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots +
      '<text x="' + padX + '" y="10" fill="var(--text-faint)" font-size="10" font-family="IBM Plex Mono, monospace">' + fmt(mx) + '</text>' +
      '<text x="' + padX + '" y="' + h + '" fill="var(--text-faint)" font-size="10" font-family="IBM Plex Mono, monospace">' + fmt(mn) + '</text>' +
      '</svg>';
  }

  /* ============================================================ BODY */
  var MEAS = [
    { id: "chest", name: "Chest" }, { id: "arms", name: "Arms" },
    { id: "waist", name: "Waist" }, { id: "hips", name: "Hips" },
    { id: "thighs", name: "Thighs" }, { id: "calves", name: "Calves" }
  ];
  function L() { return db.settings.lengthUnit; }

  // pick(entry) -> number | null ; last entry in a week wins (db.body is date-sorted)
  function bodyWeeklySeries(pick) {
    var byWeek = {};
    db.body.slice().sort(function (a, b) { return a.date - b.date; }).forEach(function (e) {
      var v = pick(e);
      if (v == null) return;
      byWeek[weekKey(e.date)] = v;
    });
    return Object.keys(byWeek).map(Number).sort(function (a, b) { return a - b; })
      .map(function (k) { return { t: k, v: byWeek[k] }; });
  }

  renderers.body = function () {
    var c = screens.body;
    var entries = db.body.slice().sort(function (a, b) { return a.date - b.date; });
    var last = entries[entries.length - 1] || null;
    var first = entries[0] || null;

    var html = '<div class="home-head"><h2>Body</h2>' +
      '<span class="pos">' + entries.length + ' log' + (entries.length === 1 ? '' : 's') + '</span></div>';

    if (!entries.length) {
      html += '<div class="empty"><div class="em-ic">⚖️</div><h3>No entries yet</h3>' +
        '<p>Log your bodyweight and any measurements you want to track. Weekly points, same as your lifts.</p>' +
        '<button class="btn btn-primary" id="bd-log">Log an entry</button></div>';
      c.innerHTML = html;
      document.getElementById("bd-log").onclick = function () { openBodyEntry(null); };
      return;
    }

    var series = bodyWeeklySeries(function (e) { return e.bw; });
    var trend = "";
    if (last && first && last.bw != null && first.bw != null && entries.length > 1) {
      var d = last.bw - first.bw;
      trend = (d >= 0 ? "+" : "") + fmt(d) + " " + U() + " since " + shortDate(first.date);
    } else if (last) {
      trend = "logged " + relDate(last.date);
    }
    html += '<div class="bw-hero"><div class="k">Bodyweight</div>' +
      '<div class="big">' + (last.bw != null ? fmt(last.bw) + '<small> ' + U() + '</small>' : '—') + '</div>' +
      '<div class="trend">' + esc(trend) + '</div>' +
      (series.length >= 2 ? lineChart(series) : '') + '</div>';

    // measurements grid
    var shown = MEAS.filter(function (m) { return entries.some(function (e) { return e.m && e.m[m.id] != null; }); });
    if (shown.length) {
      html += '<div class="eyebrow">Measurements (' + L() + ')</div><div class="meas-grid">';
      shown.forEach(function (m) {
        var withVal = entries.filter(function (e) { return e.m && e.m[m.id] != null; });
        var lv = withVal[withVal.length - 1].m[m.id];
        var fv = withVal[0].m[m.id];
        var dd = withVal.length > 1 ? (lv - fv >= 0 ? "+" : "") + fmt(lv - fv) : "";
        html += '<div class="meas"><div class="k">' + esc(m.name) + '</div>' +
          '<div class="v">' + fmt(lv) + ' <small>' + L() + '</small></div>' +
          (dd ? '<div class="d">' + dd + ' since ' + shortDate(withVal[0].date) + '</div>' : '') + '</div>';
      });
      html += '</div>';
    }

    html += '<div class="btn-row"><button class="btn btn-primary" id="bd-log">Log an entry</button></div>';

    html += '<div class="eyebrow" style="margin-top:20px">History</div>';
    entries.slice().reverse().slice(0, 12).forEach(function (e) {
      var bits = [];
      if (e.bw != null) bits.push(fmt(e.bw) + U());
      MEAS.forEach(function (m) { if (e.m && e.m[m.id] != null) bits.push(m.name.toLowerCase() + " " + fmt(e.m[m.id])); });
      html += '<button class="entry-row" data-entry="' + e.id + '">' +
        '<span class="er-d">' + shortDate(e.date) + '</span>' +
        '<span class="er-b">' + esc(bits.join("  ·  ") || "note only") + '</span></button>';
    });

    c.innerHTML = html;
    document.getElementById("bd-log").onclick = function () { openBodyEntry(null); };
    c.querySelectorAll("[data-entry]").forEach(function (b) {
      b.onclick = function () {
        var e = db.body.filter(function (x) { return x.id === b.dataset.entry; })[0];
        if (e) openBodyEntry(e);
      };
    });
  };

  function openBodyEntry(existing) {
    var e = existing || { id: null, date: Date.now(), bw: null, m: {}, note: "" };
    var wStep = U() === "lb" ? 1 : 0.5;
    var html = '<h2>' + (existing ? "Edit entry · " + shortDate(e.date) : "Log entry") + '</h2>' +

      '<div class="eyebrow" style="margin:14px 0 6px">Measurements (' + L() + ')</div><div class="meas-grid">';

    sheetRoot.querySelectorAll("[data-b]").forEach(function (btn) {

    var w = document.getElementById("st-wipe");
    if (w) w.onclick = function () {
      openSheet('<h2>Erase everything?</h2><p class="sh-lead">Your program, all sessions and progress will be permanently deleted from this device.</p>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="er-no">Cancel</button><button class="btn btn-danger" id="er-yes">Erase</button></div>');
      document.getElementById("er-no").onclick = openSettings;
      document.getElementById("er-yes").onclick = function () {
        db = defaults(); try { localStorage.removeItem(KEY); } catch (e) {}
        applyTheme(); closeSheet(); go("choose"); toast("Erased");
      };
    };
  }

  function exportData() {
    var payload = JSON.stringify(db, null, 2);
    var name = "rackcoach-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    try {
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("Backup downloaded");
    } catch (e) {
      openSheet('<h2>Backup</h2><p class="sh-lead">Copy this and keep it somewhere safe.</p>' +
        '<textarea class="num-in" style="height:200px;font-size:10px;padding:10px;width:100%" readonly>' + esc(JSON.stringify(db)) + '</textarea>' +
        '<div class="btn-row"><button class="btn btn-primary" id="bk-ok">Done</button></div>');
      document.getElementById("bk-ok").onclick = openSettings;
    }
  }

  function openImport() {
    openSheet('<h2>Restore backup</h2><p class="sh-lead">Paste an exported Rack Coach backup. This replaces everything on this device.</p>' +
      '<textarea class="num-in" id="imp" style="height:160px;font-size:10px;padding:10px;width:100%" placeholder="Paste backup JSON…"></textarea>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="imp-cancel">Cancel</button><button class="btn btn-primary" id="imp-do">Restore</button></div>');
    document.getElementById("imp-cancel").onclick = openSettings;
    document.getElementById("imp-do").onclick = function () {
      var raw = document.getElementById("imp").value.trim();
      var obj; try { obj = JSON.parse(raw); } catch (e) { toast("Not valid backup text"); return; }
      if (!obj || !obj.equipment || !Array.isArray(obj.sessions)) { toast("Not a Rack Coach backup"); return; }
      db = Object.assign(defaults(), obj);
      db.settings = Object.assign(defaults().settings, obj.settings || {});
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
      applyTheme(); closeSheet();
      go("home");
      toast("Backup restored");
    };
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (sheetRoot.innerHTML) closeSheet(); }
  });

  // a metcon clock runs on wall-clock deltas; repaint it the instant we return to foreground
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && run && run.kind === "metcon") metconTick();
  });

  /* ============================================================ BOOT */
  go("home");
})();
</script>

<script>
  // offline support + auto-update: cache the shell so it runs with no signal,
  // and reload once when a new version has been deployed.
  if ("serviceWorker" in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading || !hadController) return;   // skip the very first claim
      reloading = true;
      location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.update();
        setInterval(function () { reg.update(); }, 60 * 60 * 1000);
      }).catch(function () {});
    });
  }
</script>
</body>
</html>
