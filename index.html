      b.onclick = function () { rollState.filter = b.dataset.f; rollState.wod = null; renderers.roll(); };
    });
    var doRoll = function () { rollState.wod = rollPick(); renderers.roll(); };
    var rb = document.getElementById("rl-roll"); if (rb) rb.onclick = doRoll;
    var ra = document.getElementById("rl-again"); if (ra) ra.onclick = doRoll;
    var rs = document.getElementById("rl-start");
    if (rs) rs.onclick = function () { startMetconPlayer(null, rollState.wod); };
  };

  /* ============================================================ SESSION PLAYER */
  var run = null;

  // the in-progress workout lives in memory, so mirror it to storage: if the OS
  // evicts the backgrounded app or a new version reloads the page, we pick up
  // exactly where we left off instead of losing the session.
  var RUN_KEY = KEY + ".run";
  var RUN_MAX_AGE = 12 * 60 * 60 * 1000;
  function persistRun() {
    try {
      if (!run) { localStorage.removeItem(RUN_KEY); return; }
      var snap = {};
      Object.keys(run).forEach(function (k) { if (k !== "t" && k !== "tick") snap[k] = run[k]; });
      snap.tId = run.t ? run.t.id : null;
      localStorage.setItem(RUN_KEY, JSON.stringify(snap));
    } catch (e) {}
  }
  function restoreRun() {
    var snap;
    try { snap = JSON.parse(localStorage.getItem(RUN_KEY)); } catch (e) { snap = null; }
    if (!snap || !snap.startedAt || Date.now() - snap.startedAt > RUN_MAX_AGE) { try { localStorage.removeItem(RUN_KEY); } catch (e) {} return; }
    var t = snap.tId ? tplById(snap.tId) : null;
    if (snap.tId && !t) { try { localStorage.removeItem(RUN_KEY); } catch (e) {} return; }
    delete snap.tId;
    snap.t = t;
    run = snap;
    renderPlayer();
  }
  window.RC = window.RC || {};
  window.RC.workoutActive = function () { return !!run; };
  document.addEventListener("visibilitychange", function () { if (document.hidden) persistRun(); });
  window.addEventListener("pagehide", persistRun);

  function startPlayer(chosenIdx) {
    var t = tplById(db.active.templateId);
    if (!t) { db.active = null; save(); go("choose"); return; }
    if (isMetcon(t)) { startMetconPlayer(chosenIdx); return; }
    var len = t.microcycle.length;
    var idx = (chosenIdx == null) ? (db.active.cycleIndex % len) : (chosenIdx % len);
    var actForResolve = (chosenIdx == null) ? db.active
      : { options: db.active.options, cycleIndex: idx, weekIndex: db.active.weekIndex, lifts: db.active.lifts };
    var res = resolveSession(t, actForResolve, eq());
    // flatten to a queue of sets: warmups + work per exercise
    var queue = [];
    res.exercises.forEach(function (x, xi) {
      (x.warmups || []).forEach(function (w) {
        queue.push({ xi: xi, kind: "warm", weight: w.weight, reps: w.reps, exId: x.exId, name: x.name });
      });
      x.workSets.forEach(function (w, si) {
        queue.push({ xi: xi, kind: "work", weight: x.assist ? null : w.weight, reps: w.reps, amrap: !!w.amrap,
          exId: x.exId, name: x.name, assist: !!x.assist, topSet: !!x.topSet,
          setNo: si + 1, setCount: x.workSets.length, target: x.target, repHigh: w.repHigh || x.repHigh || null });
      });
    });
    run = { t: t, res: res, queue: queue, i: 0, startedAt: Date.now(), chosenIdx: idx,
      results: res.exercises.map(function (x) {
        return { exId: x.exId, name: x.name, assist: !!x.assist, bw: !!x.bw, adhoc: !!x.adhoc,
          target: x.target, plannedWeight: x.weight || 0, sets: [] };
      }) };
    renderPlayer();
  }

  function programRun() { return !!(run && run.t && !run.custom && run.kind !== "metcon"); }
  function runDayIdx() { return programRun() ? run.chosenIdx % run.t.microcycle.length : null; }
  function dayTitle(label) { return /^[A-Z]$/.test(label || "") ? "Workout " + label : (label || "this workout"); }

  // queue entries (warm-ups for barbell work + work sets) for one exercise
  function queueFor(x, xi) {
    var q = [];
    (x.warmups || []).forEach(function (w) { q.push({ xi: xi, kind: "warm", weight: w.weight, reps: w.reps, exId: x.exId, name: x.name }); });
    x.workSets.forEach(function (w, si) {
      q.push({ xi: xi, kind: "work", weight: x.assist ? null : w.weight, reps: w.reps, exId: x.exId, name: x.name,
        assist: !!x.assist, adhoc: !!x.adhoc, setNo: si + 1, setCount: x.workSets.length, target: x.target, repHigh: w.repHigh || null });
    });
    return q;
  }
  function makeRunExercise(exId, sets, reps, weight, progressing, slotIdx) {
    var ex = EX[exId], isBw = !!ex.bw, w = isBw ? 0 : (weight || 0);
    return {
      exId: exId, name: ex.name, slotIdx: slotIdx != null ? slotIdx : null, adhoc: !progressing, assist: isBw, bw: isBw,
      target: reps, weight: w, warmups: (ex.bar && !isBw) ? genWarmups(w, eq()) : [],
      workSets: Array.from({ length: sets }, function () { return { weight: isBw ? null : w, reps: reps }; })
    };
  }
  function resultFor(x) {
    return { exId: x.exId, name: x.name, assist: !!x.assist, bw: !!x.bw, adhoc: !!x.adhoc, target: x.target, plannedWeight: x.weight || 0, sets: [] };
  }

  // insert a new exercise at the end of the current run; `permanent` also adds it to this program day
  function addExerciseToRun(exId, sets, reps, weight, permanent) {
    var dayIdx = runDayIdx(), slotIdx = null;
    if (permanent && programRun()) {
      run.t = ensureOwnActive();
      slotIdx = tplAddSlot(run.t, dayIdx, exId, sets, reps, weight, db.active.lifts);
    }
    var progressing = !!(slotIdx != null && run.t.progression && run.t.progression[exId]);
    var x = makeRunExercise(exId, sets, reps, weight, progressing, slotIdx);
    var xi = run.res.exercises.length;
    run.res.exercises.push(x);
    run.results.push(resultFor(x));
    run.queue = run.queue.concat(queueFor(x, xi));
    if (programRun() || permanent) (run.mods = run.mods || []).push({ type: "add", exId: exId, name: x.name, sets: sets, reps: reps, weight: weight,
      dayIdx: dayIdx, slotIdx: slotIdx, permanent: slotIdx != null });
    renderPlayer();
  }

  // replace the current exercise (before any of its work sets are logged)
  function swapCurrentExercise(exId, sets, reps, weight, permanent) {
    var xi = run.queue[run.i].xi, old = run.res.exercises[xi];
    var dayIdx = runDayIdx(), slotIdx = old.slotIdx;
    var keep = !!(permanent && programRun() && slotIdx != null && !old.adhoc);
    if (keep) { run.t = ensureOwnActive(); tplSwapSlot(run.t, dayIdx, slotIdx, exId, weight, db.active.lifts); }
    var progressing = !!(keep && run.t.progression && run.t.progression[exId]);
    var x = makeRunExercise(exId, sets, reps, weight, progressing, slotIdx);
    run.res.exercises[xi] = x;
    run.results[xi] = resultFor(x);
    var before = run.queue.slice(0, run.i), after = run.queue.slice(run.i).filter(function (q) { return q.xi !== xi; });
    run.queue = before.concat(queueFor(x, xi), after);
    if (programRun() && !old.adhoc) (run.mods = run.mods || []).push({ type: "swap", from: old.exId, fromName: old.name, exId: exId, name: x.name,
      sets: sets, reps: reps, weight: weight, dayIdx: dayIdx, slotIdx: slotIdx, permanent: keep });
    renderPlayer();
  }

  function openAddFlow() {
    pickExercise("Add an exercise", function (exId) {
      openSetsConfig(exId, {
        cta: "Add to workout",
        choice: programRun() ? { every: "Every " + dayTitle(run.res.label) } : null,
        onBack: openAddFlow,
        onDone: function (s, r, w, perm) { closeSheet(); addExerciseToRun(exId, s, r, w, perm); toast(EX[exId].name + (perm ? " added to " + dayTitle(run.res.label) : " added")); }
      });
    });
  }
  function openSwapFlow() {
    var step = run.queue[run.i], cur = run.res.exercises[step.xi];
    if (run.results[step.xi].sets.length) { toast("Already logged sets — add a new exercise instead"); return; }
    pickExercise("Swap " + cur.name, function (exId) {
      var fromSlot = cur.slotIdx != null && !cur.adhoc;
      openSetsConfig(exId, {
        cta: "Swap in", sets: cur.workSets.length, reps: cur.target,
        weight: (db.active && db.active.lifts && db.active.lifts[exId]) ? db.active.lifts[exId].weight : null,
        choice: programRun() && fromSlot ? { every: "Every " + dayTitle(run.res.label) } : null,
        onBack: openSwapFlow,
        onDone: function (s, r, w, perm) { closeSheet(); swapCurrentExercise(exId, s, r, w, perm); toast("Swapped for " + EX[exId].name); }
      });
    });
  }

  function changeCurrentWeight(newW) {
    var step = run.queue[run.i];

    // warm-up sets aren't logged and don't feed progression — only touch this one set
    if (step.kind === "warm") {
      step.weight = newW;
      renderPlayer();
      return;
    }

    // work set: apply to this set and every remaining work set of this exercise
    var xi = step.xi;
    run.res.exercises[xi].weight = newW;
    run.results[xi].changedWeight = newW;
    for (var k = run.i; k < run.queue.length; k++) {
      if (run.queue[k].xi === xi && run.queue[k].kind === "work") run.queue[k].weight = newW;
    }
    renderPlayer();
  }

  function renderPlayer() {
    var root = document.getElementById("player-root");
    if (!run) { root.innerHTML = ""; persistRun(); return; }
    if (run.kind === "metcon") { renderMetconPlayer(); return; }
    persistRun();
    if (run.i >= run.queue.length && !run.custom) { finishPlayer(); return; }

    // build the shell once, then update its parts in place (no full-DOM flash between sets)
    if (!root.querySelector(".player")) {
      root.innerHTML =
        '<div class="player">' +
          '<div class="pl-top">' +
            '<button class="icon-btn pl-x" id="pl-close" aria-label="Close">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
            '<div class="pl-rail" id="pl-rail"></div>' +
            '<span class="pl-count" id="pl-count"></span>' +
            '<button class="icon-btn pl-menu-btn" id="pl-menu" aria-label="Workout options">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>' +
          '</div>' +
          '<div class="pl-body" id="pl-body"></div>' +
          '<div class="pl-actions" id="pl-actions"></div>' +
        '</div>';
      document.getElementById("pl-close").onclick = endWorkoutPrompt;
      document.getElementById("pl-menu").onclick = function () { openPlayerMenu(run.queue[run.i] || null); };
      var plNew = root.querySelector(".player");
      void plNew.offsetWidth;                 // commit the off-screen start position
      plNew.classList.add("show");            // then slide up
    }

    if (run.i >= run.queue.length) { renderLiveEnd(); return; }
    var step = run.queue[run.i];
    paintRail(step);
    if (run.past) document.getElementById("pl-count").textContent = "Logging · " + shortDate(run.past.date);

    if (run.restUntil) {
      if (Date.now() < run.restUntil) { renderRest(step); return; }
      run.restUntil = null;
    }
    if (run.tick) { clearInterval(run.tick); run.tick = null; }

    var body;
    if (step.assist) {
      body = '<div class="pl-ex">' + esc(step.name) + '</div>' +
        '<div class="pl-setno">Set ' + step.setNo + ' of ' + step.setCount + '</div>' +
        '<div class="pl-target">' + repRange(step.target, step.repHigh) + (step.amrap ? '+' : '') + '<span class="u"> reps</span></div>' +
        '<div class="pl-sub">' +
        (step.amrap ? '<div class="pl-hint">As many good reps as you can — at least ' + step.target + '.</div>'
          : (step.repHigh ? '<div class="pl-hint">Aim for the top of the range on every set.</div>' : '<div class="pl-hint">Bodyweight.</div>')) +
        '</div>';
    } else {
      var setLabel = step.kind === "warm" ? "Warm-up " + warmPos(step).n + " of " + warmPos(step).of : (step.topSet ? "Work set" : "Set " + step.setNo + " of " + step.setCount);
      body = '<div class="pl-ex">' + esc(step.name) + '</div>' +
        '<div class="pl-setno">' + setLabel + '</div>' +
        '<div class="pl-target">' + fmt(step.weight) + '<span class="u"> ' + U() + '</span></div>' +
        '<div class="pl-sub">' +
        '<div class="pl-x-reps">× ' + repRange(step.reps, step.repHigh) + (step.amrap ? '+' : '') + ' reps</div>' +
        (step.topSet ? '<div class="pl-tag top">Top set — make it count</div>' : '') +
        ((EX[step.exId] && EX[step.exId].bar && (step.kind === "warm" || step.kind === "work") && plateStr(step.weight)) ? '<div class="pl-hint">' + plateStr(step.weight) + '</div>' : (step.repHigh ? '<div class="pl-hint">Top of the range on every set.</div>' : '')) +
        '</div>';
    }
    document.getElementById("pl-body").innerHTML = body;

    var doneLabel = step.kind === "warm" ? "Warm-up done" : "Set done";
    var effortStrip = "";
    if (step.kind === "work") {
      var liftLogs = db.sessions.filter(function (x) { return !x.kind || x.kind === "barbell" || x.kind === "bodybuilding" || x.kind === "freestyle"; }).length;
      if (liftLogs < 2) effortStrip = '<div class="pe-hint">' + (effortIsRpe() ? "Optional — how hard was that set, out of 10?" : "Optional — how many more good reps could you have done?") + '</div>';
      effortStrip += '<div class="pl-effort" id="pl-effort"><span class="pe-k">' +
        (effortIsRpe() ? "RPE" : "Reps left") + '</span>' +
        RIR_VALUES.map(function (v) {
          return '<button class="pe-chip' + (run.pendingRir === v ? ' on' : '') + '" data-rir="' + v + '">' + effortChipLabel(v) + '</button>';
        }).join("") + '</div>';
    }
    document.getElementById("pl-actions").innerHTML =
      effortStrip +
      '<div class="pl-prow">' +
        '<button class="btn btn-ghost pl-back" id="pl-back"' + (run.i <= 0 ? ' disabled' : '') + '>Back</button>' +
        '<button class="btn btn-primary pl-done" id="pl-done">' + doneLabel + '</button>' +
      '</div>' +
      (!step.assist ? '<button class="btn btn-ghost pl-cw" id="pl-cw">Change weight</button>' : '') +
      '<div class="row2">' +
        (step.kind === "work" && !step.assist ? '<button class="btn btn-ghost sm" id="pl-adjust">Log different</button>' : '') +
        (step.assist ? '<button class="btn btn-ghost sm" id="pl-adjust">Log reps</button>' : '') +
        '<button class="btn btn-ghost sm" id="pl-skip">Skip set</button>' +
      '</div>';

    var back = document.getElementById("pl-back");
    if (back) back.onclick = stepBack;
    var eff = document.getElementById("pl-effort");
    if (eff) eff.querySelectorAll("[data-rir]").forEach(function (b) {
      b.onclick = function () {
        var v = +b.dataset.rir;
        run.pendingRir = (run.pendingRir === v) ? null : v;
        eff.querySelectorAll("[data-rir]").forEach(function (x) { x.classList.toggle("on", +x.dataset.rir === run.pendingRir); });
      };
    });
    // a range set's prescription is "top of the range" — "Set done" logs that; fell short → "Log different"
    document.getElementById("pl-done").onclick = function () { recordSet(step, step.weight, step.repHigh || step.reps, true); };
    document.getElementById("pl-skip").onclick = function () { recordSet(step, step.weight, 0, false); };
    var adj = document.getElementById("pl-adjust");
    if (adj) adj.onclick = function () { openAdjust(step); };
    var cw = document.getElementById("pl-cw");
    if (cw) cw.onclick = function () { openChangeWeight(step); };
  }

  function endWorkoutPrompt() {
    confirmSheet("End this workout?", "Nothing from this session is saved and your program won't advance.", function () {
      if (run && run.tick) { clearInterval(run.tick); run.tick = null; }
      run = null; persistRun();
      dismissPlayer(function () { go("home", true); });
    });
  }

  function openPlayerMenu(step) {
    openSheet(
      '<h2>Workout options</h2>' +
      (step ? '<button class="menu-item" id="pm-swap"><span>Swap ' + esc(step.name) + '</span><span class="k2">⇄</span></button>' : '') +
      '<button class="menu-item" id="pm-add"><span>Add an exercise</span><span class="k2">+</span></button>' +
      (step ? '<button class="menu-item" id="pm-reorder"><span>Reorder exercises</span><span class="k2">↕</span></button>' : '') +
      (run.custom ? '<button class="menu-item" id="pm-finish"><span>Finish workout</span><span class="k2">✓</span></button>' : '') +
      '<button class="menu-item danger" id="pm-end">End workout without saving</button>'
    );
    var pr = document.getElementById("pm-reorder"); if (pr) pr.onclick = function () { openReorder(); };
    var ps = document.getElementById("pm-swap"); if (ps) ps.onclick = openSwapFlow;
    var pf = document.getElementById("pm-finish"); if (pf) pf.onclick = function () { closeSheet(); finishFreestylePlayer(); };
    document.getElementById("pm-add").onclick = openAddFlow;
    document.getElementById("pm-end").onclick = function () { closeSheet(); endWorkoutPrompt(); };
  }

  // an exercise can be reordered until you've logged a set for it
  function firstMovableXi() {
    var curXi = run.queue[run.i].xi;
    return run.results[curXi].sets.length === 0 ? curXi : curXi + 1;
  }

  function openReorder() {
    var first = firstMovableXi();
    var curXi = run.queue[run.i].xi;
    var mov = [];
    for (var i = first; i < run.res.exercises.length; i++) mov.push(i);

    if (mov.length < 2) {
      openSheet('<h2>Reorder exercises</h2><p class="sh-lead">' +
        (mov.length ? "Only one exercise left to reorder." : "The exercises left are already underway — nothing to reorder.") +
        '</p><div class="btn-row"><button class="btn btn-primary" id="ro-done">OK</button></div>');
      document.getElementById("ro-done").onclick = closeSheet;
      return;
    }

    var locked = "";
    for (var j = 0; j < first; j++) {
      locked += '<div class="ro-row done"><span>' + esc(run.res.exercises[j].name) + '</span><span class="k2">' +
        (run.results[j].sets.length ? "logged" : "skipped") + '</span></div>';
    }

    openSheet('<h2>Reorder exercises</h2>' +
      '<p class="sh-lead">Arrange what’s left. Anything you’ve logged a set for stays put, and it’s saved as your order for this workout.</p>' +
      '<div class="ro-list" id="ro-list">' + locked + '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="ro-cancel">Cancel</button><button class="btn btn-primary" id="ro-save">Save order</button></div>');

    var list = document.getElementById("ro-list");
    var nodes = {};
    mov.forEach(function (xi) {
      var row = document.createElement("div");
      row.className = "ro-row";
      row.dataset.xi = xi;
      row.innerHTML = '<span>' + esc(run.res.exercises[xi].name) +
        (xi === curXi ? ' <span class="k2" style="color:var(--accent-ink)">on now</span>' : '') + '</span>' +
        '<span class="ro-btns"><button data-dir="-1" aria-label="Move up">▲</button><button data-dir="1" aria-label="Move down">▼</button></span>';
      nodes[xi] = row;
      list.appendChild(row);
    });

    function reflectDisabled() {
      mov.forEach(function (xi, i) {
        var b = nodes[xi].querySelectorAll("button");
        b[0].disabled = (i === 0);
        b[1].disabled = (i === mov.length - 1);
      });
    }
    reflectDisabled();

    function move(xi, dir) {
      var i = mov.indexOf(xi), to = i + dir;
      if (to < 0 || to >= mov.length) return;
      var before = {};
      mov.forEach(function (x) { before[x] = nodes[x].getBoundingClientRect().top; });

      mov.splice(i, 1); mov.splice(to, 0, xi);
      mov.forEach(function (x) { list.appendChild(nodes[x]); });
      reflectDisabled();

      // FLIP: invert then play, reflow-based (no rAF — reliable on iOS standalone)
      mov.forEach(function (x) {
        var d = before[x] - nodes[x].getBoundingClientRect().top;
        nodes[x].style.transition = "none";
        nodes[x].style.transform = d ? "translateY(" + d + "px)" : "";
      });
      void list.offsetWidth;
      mov.forEach(function (x) {
        nodes[x].style.transition = "transform .2s cubic-bezier(.3,.7,0,1)";
        nodes[x].style.transform = "";
      });
    }

    list.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-dir]");
      if (!b || b.disabled) return;
      move(+b.closest(".ro-row").dataset.xi, +b.dataset.dir);
    });

    document.getElementById("ro-cancel").onclick = closeSheet;
    document.getElementById("ro-save").onclick = function () { closeSheet(); applyReorderToRun(mov); };
  }

  // movOrder = the new order of the movable-exercise xi values (a contiguous tail)
  function applyReorderToRun(movOrder) {
    var first = firstMovableXi();
    var curXi = run.queue[run.i].xi;
    var curMovable = curXi >= first;

    var newExOrder = [];
    for (var i = 0; i < first; i++) newExOrder.push(i);
    movOrder.forEach(function (xi) { newExOrder.push(xi); });
    run.res.exercises = newExOrder.map(function (o) { return run.res.exercises[o]; });
    run.results = newExOrder.map(function (o) { return run.results[o]; });

    // frozen queue steps: everything belonging to exercises before `first` (old xi < first).
    // remember how many were already passed so we can restore run.i.
    var frozen = [], passed = 0;
    run.queue.forEach(function (q, qi) {
      if (q.xi >= first) return;                 // xi unchanged for 0..first-1
      frozen.push(q);
      if (qi < run.i) passed++;
    });

    // rebuild the movable tail fresh, in the new order
    var tail = [];
    for (var m = 0; m < movOrder.length; m++) {
      var nx = first + m;
      var x = run.res.exercises[nx];
      (x.warmups || []).forEach(function (w) {
        tail.push({ xi: nx, kind: "warm", weight: w.weight, reps: w.reps, exId: x.exId, name: x.name });
      });
      x.workSets.forEach(function (w, si) {
        tail.push({ xi: nx, kind: "work", weight: x.assist ? null : w.weight, reps: w.reps, amrap: !!w.amrap,
          exId: x.exId, name: x.name, assist: !!x.assist, topSet: !!x.topSet, adhoc: !!x.adhoc,
          setNo: si + 1, setCount: x.workSets.length, target: x.target });
      });
    }

    run.queue = frozen.concat(tail);
    run.i = curMovable ? frozen.length : passed;

    // persist the full new order (slot-based; ad-hoc exercises are session-only)
    if (db.active && !run.custom) {
      db.active.order = db.active.order || {};
      db.active.order[run.res.label] = run.res.exercises
        .map(function (x) { return x.slotIdx; })
        .filter(function (s) { return s != null; });
      save();
      toast("Order saved");
    }
    renderPlayer();
  }

  function openChangeWeight(step) {
    var wStep = eq().step;
    var isWarm = step.kind === "warm";
    openSheet(
      '<h2>' + esc(step.name) + '</h2><p class="sh-lead">' +
      (isWarm ? 'Adjust this warm-up set only — your working weight isn\'t affected.' : 'Set the working weight for this set and the rest of this exercise.') + '</p>' +
      '<div class="adj-grid"><div class="ag"><div class="lab">Weight (' + U() + ')</div>' +
      '<div class="stepper"><button data-a="-">–</button><input class="mono" id="cw" inputmode="decimal" value="' + fmt(step.weight) + '"><button data-a="+">+</button></div></div></div>' +
      '<div id="cw-plate" class="chart-note" style="text-align:center;margin:-4px 0 8px"></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="cw-cancel">Cancel</button><button class="btn btn-primary" id="cw-save">Update</button></div>'
    );
    function pl() { var v = parseFloat(document.getElementById("cw").value) || 0; document.getElementById("cw-plate").textContent = plateStr(v) || ""; }
    sheetRoot.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () {
        var i = document.getElementById("cw");
        i.value = fmt(Math.max(0, (parseFloat(i.value) || 0) + (b.dataset.a === "+" ? wStep : -wStep)));
        pl();
      };
    });
    pl();
    document.getElementById("cw-cancel").onclick = closeSheet;
    document.getElementById("cw-save").onclick = function () {
      var v = parseFloat(document.getElementById("cw").value);
      if (isNaN(v) || v < 0) { toast("Enter a weight"); return; }
      closeSheet();
      changeCurrentWeight(roundLoad(v, eq()));
    };
  }

  function plateStr(weight) {
    var e = eq();
    var per = (weight - e.bar) / 2;
    if (per <= 0) return U() === "kg" && weight === e.bar ? "Empty bar" : "";
    var sizes = U() === "lb" ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25, 0.5];
    var out = [], rem = per;
    sizes.forEach(function (p) { while (rem >= p - 1e-9) { out.push(p); rem -= p; } });
    if (rem > 0.01) return "";
    return "Per side: " + out.map(fmt).join(" · ");
  }

  function recordSet(step, weight, reps, made) {
    if (!run) return;
    var r = run.results[step.xi];
    if (step.kind === "work") {
      r.sets.push({ weight: weight, reps: reps, target: step.target, repHigh: step.repHigh || null, made: made, amrap: !!step.amrap,
        rir: (run.pendingRir == null ? null : run.pendingRir) });
    }
    run.pendingRir = null;
    run.i++;
    // rest after a completed warm-up or work set (not skips) when there's more to do
    var secs = restSecondsFor(step);
    if ((step.kind === "warm" || step.kind === "work") && reps > 0 && secs > 0 && run.i < run.queue.length) {
      run.restUntil = Date.now() + secs * 1000;
      run.restTotal = secs;
      run.restLen = secs;   // the length this exercise's rest is set to; ±0:30 changes it and it's remembered
      run.restAfter = { name: step.name, exId: step.exId, weight: step.assist ? null : weight, reps: reps, warm: step.kind === "warm" };
      scheduleRestChime(secs);
    }
    renderPlayer();
  }

  /* ---------- rest timer ---------- */
  // an open-ended workout (empty start, saved workout, past log) waits here between exercises
  function renderLiveEnd() {
    if (run.tick) { clearInterval(run.tick); run.tick = null; }
    var logged = run.results.filter(function (r) { return r.sets.length; });
    document.getElementById("pl-rail").innerHTML = run.res.exercises.map(function () { return '<i class="done"></i>'; }).join("");
    document.getElementById("pl-count").textContent = run.past ? "Logging · " + shortDate(run.past.date) : logged.length ? logged.length + " done" : "";
    document.getElementById("pl-body").innerHTML =
      '<div class="pl-ex">' + esc(run.freestyleName || "Workout") + '</div>' +
      '<div class="lv-title">' + (logged.length ? "What’s next?" : run.past ? "What did you do?" : "Add your first exercise") + '</div>' +
      (logged.length ? '<div class="lv-list">' + logged.map(function (r) {
        var top = r.sets.reduce(function (m, x) { return (x.weight || 0) >= (m.weight || 0) ? x : m; }, r.sets[0]);
        return '<div><span>' + esc(r.name) + '</span><span>' + r.sets.length + ' × ' + (top.reps || 0) + (top.weight ? ' @ ' + fmt(top.weight) + ' ' + U() : '') + '</span></div>';
      }).join("") + '</div>' : '<p class="pl-hint">Pick an exercise — it fills in what you did last time.</p>');
    document.getElementById("pl-actions").innerHTML =
      '<button class="btn btn-primary pl-done" id="lv-add" style="width:100%">Add exercise</button>' +
      (logged.length ? '<button class="btn btn-ghost pl-cw" id="lv-finish">Finish workout</button>' : '');
    document.getElementById("lv-add").onclick = openAddFlow;
    var f = document.getElementById("lv-finish"); if (f) f.onclick = finishFreestylePlayer;
  }

  function workoutNameFor(ts) { var h = new Date(ts).getHours(); return h < 11 ? "Morning workout" : h < 17 ? "Afternoon workout" : "Evening workout"; }
  // past = { date, durationSec } when logging a workout that already happened
  function startEmptyWorkout(past) {
    run = { custom: true, freestyleName: workoutNameFor(past ? past.date : Date.now()), customWorkoutId: null,
      t: null, res: { label: "", dayType: null, exercises: [] }, queue: [], i: 0,
      startedAt: Date.now(), chosenIdx: null, results: [], past: past || null };
    renderPlayer();
  }

  // seconds of rest after this step (0 = off): the exercise's remembered time, else the Settings default
  function restKind(step) { return step.kind === "warm" ? "warm" : "work"; }
  function restDefault(kind) { return +(kind === "warm" ? db.settings.restWarm : db.settings.restWork) || 0; }
  function restOverride(exId, kind) { var o = db.settings.restByEx[exId]; return o && o[kind] != null ? o[kind] : null; }
  function restSecondsFor(step) {
    if (run && run.past) return 0;   // logging after the fact — nothing to rest for
    var kind = restKind(step), o = restOverride(step.exId, kind);
    return o != null ? o : restDefault(kind);
  }
  // remember (or forget, when it matches the default) an exercise's rest length
  function rememberRest(exId, kind, sec) {
    var map = db.settings.restByEx, o = map[exId] || {};
    if (sec == null || sec === restDefault(kind)) delete o[kind]; else o[kind] = sec;
    if (Object.keys(o).length) map[exId] = o; else delete map[exId];
    save();
  }
  var REST_WARM_OPTS = [0, 30, 45, 60, 90, 120];
  var REST_WORK_OPTS = [60, 90, 120, 150, 180, 240, 300];
  function restLabel(sec) { return sec ? fmtClock(sec * 1000) : "Off"; }
  function warmPos(step) {
    var list = run.queue.filter(function (q) { return q.xi === step.xi && q.kind === "warm"; });
    return { n: list.indexOf(step) + 1, of: list.length };
  }
  // one segment per exercise; the current one fills as its warm-ups and sets are done
  function paintRail(step) {
    var inEx = run.queue.filter(function (q) { return q.xi === step.xi; });
    var doneIn = inEx.indexOf(step);
    var pct = Math.max(6, Math.round(doneIn / inEx.length * 100));
    document.getElementById("pl-rail").innerHTML = run.res.exercises.map(function (x, xi) {
      return xi < step.xi ? '<i class="done"></i>' : xi === step.xi ? '<i class="cur"><b style="width:' + pct + '%"></b></i>' : '<i></i>';
    }).join("");
    document.getElementById("pl-count").textContent = "Exercise " + (step.xi + 1) + " of " + run.res.exercises.length;
  }
  var restAudio = null;
  function scheduleRestChime(secs) {
    // Web Audio has to be unlocked by a tap; "Set done" is that tap, so schedule the chime now
    try {
      restAudio = restAudio || new (window.AudioContext || window.webkitAudioContext)();
      if (restAudio.state === "suspended") restAudio.resume();
      if (run.restOsc) { try { run.restOsc.stop(); } catch (e) {} }
      var t0 = restAudio.currentTime + secs, osc = restAudio.createOscillator(), g = restAudio.createGain();
      osc.frequency.value = 880; osc.connect(g); g.connect(restAudio.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      osc.start(t0); osc.stop(t0 + 0.65);
      Object.defineProperty(run, "restOsc", { value: osc, writable: true, configurable: true, enumerable: false });
    } catch (e) {}
  }
  function cancelRestChime() { if (run && run.restOsc) { try { run.restOsc.stop(); } catch (e) {} run.restOsc = null; } }
  function adjustRest(deltaSec) {
    var a = run.restAfter || {};
    var len = Math.round(((run.restLen || run.restTotal) + deltaSec) / 15) * 15;
    run.restLen = len;
    // a rest cut to nothing is a one-off skip, not "never rest after this exercise"
    if (a.exId && len >= 15) rememberRest(a.exId, a.warm ? "warm" : "work", len);
    var left = Math.max(0, run.restUntil - Date.now()) / 1000 + deltaSec;
    if (left <= 0) { endRest(); return; }
    run.restUntil = Date.now() + left * 1000;
    run.restTotal = Math.max(Math.ceil(left), len);   // the ring measures against the new length
    scheduleRestChime(left);
    renderPlayer();
  }
  function endRest() {
    cancelRestChime();
    run.restUntil = null;
    renderPlayer();
  }
  function restTick() {
    if (!run || !run.restUntil) return;
    var left = run.restUntil - Date.now();
    if (left <= 0) {
      navigator.vibrate && navigator.vibrate([220, 120, 220]);
      run.restUntil = null;
      renderPlayer();
      return;
    }
    var clk = document.getElementById("rs-clock");
    if (clk) clk.textContent = fmtClock(Math.ceil(left / 1000) * 1000);
    var ring = document.getElementById("rs-ring");
    if (ring) ring.style.strokeDashoffset = (339.3 * (1 - left / (run.restTotal * 1000))).toFixed(1);
  }
  function renderRest(next) {
    var a = run.restAfter || {};
    var nextLine = next.kind === "warm" ? "Warm-up " + warmPos(next).n + " of " + warmPos(next).of
      : next.assist ? "Set " + next.setNo + " of " + next.setCount + " · " + repRange(next.target, next.repHigh) + " reps"
      : "Set " + next.setNo + " of " + next.setCount + " · " + fmt(next.weight) + " " + U() + " × " + repRange(next.reps, next.repHigh);
    document.getElementById("pl-body").innerHTML =
      '<div class="rs-saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' +
        (a.warm ? 'Warm-up done · ' : 'Set saved · ') + esc(a.name || "") + (a.weight != null ? ' ' + fmt(a.weight) + ' ' + U() : '') + ' × ' + (a.reps || 0) + '</div>' +
      '<div class="rs-k">Rest</div>' +
      '<div class="rs-dial"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="6"/>' +
        '<circle id="rs-ring" cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg>' +
        '<div class="rs-clock" id="rs-clock"></div></div>' +
      '<div class="rs-adj"><button class="btn btn-ghost sm" id="rs-minus" aria-label="30 seconds less">−0:30</button><button class="btn btn-ghost sm" id="rs-plus" aria-label="30 seconds more">+0:30</button></div>' +
      (function () {
        if (!a.exId) return '';
        var kind = a.warm ? "warm" : "work", o = restOverride(a.exId, kind);
        var what = esc(a.name) + (a.warm ? ' warm-ups' : '');
        return o != null
          ? '<div class="rs-rule">' + restLabel(o) + ' remembered for ' + what + ' · <button id="rs-reset">Use default (' + restLabel(restDefault(kind)) + ')</button></div>'
          : '<div class="rs-rule">Adjust to remember a rest time for ' + what + '</div>';
      })() +
      '<div class="rs-next"><span>Up next</span><b>' + esc(next.name) + '</b>' + esc(nextLine) + '</div>';
    document.getElementById("pl-actions").innerHTML =
      '<div class="pl-prow">' +
        '<button class="btn btn-ghost pl-back" id="rs-undo">Undo set</button>' +
        '<button class="btn btn-primary pl-done" id="rs-skip">Skip rest</button>' +
      '</div>';
    document.getElementById("rs-skip").onclick = endRest;
    document.getElementById("rs-minus").onclick = function () { adjustRest(-30); };
    document.getElementById("rs-plus").onclick = function () { adjustRest(30); };
    document.getElementById("rs-undo").onclick = function () { cancelRestChime(); run.restUntil = null; stepBack(); };
    var rr = document.getElementById("rs-reset");
    if (rr) rr.onclick = function () {
      rememberRest(a.exId, a.warm ? "warm" : "work", null);
      toast(a.name + " back to the default rest");
      renderRest(next);
    };
    restTick();
    if (!run.tick) run.tick = setInterval(restTick, 250);
  }

  // step back to the previous set, discarding whatever was logged for it
  function stepBack() {
    if (!run || run.i <= 0) return;
    run.restUntil = null;
    run.pendingRir = null;
    run.i--;
    var prev = run.queue[run.i];
    if (prev.kind === "work") {
      var sets = run.results[prev.xi].sets;
      if (sets.length) sets.pop();
    }
    renderPlayer();
  }

  function openAdjust(step) {
    var isAssist = step.assist;
    var w = step.weight, reps = step.reps;
    var wStep = eq().step;
    openSheet(
      '<h2>' + esc(step.name) + '</h2><p class="sh-lead">Log what you actually did for this set.</p>' +
      '<div class="adj-grid">' +
        (isAssist ? '' : '<div class="ag"><div class="lab">Weight (' + U() + ')</div><div class="stepper"><button data-a="w-">–</button><input class="mono" id="aj-w" inputmode="decimal" value="' + fmt(w) + '"><button data-a="w+">+</button></div></div>') +
        '<div class="ag"><div class="lab">Reps</div><div class="stepper"><button data-a="r-">–</button><input class="mono" id="aj-r" inputmode="numeric" value="' + reps + '"><button data-a="r+">+</button></div></div>' +
      '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="aj-cancel">Cancel</button><button class="btn btn-primary" id="aj-save">Log set</button></div>'
    );
    var root = document.getElementById("sheet-root");
    root.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () {
        var wi = document.getElementById("aj-w"), ri = document.getElementById("aj-r");
        if (b.dataset.a === "w-") wi.value = fmt(Math.max(eq().bar, (parseFloat(wi.value) || 0) - wStep));
        if (b.dataset.a === "w+") wi.value = fmt((parseFloat(wi.value) || 0) + wStep);
        if (b.dataset.a === "r-") ri.value = Math.max(0, (parseInt(ri.value, 10) || 0) - 1);
        if (b.dataset.a === "r+") ri.value = (parseInt(ri.value, 10) || 0) + 1;
      };
    });
    document.getElementById("aj-cancel").onclick = closeSheet;
    document.getElementById("aj-save").onclick = function () {
      var nw = isAssist ? null : (parseFloat(document.getElementById("aj-w").value) || step.weight);
      var nr = parseInt(document.getElementById("aj-r").value, 10); if (isNaN(nr)) nr = 0;
      var made = nr >= step.target;
      closeSheet();
      recordSet(step, nw, nr, made);
    };
  }

  function finishPlayer() {
    var t = run.t;
    // progression: only program lifts (not bodyweight assistance, not ad-hoc additions)
    var progExercises = [];
    run.results.forEach(function (r) {
      if (r.assist || r.adhoc) return;
      var ws = r.sets;
      var topW = ws.reduce(function (m, s) { return Math.max(m, s.weight || 0); }, 0);
      progExercises.push({
        exId: r.exId,
        done: ws.some(function (s) { return s.reps > 0; }),   // every set skipped = not done, not a miss
        made: ws.length > 0 && ws.every(function (s) { return s.reps >= s.target; }),
        hitTop: ws.length > 0 && ws.every(function (s) { return s.reps >= (s.repHigh || s.target); }),
        topWeight: topW
      });
    });
    var notes = applyResult(t, db.active, { dayType: run.res.dayType, cycleIndex: run.chosenIdx, exercises: progExercises }, eq());

    // snapshot of working weights after this session — for the weekly progress chart
    var snapshot = {};
    (t.anchors || []).forEach(function (id) { if (db.active.lifts[id]) snapshot[id] = db.active.lifts[id].weight; });

    var sess = {
      id: uid(), date: run.startedAt, templateId: t.id, dayLabel: run.res.label,
      dayIdx: run.chosenIdx % t.microcycle.length, mods: run.mods || [],
      weekIndex: db.active.weekIndex, dayType: run.res.dayType,
      durationSec: Math.round((Date.now() - run.startedAt) / 1000),
      snapshot: snapshot,
      actual: run.results.map(function (r, ri) {
        var top = r.sets.reduce(function (m, s) { return (s.weight || 0) >= (m.weight || 0) ? s : m; }, r.sets[0] || {});
        var rx = run.res.exercises[ri] || {};
        return {
          exId: r.exId, name: r.name, assist: r.assist, adhoc: r.adhoc, slotIdx: rx.slotIdx != null ? rx.slotIdx : null,
          made: (r.assist || r.adhoc) ? null : (r.sets.length > 0 && r.sets.every(function (s) { return s.reps >= s.target; })),
          sets: r.sets, topWeight: (top && top.weight) || 0, topReps: (top && top.reps) || 0
        };
      }),
      notes: notes
    };
    db.sessions.push(sess);
    save();

    lastSummary = sess;
    run = null; persistRun();
    finishAndCelebrate(sess, function () { go("summary"); });
  }

  /* ===================================================== METCON PLAYER */
  function metconElapsed() {
    if (!run || !run.startWall) return 0;
    var nowRef = run.running ? Date.now() : (run.pausedAt || run.startWall);
    return Math.max(0, nowRef - run.startWall - run.pausedMs);
  }
  function fmtClock(ms) {

    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function metconMinuteText() {
    var w = run.wod;
    if (w.format !== "emom" || !w.minutes || !w.minutes.length) return "";
    var min = Math.floor(metconElapsed() / 60000);
    return "Minute " + (min + 1) + " — " + w.minutes[min % w.minutes.length].text;
  }

  function startMetconPlayer(chosenIdx, explicitWod) {
    var t = db.active ? tplById(db.active.templateId) : null;
    var wod, label, idx = null;
    if (explicitWod) { wod = explicitWod; label = explicitWod.name; }
    else {
      var len = t.microcycle.length;
      idx = (chosenIdx == null) ? (db.active.cycleIndex % len) : (chosenIdx % len);
      var r = resolveMetcon(t, { cycleIndex: idx });
      wod = r.wod; label = r.label;
    }
    run = {
      kind: "metcon", t: t, adhoc: !!explicitWod, chosenIdx: idx,
      wod: wod, res: { label: label, dayType: null },
      startedAt: Date.now(), startWall: null, pausedMs: 0, pausedAt: null,
      running: false, roundsDone: 0, checks: {}, emomLastMin: -1
    };
    renderMetconPlayer();
  }

  function metconTick() {
    if (!run || run.kind !== "metcon") return;
    var clk = document.getElementById("mc-clock");
    if (!clk) return;
    var el = metconElapsed(), w = run.wod;
    if (metconCountsDown(w)) {
      var cap = (w.capMin || 0) * 60000;
      var rem = cap - el;
      clk.textContent = fmtClock(Math.max(0, rem));
      if (rem <= 0 && run.running) { run.running = false; navigator.vibrate && navigator.vibrate([200, 100, 200]); openMetconScore(); return; }
    } else {
      clk.textContent = fmtClock(el);
    }
    if (w.format === "emom") {
      var min = Math.floor(el / 60000);
      if (min !== run.emomLastMin) { run.emomLastMin = min; navigator.vibrate && navigator.vibrate(180); }
      var mt = document.getElementById("mc-minute");
      if (mt) mt.textContent = metconMinuteText();
    }
  }

  function metconStartPause() {
    if (!run.startWall) { run.startWall = Date.now(); run.running = true; }
    else if (run.running) { run.running = false; run.pausedAt = Date.now(); }
    else { run.pausedMs += Date.now() - run.pausedAt; run.pausedAt = null; run.running = true; }
    renderMetconPlayer();
  }

  function renderMetconPlayer() {
    var root = document.getElementById("player-root");
    if (!run || run.kind !== "metcon") { root.innerHTML = ""; return; }
    persistRun();
    var w = run.wod, moves = metconMoves(w);
    var down = metconCountsDown(w);

    if (!root.querySelector(".player")) {
      root.innerHTML =
        '<div class="player">' +
          '<div class="pl-top">' +
            '<button class="icon-btn pl-x" id="mc-close" aria-label="Close">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
            '<div class="pl-rail" id="mc-rail"></div>' +
            '<span class="pl-count" id="mc-count"></span>' +
            '<span style="width:34px"></span>' +
          '</div>' +
          '<div class="pl-body" id="mc-bodywrap"></div>' +
          '<div class="pl-actions" id="mc-actions"></div>' +
        '</div>';
      document.getElementById("mc-close").onclick = endWorkoutPrompt;
      var plNew = root.querySelector(".player");
      void plNew.offsetWidth;
      plNew.classList.add("show");
      if (!run.tick) run.tick = setInterval(metconTick, 250);
    }

    var hyrox = w.format === "hyrox";
    var checkedCount = moves.filter(function (_, j) { return run.checks[j]; }).length;
    var progress = hyrox ? checkedCount : run.roundsDone;
    var target = w.targetRounds || (hyrox ? moves.length : null);
    document.getElementById("mc-rail").innerHTML = target
      ? Array.from({ length: target }, function (_, i) { return '<i class="' + (i < progress ? "done" : "") + '"></i>'; }).join("")
      : "";
    document.getElementById("mc-count").textContent = w.format === "amrap" || w.format === "rft" || hyrox || w.format === "chipper"
      ? (target ? progress + " / " + target : "Round " + (run.roundsDone + 1)) : "";

    var el = metconElapsed();
    var clockTxt = down ? fmtClock(Math.max(0, (w.capMin || 0) * 60000 - el)) : fmtClock(el);
    var body = '<div class="mc-format">' + esc(metconSubtitle(w)) + '</div>' +
      '<div class="mc-clock mono" id="mc-clock">' + clockTxt + '</div>' +
      (w.format === "emom" ? '<div class="mc-minute" id="mc-minute">' + esc(metconMinuteText()) + '</div>' : '') +
      '<div class="mc-moves">' +
      moves.map(function (m, i) {
        return '<button class="mc-move' + (run.checks[i] ? ' done' : '') + '" data-mi="' + i + '">' +
          '<span class="mc-chk"></span><span>' + esc(moveLine(m)) + '</span></button>';
      }).join("") +
      '</div>' +
      (w.format === "rft" || w.format === "amrap" || w.format === "chipper"
        ? '<div class="mc-round-ctl"><button id="mc-rminus">–</button><span>Rounds done: <b>' + run.roundsDone + '</b></span><button id="mc-rplus">+</button></div>' : '');
    document.getElementById("mc-bodywrap").innerHTML = body;

    var startLbl = !run.startWall ? "Start" : (run.running ? "Pause" : "Resume");
    document.getElementById("mc-actions").innerHTML =
      '<button class="btn btn-primary mc-startbtn" id="mc-start">' + startLbl + '</button>' +
      '<button class="btn btn-ghost" id="mc-finish">Finish &amp; log score</button>';

    document.getElementById("mc-start").onclick = metconStartPause;
    document.getElementById("mc-finish").onclick = function () { openMetconScore(); };
    document.getElementById("mc-bodywrap").querySelectorAll("[data-mi]").forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.mi;
        run.checks[i] = !run.checks[i];
        var allDone = moves.every(function (_, j) { return run.checks[j]; });
        if (allDone && !hyrox && (w.format === "rft" || w.format === "amrap")) {
          run.roundsDone++;
          run.checks = {};
        }
        renderMetconPlayer();
      };
    });
    var rm = document.getElementById("mc-rminus"), rp = document.getElementById("mc-rplus");
    if (rm) rm.onclick = function () { run.roundsDone = Math.max(0, run.roundsDone - 1); renderMetconPlayer(); };
    if (rp) rp.onclick = function () { run.roundsDone++; renderMetconPlayer(); };
  }

  function openMetconScore() {
    var w = run.wod, st = w.scoreType || "time";
    var el = metconElapsed();
    var prefillSec = Math.round(el / 1000);
    var pm = Math.floor(prefillSec / 60), ps = prefillSec % 60;
    var fields = "";
    if (st === "rounds") {
      fields = '<div class="ag"><div class="lab">Rounds completed</div><div class="stepper"><button data-a="ro-">–</button><input class="mono" id="ms-ro" inputmode="numeric" value="' + run.roundsDone + '"><button data-a="ro+">+</button></div></div>' +
        '<div class="ag"><div class="lab">+ reps into next round</div><div class="stepper"><button data-a="rp-">–</button><input class="mono" id="ms-rp" inputmode="numeric" value="0"><button data-a="rp+">+</button></div></div>';
    } else if (st === "reps") {
      fields = '<div class="ag"><div class="lab">Total reps</div><div class="stepper"><button data-a="tr-">–</button><input class="mono" id="ms-tr" inputmode="numeric" value="0"><button data-a="tr+">+</button></div></div>';
    } else if (st === "load") {
      fields = '<div class="ag"><div class="lab">Top load (' + U() + ')</div><div class="stepper"><button data-a="ld-">–</button><input class="mono" id="ms-ld" inputmode="decimal" value="0"><button data-a="ld+">+</button></div></div>';
    } else {
      fields = '<div class="ag"><div class="lab">Time — min</div><div class="stepper"><button data-a="mm-">–</button><input class="mono" id="ms-mm" inputmode="numeric" value="' + pm + '"><button data-a="mm+">+</button></div></div>' +
        '<div class="ag"><div class="lab">sec</div><div class="stepper"><button data-a="ss-">–</button><input class="mono" id="ms-ss" inputmode="numeric" value="' + ps + '"><button data-a="ss+">+</button></div></div>' +
        '<label class="mc-cap"><input type="checkbox" id="ms-cap"> Hit the time cap (did not finish)</label>';
    }
    openSheet(
      '<h2>' + esc(w.name) + '</h2><p class="sh-lead">Log your score — it goes in your history.</p>' +
      '<div class="adj-grid">' + fields + '</div>' +
      '<div class="field" style="margin-top:10px"><div class="mini-seg" data-set="rx"><button data-v="rx" aria-selected="true">RX</button><button data-v="scaled" aria-selected="false">Scaled</button></div></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="ms-cancel">Back</button><button class="btn btn-primary" id="ms-save">Log it</button></div>'
    );
    var rx = true;
    var sr = document.getElementById("sheet-root");
    sr.querySelectorAll('[data-set="rx"] button').forEach(function (b) {
      b.onclick = function () { rx = b.dataset.v === "rx"; sr.querySelectorAll('[data-set="rx"] button').forEach(function (x) { x.setAttribute("aria-selected", x === b); }); };
    });
    sr.querySelectorAll("[data-a]").forEach(function (b) {
      b.onclick = function () {
        var map = { "ro": "ms-ro", "rp": "ms-rp", "tr": "ms-tr", "ld": "ms-ld", "mm": "ms-mm", "ss": "ms-ss" };
        var k = b.dataset.a.slice(0, 2), dir = b.dataset.a.slice(2) === "+" ? 1 : -1;
        var inp = document.getElementById(map[k]);
        var step = k === "ld" ? eq().step : 1;
        inp.value = Math.max(0, (parseFloat(inp.value) || 0) + dir * step);
      };
    });
    document.getElementById("ms-cancel").onclick = function () { closeSheet(); renderMetconPlayer(); };
    document.getElementById("ms-save").onclick = function () {
      var score = { rx: rx };
      if (st === "rounds") { score.rounds = parseInt(document.getElementById("ms-ro").value, 10) || 0; score.reps = parseInt(document.getElementById("ms-rp").value, 10) || 0; }
      else if (st === "reps") { score.reps = parseInt(document.getElementById("ms-tr").value, 10) || 0; }
      else if (st === "load") { score.load = parseFloat(document.getElementById("ms-ld").value) || 0; }
      else {
        score.timeSec = (parseInt(document.getElementById("ms-mm").value, 10) || 0) * 60 + (parseInt(document.getElementById("ms-ss").value, 10) || 0);
        score.cappedOut = document.getElementById("ms-cap").checked;
      }
      closeSheet();
      finishMetconPlayer(score);
    };
  }

  function finishMetconPlayer(score) {
    if (!run) return;
    if (run.tick) { clearInterval(run.tick); run.tick = null; }
    var w = run.wod, t = run.t;
    var sess = {
      id: uid(), date: run.startedAt, kind: "metcon",
      templateId: run.adhoc ? null : (t && t.id), programName: t ? t.name : (run.adhoc ? "Rolled workout" : null),
      adhoc: run.adhoc, source: run.adhoc ? "roller" : "program",
      dayLabel: run.res.label, wodId: w.id, wodName: w.name, style: w.style, format: w.format,
      weekIndex: db.active ? db.active.weekIndex : null,
      durationSec: Math.round((Date.now() - run.startedAt) / 1000),
      score: {
        type: w.scoreType || "time",
        rounds: score.rounds != null ? score.rounds : null,
        reps: score.reps != null ? score.reps : null,
        timeSec: score.timeSec != null ? score.timeSec : null,
        load: score.load != null ? score.load : null,
        cappedOut: !!score.cappedOut,
        rx: score.rx !== false
      },
      movements: metconMoves(w).map(function (m) { return { move: m.move, amount: m.amount }; }),
      note: ""
    };
    db.sessions.push(sess);
    if (db.active && !run.adhoc && t) advanceRotation(db.active, t, run.chosenIdx);
    save();
    lastSummary = sess;
    run = null; persistRun();
    finishAndCelebrate(sess, function () { go("summary"); });
  }

  function dismissPlayer(cb) {
    if (run && run.tick) { clearInterval(run.tick); run.tick = null; }
    var pl = document.querySelector("#player-root .player");
    if (!pl) { document.getElementById("player-root").innerHTML = ""; if (cb) cb(); return; }
    pl.classList.remove("show");
    var done = function () {
      pl.removeEventListener("transitionend", done);
      clearTimeout(tm);
      document.getElementById("player-root").innerHTML = "";
      if (cb) cb();
    };
    var tm = setTimeout(done, 400);
    pl.addEventListener("transitionend", done);
  }

  /* ============================================================ SUMMARY */
  var lastSummary = null;
  renderers.summary = function () {
    var c = screens.summary;
    var s = lastSummary;
    if (!s) { go("home"); return; }

    if (s.kind === "metcon") { renderMetconSummary(c, s); return; }

    var freestyle = s.kind === "freestyle";
    var t = tplById(s.templateId) || { name: s.programName || "Workout" };
    var vol = 0, sets = 0;
    s.actual.forEach(function (a) { a.sets.forEach(function (x) { vol += (x.weight || 0) * (x.reps || 0); sets++; }); });
    var mins = Math.max(1, Math.round(s.durationSec / 60));

    var html = '<h2 class="title">' + esc(sessionTitle(s)) + ' done</h2>' +
      '<p class="lead">' + (freestyle ? (s.past ? 'Logged for ' + esc(shortDate(s.date)) : 'One-off workout') + nextProgramNote() : esc(t.name) + ' · Week ' + programWeekAt(s.date)) + '</p>' +
      '<div class="statbar">' +
        '<div class="stat"><div class="k">Volume</div><div class="v">' + fmt(Math.round(vol)) + '<small> ' + U() + '</small></div></div>' +
        '<div class="stat"><div class="k">Sets</div><div class="v">' + sets + '</div></div>' +
        '<div class="stat"><div class="k">Time</div><div class="v">' + mins + '<small> min</small></div></div>' +
      '</div>';

    // what you logged
    html += '<div class="eyebrow">Logged</div><div class="day-block">';
    var swappedIn = {};
    (s.mods || []).forEach(function (m) { if (m.type === "swap") swappedIn[m.exId] = 1; });
    s.actual.forEach(function (a) {
      if (!a.sets.length) return;
      var skipped = !a.sets.some(function (x) { return x.reps > 0; });
      var top = skipped ? "skipped" : a.topWeight ? fmt(a.topWeight) + U() + " × " + a.topReps : a.topReps + " reps";
      var rirs = a.sets.map(function (x) { return x.rir; }).filter(function (v) { return v != null; });
      var effTag = rirs.length ? ' · ' + effortText(Math.min.apply(null, rirs)) : '';
      html += '<div class="ex-line"><span>' + esc(a.name) + (a.adhoc && !freestyle ? ' <span class="k2" style="font-size: var(--fs-xs);color:var(--text-faint)">' + (swappedIn[a.exId] ? "SWAPPED" : "ADDED") + '</span>' : '') +
        '</span><span class="scheme">' + (skipped ? "skipped" : a.sets.length + (a.sets.length === 1 ? " set · " : " sets · ") + esc(top) + esc(effTag)) + '</span></div>';
    });
    html += '</div>';

    if (freestyle) {
      html += oneOffExtrasHtml(s) +
        '<div class="btn-row"><button class="btn btn-primary" id="sm-done">Done</button></div>' +
        '<div class="btn-row"><button class="btn btn-ghost" id="sm-progress">See history</button></div>';
      c.innerHTML = html;
      wireOneOffExtras(c, s);
      document.getElementById("sm-done").onclick = function () { go("home", true); };
      document.getElementById("sm-progress").onclick = function () { go("progress", false); };
      return;
    }

    html += programChangesHtml(s);

    html += '<div class="eyebrow">Next session\'s weights</div><div class="day-block">';
    if (!s.notes.length) html += '<p style="font-size: var(--fs-sm);color:var(--text-muted)">No program changes this session.</p>';
    s.notes.forEach(function (n) {
      var ic, txt;
      if (n.kind === "up") { ic = "up"; txt = "next: " + fmt(n.to) + " " + U(); }
      else if (n.kind === "deload") { ic = "deload"; txt = "stalled — cut to " + fmt(n.to) + " " + U() + " to rebuild"; }
      else if (n.double) { ic = "hold"; txt = "hold " + fmt(n.to) + " " + U() + " — add reps until you own the top of the range"; }
      else { ic = "hold"; txt = "stay at " + fmt(n.to) + " " + U() + " (" + n.miss + " miss" + (n.miss > 1 ? "es" : "") + ", " + (n.before - n.miss) + " more before a cut)"; }
      html += '<div class="change-row"><span class="cr-ic ' + ic + '">' + (n.kind === "up" ? "▲" : n.kind === "deload" ? "▼" : "–") + '</span>' +
        '<span>' + esc(EX[n.exId] ? EX[n.exId].name : n.exId) + '</span><span class="cr-w">' + esc(txt) + '</span></div>';
    });
    html += '</div>';

    html += '<div class="btn-row"><button class="btn btn-primary" id="sm-done">Back to program</button></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="sm-progress">See progress</button></div>';
    c.innerHTML = html;
    wireProgramChanges(c, s);
    document.getElementById("sm-done").onclick = function () { go("home", true); };
    document.getElementById("sm-progress").onclick = function () { go("progress", false); };
  };

  // "· Starting Strength still has Workout B next" — one-offs never move the program
  function nextProgramNote() {
    if (!db.active) return "";
    var t = tplById(db.active.templateId);
    if (!t || isMetcon(t)) return "";
    return " · your program still has " + esc(sessionLabel(resolveSession(t, db.active, eq()))) + " next";
  }
  function lineageOf(id) { var t = tplById(id); return t ? (t.basedOn || t.id) : id; }
  function summaryProgram(s) {
    if (!db.active || !s.templateId) return null;
    if (lineageOf(db.active.templateId) !== lineageOf(s.templateId)) return null;
    return tplById(db.active.templateId);
  }
  function weightUsed(s, exId, fallback) {
    var a = (s.actual || []).filter(function (x) { return x.exId === exId; })[0];
    return a && a.topWeight ? a.topWeight : fallback;
  }

  // mid-workout changes: confirm the permanent ones (with undo), offer to keep today-only ones,
  // and offer to drop program exercises you skipped entirely
  function programChangesHtml(s) {
    var t = summaryProgram(s);
    if (!t) return "";
    var day = dayTitle(s.dayLabel), rows = [];
    (s.mods || []).forEach(function (m, i) {
      if (m.undone) { rows.push('<div class="pc-row"><span>' + (m.type === "add" ? esc(m.name) + ' kept to today only' : esc(m.fromName) + ' is back in ' + esc(day)) + '</span></div>'); return; }
      if (m.permanent) {
        rows.push('<div class="pc-row"><span>' + (m.type === "add" ? esc(m.name) + ' ' + m.sets + '×' + m.reps + ' added to ' + esc(day) : esc(m.name) + ' replaces ' + esc(m.fromName) + ' in ' + esc(day)) +
          '</span><button data-pc-undo="' + i + '">Undo</button></div>');
      } else {
        rows.push('<div class="pc-row"><span>' + (m.type === "add" ? 'Keep ' + esc(m.name) + ' in ' + esc(day) + '?' : 'Keep ' + esc(m.name) + ' instead of ' + esc(m.fromName) + '?') +
          '</span><button data-pc-keep="' + i + '">' + (m.type === "add" ? "Keep" : "Keep the swap") + '</button></div>');
      }
    });
    s.removed = s.removed || [];
    (s.actual || []).forEach(function (a) {
      if (a.sets.some(function (x) { return x.reps > 0; }) || a.adhoc || a.slotIdx == null) return;   // only exercises skipped entirely
      var gone = s.removed.filter(function (r) { return r.exId === a.exId; })[0];
      if (gone) { rows.push('<div class="pc-row"><span>' + esc(a.name) + ' removed from ' + esc(day) + '</span><button data-pc-restore="' + esc(a.exId) + '">Undo</button></div>'); return; }
      var idx = findSlot(t, s.dayIdx, a.exId);
      if (idx < 0 || slotLocked(t, t.microcycle[s.dayIdx].slots[idx])) return;
      rows.push('<div class="pc-row"><span>You skipped ' + esc(a.name) + ' — remove it from ' + esc(day) + '?</span><button data-pc-remove="' + esc(a.exId) + '">Remove</button></div>');
    });
    if (!rows.length) return "";
    return '<div class="eyebrow">Your program</div><div class="day-block pc-box">' + rows.join("") + '</div>';
  }
  function wireProgramChanges(c, s) {
    var redo = function () { save(); var y = c.scrollTop; renderers.summary(); c.scrollTop = y; };
    c.querySelectorAll("[data-pc-keep]").forEach(function (b) {
      b.onclick = function () {
        var m = s.mods[+b.dataset.pcKeep], t = ensureOwnActive(), w = weightUsed(s, m.exId, m.weight);
        if (m.type === "add") m.slotIdx = tplAddSlot(t, s.dayIdx, m.exId, m.sets, m.reps, w, db.active.lifts);
        else tplSwapSlot(t, s.dayIdx, m.slotIdx, m.exId, w, db.active.lifts);
        m.permanent = true; redo();
      };
    });
    c.querySelectorAll("[data-pc-undo]").forEach(function (b) {
      b.onclick = function () {
        var m = s.mods[+b.dataset.pcUndo], t = ensureOwnActive();
        if (m.type === "add") { var idx = findSlot(t, s.dayIdx, m.exId); if (idx >= 0) tplRemoveSlot(t, s.dayIdx, idx); }
        else tplSwapSlot(t, s.dayIdx, m.slotIdx, m.from, null, db.active.lifts);
        m.undone = true; redo();
      };
    });
    c.querySelectorAll("[data-pc-remove]").forEach(function (b) {
      b.onclick = function () {
        var t = ensureOwnActive(), idx = findSlot(t, s.dayIdx, b.dataset.pcRemove);
        if (idx < 0) return;
        s.removed.push({ exId: b.dataset.pcRemove, idx: idx, slot: deepClone(t.microcycle[s.dayIdx].slots[idx]),
          prog: t.progression && t.progression[b.dataset.pcRemove] ? deepClone(t.progression[b.dataset.pcRemove]) : null });
        tplRemoveSlot(t, s.dayIdx, idx); redo();
      };
    });
    c.querySelectorAll("[data-pc-restore]").forEach(function (b) {
      b.onclick = function () {
        var r = s.removed.filter(function (x) { return x.exId === b.dataset.pcRestore; })[0], t = ensureOwnActive();
        t.microcycle[s.dayIdx].slots.splice(Math.min(r.idx, t.microcycle[s.dayIdx].slots.length), 0, r.slot);
        if (r.prog) { t.progression = t.progression || {}; t.progression[r.exId] = r.prog; } else ensureProgression(t, r.exId, r.slot.reps);
        touched(t);
        s.removed = s.removed.filter(function (x) { return x !== r; }); redo();
      };
    });
  }

  // after a one-off: save it for reuse, and offer to move program weights up if you out-lifted them
  function oneOffExtrasHtml(s) {
    var html = "";
    var t = db.active ? tplById(db.active.templateId) : null;
    s.liftUpdates = s.liftUpdates || {};
    if (t && !isMetcon(t) && db.active.lifts) {
      (s.actual || []).forEach(function (a) {
        var lift = db.active.lifts[a.exId], slot = slotFor(t, a.exId);
        if (s.liftUpdates[a.exId]) { html += '<div class="pc-row"><span>' + esc(t.name) + ' now has ' + esc(a.name) + ' at ' + fmt(s.liftUpdates[a.exId]) + ' ' + U() + '</span></div>'; return; }
        if (!lift || !slot || !a.topWeight || a.topWeight <= lift.weight || (a.topReps || 0) < slot.reps) return;
        html += '<div class="pc-row"><span>You did ' + esc(a.name) + ' ' + fmt(a.topWeight) + ' ' + U() + ' × ' + a.topReps + ' — your program has ' + fmt(lift.weight) + ' ' + U() + '. Move it up?</span>' +
          '<button data-lift-up="' + esc(a.exId) + '">Update</button></div>';
      });
      if (html) html = '<div class="eyebrow">Your program</div><div class="day-block pc-box">' + html + '</div>';
    }
    if (!s.customWorkoutId) {
      html += s.savedAs
        ? '<p class="pc-saved">Saved as “' + esc(s.savedAs) + '” — find it ' + (db.active ? 'under Something else today' : 'on Home') + '.</p>'
        : '<div class="btn-row"><button class="btn btn-ghost" id="sm-saveas">Save as a workout</button></div>';
    }
    return html;
  }
  function wireOneOffExtras(c, s) {
    var redo = function () { save(); var y = c.scrollTop; renderers.summary(); c.scrollTop = y; };
    c.querySelectorAll("[data-lift-up]").forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.liftUp, a = s.actual.filter(function (x) { return x.exId === id; })[0], lift = db.active.lifts[id];
        lift.weight = roundFor(id, a.topWeight, eq()); lift.failCount = 0;
        lift.history.push({ t: Date.now(), w: lift.weight });
        s.liftUpdates[id] = lift.weight; redo();
      };
    });
    var sv = document.getElementById("sm-saveas");
    if (sv) sv.onclick = function () {
      openSheet('<h2>Save as a workout</h2><p class="sh-lead">Reuse it any time — it fills in today’s weights.</p>' +
        '<input class="num-in" id="sa-name" maxlength="40" value="' + esc(s.dayLabel && !/workout$/i.test(s.dayLabel) ? s.dayLabel : "") + '" placeholder="Hotel gym, arm day…" style="width:100%">' +
        '<div class="btn-row"><button class="btn btn-ghost" id="sa-cancel">Cancel</button><button class="btn btn-primary" id="sa-ok">Save</button></div>');
      document.getElementById("sa-cancel").onclick = closeSheet;
      document.getElementById("sa-ok").onclick = function () {
        var name = document.getElementById("sa-name").value.trim();
        if (!name) { toast("Give it a name"); return; }
        db.customWorkouts.push(workoutFromSession(s, name));
        s.savedAs = name; closeSheet(); redo(); toast("Saved");
      };
    };
  }
  function workoutFromSession(s, name) {
    return { id: "cw-" + uid(), custom: true, kind: "strength", name: name, createdAt: Date.now(),
      exercises: (s.actual || []).filter(function (a) { return a.sets.length; }).map(function (a) {
        return { exId: a.exId, sets: a.sets.length, reps: a.sets[0].target || a.sets[0].reps, repHigh: null, weight: a.topWeight || 0 };
      }) };
  }

  function metconScoreText(s) {
    var sc = s.score || {};
    if (sc.type === "rounds") return sc.rounds + " rounds" + (sc.reps ? " + " + sc.reps : "");
    if (sc.type === "reps") return sc.reps + " reps";
    if (sc.type === "load") return fmt(sc.load) + " " + U();
    if (sc.timeSec != null) return fmtClock(sc.timeSec * 1000) + (sc.cappedOut ? " (capped)" : "");
    return "—";
  }
  function renderMetconSummary(c, s) {
    var mins = Math.max(1, Math.round(s.durationSec / 60));
    var html = '<h2 class="title">' + esc(s.wodName || s.dayLabel) + '</h2>' +
      '<p class="lead">' + esc(s.programName || (s.adhoc ? "Rolled workout" : "Workout")) + ' · ' + esc(FORMAT_LABEL[s.format] || s.format) + '</p>' +
      '<div class="statbar">' +
        '<div class="stat"><div class="k">Score</div><div class="v">' + esc(metconScoreText(s)) + '</div></div>' +
        '<div class="stat"><div class="k">Time</div><div class="v">' + mins + '<small> min</small></div></div>' +
        '<div class="stat"><div class="k">Effort</div><div class="v">' + (s.score && s.score.rx ? "RX" : "Scaled") + '</div></div>' +
      '</div>';
    if (s.movements && s.movements.length) {
      html += '<div class="eyebrow">The workout</div><div class="day-block">' +
        s.movements.map(function (m) {
          return '<div class="ex-line"><span>' + esc(moveName(m.move)) + '</span><span class="scheme">' + (m.amount != null ? m.amount + " " + moveUnit(m.move) : "") + '</span></div>';
        }).join("") + '</div>';
    }
    if (s.note) html += '<p style="font-size: var(--fs-sm);color:var(--text-muted)">' + esc(s.note) + '</p>';
    html += '<div class="btn-row"><button class="btn btn-primary" id="sm-done">Done</button></div>' +
      '<div class="btn-row"><button class="btn btn-ghost" id="sm-progress">See history</button></div>';
    c.innerHTML = html;
    document.getElementById("sm-done").onclick = function () { go("home", true); };
    document.getElementById("sm-progress").onclick = function () { go("progress", false); };
  }

  /* ============================================================ PROGRESS */
  // Sunday-anchored week key for a timestamp (weeks run Sunday–Saturday)
  function weekKey(ts) {
    var d = new Date(ts); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - d.getDay());
    return d.getTime();
  }
  // calendar weeks since the program started (1-based); shown as "Week N"
  function programWeekAt(ts) {
    var start = db.active ? db.active.startedAt : ts;
    return Math.max(1, Math.round((weekKey(ts) - weekKey(start)) / 604800000) + 1);
  }
  function programWeek() { return programWeekAt(Date.now()); }
  // heaviest work set actually performed for this lift, most recent session first
  // (only sessions where at least one set had reps > 0 — a skipped lift doesn't count)
  function lastLiftedTop(exId) {
    for (var i = db.sessions.length - 1; i >= 0; i--) {
      var a = ((db.sessions[i] || {}).actual || []).filter(function (x) {
        return x.exId === exId && x.sets && x.sets.some(function (s) { return s.reps > 0; });
      })[0];
      if (a) return a.topWeight;
    }
    return null;
  }

  // one point per week: heaviest weight ACTUALLY lifted for that lift that week.
  // weeks where the lift wasn't trained are skipped (no phantom points from the
  // prescribed/next weight); the line is anchored at the starting weight only
  // when training on this lift began in a later week.
  function weeklySeries(exId, startWeight, startedAt) {
    var byWeek = {};
    db.sessions.forEach(function (s) {
      var a = (s.actual || []).filter(function (x) {
        return x.exId === exId && x.sets && x.sets.some(function (st) { return st.reps > 0; });
      })[0];
      if (!a) return;
      var k = weekKey(s.date);
      byWeek[k] = byWeek[k] == null ? a.topWeight : Math.max(byWeek[k], a.topWeight);
    });
    var weeks = Object.keys(byWeek).map(Number).sort(function (a, b) { return a - b; });
    var startWk = weekKey(startedAt);
    if (weeks.length && weeks[0] > startWk) { weeks.unshift(startWk); byWeek[startWk] = startWeight; }
    return weeks.map(function (k) { return { t: k, v: byWeek[k] }; });
  }

  // a chart card: title, sub-line, delta, weekly series. When nowVal is given the
  // right-hand cell shows that weight big with a small "N since start" line beneath.
  var progWaiting = 0;   // cards in the current section still waiting for their first full week
  var WAIT_NOTE = '<p class="chart-note" style="margin:0 0 8px">Charts start after your first full week — one point per week.</p>';
  function progCard(title, sub, delta, unit, series, nowVal) {
    var now = nowVal != null
      ? '<span class="lp-w">' + fmt(nowVal) + ' <small>' + unit + '</small></span>' +
        (delta !== 0 ? '<span class="lp-since">' + (delta > 0 ? '+' : '') + fmt(delta) + ' since start</span>' : '')
      : (delta >= 0 ? '+' : '') + fmt(delta) + ' <small>' + unit + '</small>';
    return '<div class="lift-prog"><div><h4>' + esc(title) + '</h4>' +
      '<div class="lp-sub">' + esc(sub) + '</div></div>' +
      '<div class="lp-now' + (nowVal != null ? ' has-now' : '') + '">' + now + '</div>' +
      (series.length >= 2

        : (progWaiting++, '')) +

  }

  function bodyChartsHtml() {

    var withLean = entries.filter(function (e) { return leanMass(e); });
    if (withLean.length) {

    MEAS.forEach(function (m) {

      html += progCard(m.name,
        fmt(withV[0].m[m.id]) + " → " + fmt(withV[withV.length - 1].m[m.id]) + " " + L(),
        dd, L(), bodyWeeklySeries(function (e) { return (e.m && e.m[m.id] != null) ? e.m[m.id] : null; }));
    });
    return (progWaiting ? WAIT_NOTE : '') + html;

  function metconHistoryHtml() {

  renderers.progress = function () {

    html += metconHistoryHtml();

    html += '<div class="eyebrow" style="margin-top:22px">Body</div>' + bodyChartsHtml();

    if (db.sessions.length) {

  // weekly line chart with a visible dot at every week
  function lineChart(series) {
    var w = 300, h = 104, padX = 6, padY = 12;
    if (series.length < 2) {
      var only = series.length ? fmt(series[0].v) : "";
      return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
        (series.length ? '<circle cx="' + (w / 2) + '" cy="' + (h / 2) + '" r="4" fill="var(--accent)"/>' +
          '<text x="' + (w / 2) + '" y="' + (h / 2 - 12) + '" text-anchor="middle" fill="var(--text-faint)" font-size="12" font-family="IBM Plex Mono, monospace">' + only + '</text>' : '') +
        '</svg>';
    }
    var vs = series.map(function (p) { return p.v; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), rng = (mx - mn) || 1;
    var innerW = w - padX * 2, innerH = h - padY * 2;
    var pts = series.map(function (p, i) {
      return [padX + (i / (series.length - 1)) * innerW, padY + innerH - ((p.v - mn) / rng) * innerH];
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = d + " L " + pts[pts.length - 1][0].toFixed(1) + " " + h + " L " + pts[0][0].toFixed(1) + " " + h + " Z";
    var dots = pts.map(function (p, i) {
      var last = i === pts.length - 1;
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (last ? 4 : 3) + '" fill="var(--accent)"' +
        (last ? '' : ' fill-opacity="0.9"') + ' stroke="var(--surface)" stroke-width="1.5"/>';
    }).join("");
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<path d="' + area + '" fill="var(--accent)" fill-opacity="0.10"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots +
      '<text x="' + padX + '" y="10" fill="var(--text-faint)" font-size="11" font-family="IBM Plex Mono, monospace">' + fmt(mx) + '</text>' +
      '<text x="' + padX + '" y="' + h + '" fill="var(--text-faint)" font-size="11" font-family="IBM Plex Mono, monospace">' + fmt(mn) + '</text>' +
      '</svg>';
  }

  /* ============================================================ BODY */
  var MEAS = [
    { id: "chest", name: "Chest" }, { id: "arms", name: "Arms" },
    { id: "waist", name: "Waist" }, { id: "hips", name: "Hips" },
    { id: "thighs", name: "Thighs" }, { id: "calves", name: "Calves" }
  ];
  function L() { return db.settings.lengthUnit; }

  // Jackson–Pollock skinfold equations (folds in mm). 3- and 7-site give body
  // density -> Siri (495/BD − 450); 4-site gives %BF directly.
  var SF_SITES = {
    chest: "Chest", axilla: "Midaxillary", triceps: "Triceps", subscap: "Subscapular",
    abdomen: "Abdomen", suprailiac: "Suprailiac", thigh: "Thigh"
  };
  // right side of the body; view = which figure it sits on, c = ring centre, l = fold line
  var SF_GUIDE = {
    chest: { dir: "Diagonal", view: "f", c: [70, 121], l: [64, 114, 76, 128],
      how: "On the line from the front of the armpit to the nipple — halfway along for men, a third of the way from the armpit for women. The fold runs along that line." },
    axilla: { dir: "Vertical", view: "f", c: [57, 160], l: [57, 152, 57, 168],
      how: "Side of the torso, straight down from the middle of the armpit, level with the bottom tip of the breastbone. Lift the arm slightly out of the way." },
    triceps: { dir: "Vertical", view: "b", c: [158, 146], l: [158, 138, 158, 154],
      how: "Back of the upper arm on the midline, halfway between the tip of the shoulder and the point of the elbow. Arm hangs loose." },
    subscap: { dir: "Diagonal 45°", view: "b", c: [122, 158], l: [116, 151, 128, 165],
      how: "1–2 cm below the bottom corner of the shoulder blade, fold angled down and outward along the natural skin line. Needs a partner." },
    abdomen: { dir: "Vertical", view: "f", c: [88, 206], l: [88, 198, 88, 214],
      how: "About 2 cm to the right of the navel. Stay relaxed — don't brace or suck in." },
    suprailiac: { dir: "Diagonal", view: "f", c: [72, 232], l: [78, 225, 66, 239],
      how: "Just above the top of the hip bone, in line with the front of the armpit. The fold follows the hip bone's angle, down and in." },
    thigh: { dir: "Vertical", view: "f", c: [81, 312], l: [81, 304, 81, 320],
      how: "Front of the thigh on the midline, halfway between the hip crease and the top of the kneecap. Weight on the other leg." }
  };
  function sfFigure(site) {
    var g = SF_GUIDE[site], F = 'fill="var(--fig)"', M = 'fill="none" stroke="var(--fig-line)" stroke-width="1.4" stroke-linecap="round"';
    var limb = function (d, w) { return '<path d="' + d + '" stroke="var(--fig)" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'; };
    var body = '<ellipse cx="100" cy="38" rx="21" ry="26" ' + F + '/><rect x="89" y="58" width="22" height="26" rx="6" ' + F + '/>' +
      '<path d="M72 82 Q100 76 128 82 L150 92 Q159 99 156 116 L146 170 Q136 200 134 225 L140 264 L60 264 L66 225 Q64 200 54 170 L44 116 Q41 99 50 92 Z" ' + F + '/>' +
      limb("M50 102 L38 190 L31 282", 21) + limb("M150 102 L162 190 L169 282", 21) +
      limb("M82 258 L80 340 L80 408", 31) + limb("M118 258 L120 340 L120 408", 31);
    var marks = g.view === "f"
      ? '<path ' + M + ' d="M72 138 Q86 146 98 138 M102 138 Q114 146 128 138 M100 150 L100 166 M68 238 Q100 256 132 238"/><circle cx="100" cy="206" r="2.4" ' + M + '/>'
      : '<path ' + M + ' d="M100 84 L100 240 M90 102 Q76 104 72 110 L86 146 Q92 138 92 110 Z M110 102 Q124 104 128 110 L114 146 Q108 138 108 110 Z M68 238 Q100 250 132 238"/>';
    return '<svg viewBox="' + (g.c[0] - 55) + ' ' + (g.c[1] - 55) + ' 110 110" aria-hidden="true">' + body + marks +
      '<g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><circle cx="' + g.c[0] + '" cy="' + g.c[1] + '" r="11"/>' +
      '<path d="M' + g.l[0] + ' ' + g.l[1] + ' L' + g.l[2] + ' ' + g.l[3] + '"/></g></svg>';
  }
  var JP = {
    jp3: { name: "3-site", sites: function (sex) { return sex === "f" ? ["triceps", "suprailiac", "thigh"] : ["chest", "abdomen", "thigh"]; },
      bf: function (S, age, sex) {
        var bd = sex === "f" ? 1.0994921 - 0.0009929 * S + 0.0000023 * S * S - 0.0001392 * age
                             : 1.10938 - 0.0008267 * S + 0.0000016 * S * S - 0.0002574 * age;
